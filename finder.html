<!DOCTYPE html>
<html lang="de" data-theme="dark" data-scale="normal" data-accent="contrast">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>SAMS Match Finder</title>
  <style>
    /* CSS Design Tokens für Liquid Glass & Skalierung */
    :root {
      --font-scale: 0.95rem;
      --pad-scale: 1;
      --radius-card: 20px;
      --radius-pill: 9999px;
      --radius-inner: 14px;
      --ease-ios: cubic-bezier(0.16, 1, 0.3, 1);
      --ease-bounce: cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    [data-scale="compact"] { --font-scale: 0.85rem; --pad-scale: 0.85; --radius-card: 16px; --radius-inner: 10px; }
    [data-scale="large"] { --font-scale: 1.08rem; --pad-scale: 1.15; --radius-card: 24px; --radius-inner: 16px; }

    /* Dark Liquid Glass Palette */
    [data-theme="dark"] {
      --bg-body: #030508;
      --bg-gradient: radial-gradient(circle at 15% -10%, rgba(10, 132, 255, 0.22) 0%, transparent 45%),
                      radial-gradient(circle at 85% 110%, rgba(48, 209, 88, 0.12) 0%, transparent 50%),
                      radial-gradient(circle at 50% 50%, rgba(191, 90, 242, 0.08) 0%, transparent 60%);
      --glass-capsule-bg: rgba(20, 22, 28, 0.82);
      --glass-surface: rgba(255, 255, 255, 0.07);
      --glass-surface-hover: rgba(255, 255, 255, 0.13);
      --glass-border: rgba(255, 255, 255, 0.14);
      --glass-border-light: rgba(255, 255, 255, 0.26);
      --glass-shadow: 0 16px 40px rgba(0, 0, 0, 0.65), inset 0 1px 1px rgba(255, 255, 255, 0.25);
      --text-primary: #ffffff;
      --text-muted: #98989d;
      --accent-contrast: #ffffff;
      --badge-bg: rgba(255, 255, 255, 0.09);
      --badge-border: rgba(255, 255, 255, 0.2);
      --input-bg: rgba(0, 0, 0, 0.5);
      --modal-bg: rgba(14, 16, 22, 0.94);
      
      --past-card-bg: rgba(255, 255, 255, 0.02);
      --past-border: rgba(255, 255, 255, 0.06);
      --past-opacity: 0.52;
    }

    /* Light Liquid Glass Palette */
    [data-theme="light"] {
      --bg-body: #f2f2f7;
      --bg-gradient: radial-gradient(circle at 20% -10%, rgba(0, 122, 255, 0.14) 0%, transparent 45%),
                      radial-gradient(circle at 80% 110%, rgba(52, 199, 89, 0.12) 0%, transparent 50%);
      --glass-capsule-bg: rgba(255, 255, 255, 0.88);
      --glass-surface: rgba(255, 255, 255, 0.76);
      --glass-surface-hover: rgba(255, 255, 255, 0.92);
      --glass-border: rgba(0, 0, 0, 0.12);
      --glass-border-light: rgba(0, 0, 0, 0.2);
      --glass-shadow: 0 12px 32px rgba(0, 0, 0, 0.08), inset 0 1px 1px rgba(255, 255, 255, 0.9);
      --text-primary: #000000;
      --text-muted: #6c6c70;
      --accent-contrast: #000000;
      --badge-bg: rgba(0, 0, 0, 0.06);
      --badge-border: rgba(0, 0, 0, 0.14);
      --input-bg: rgba(255, 255, 255, 0.85);
      --modal-bg: rgba(245, 245, 250, 0.95);
      
      --past-card-bg: rgba(0, 0, 0, 0.02);
      --past-border: rgba(0, 0, 0, 0.05);
      --past-opacity: 0.60;
    }

    /* Dynamische Akzentfarben */
    [data-accent="contrast"][data-theme="dark"] { --accent: #ffffff; --accent-glow: rgba(255, 255, 255, 0.35); --accent-text: #000000; }
    [data-accent="contrast"][data-theme="light"] { --accent: #000000; --accent-glow: rgba(0, 0, 0, 0.25); --accent-text: #ffffff; }
    [data-accent="blue"] { --accent: #0a84ff; --accent-glow: rgba(10, 132, 255, 0.38); --accent-text: #ffffff; }
    [data-accent="emerald"] { --accent: #30d158; --accent-glow: rgba(48, 209, 88, 0.38); --accent-text: #000000; }
    [data-accent="orange"] { --accent: #ff9f0a; --accent-glow: rgba(255, 159, 10, 0.38); --accent-text: #000000; }
    [data-accent="purple"] { --accent: #bf5af2; --accent-glow: rgba(191, 90, 242, 0.38); --accent-text: #ffffff; }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    body {
      background-color: var(--bg-body);
      background-image: var(--bg-gradient);
      background-attachment: fixed;
      color: var(--text-primary);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, sans-serif;
      font-size: var(--font-scale);
      padding: env(safe-area-inset-top, 16px) 16px calc(env(safe-area-inset-bottom, 24px) + 32px) 16px;
      line-height: 1.4;
      -webkit-font-smoothing: antialiased;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    .container { max-width: 1040px; margin: 0 auto; }

    /* Header Bereich */
    .scrollable-header { padding: 10px 4px 16px 4px; text-align: center; }
    h1 { font-size: calc(1.75rem * var(--pad-scale)); font-weight: 800; letter-spacing: -0.6px; }
    .subtitle { color: var(--text-muted); font-size: calc(0.85rem * var(--pad-scale)); margin-top: 3px; }

    /* Schwebende Liquid Capsule Leiste */
    .floating-bar-wrapper {
      position: sticky;
      top: 10px;
      z-index: 100;
      margin: 0 auto 20px auto;
      max-width: 740px;
      width: 100%;
      pointer-events: none;
    }

    .search-row {
      pointer-events: auto;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 5px 6px;
      background: var(--glass-capsule-bg);
      backdrop-filter: blur(28px) saturate(200%);
      -webkit-backdrop-filter: blur(28px) saturate(200%);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-pill);
      box-shadow: var(--glass-shadow);
      position: relative;
      transition: border-color 0.25s ease, box-shadow 0.25s ease;
    }

    .search-row:focus-within {
      border-color: var(--accent);
      box-shadow: var(--glass-shadow), 0 0 0 3px var(--accent-glow);
    }

    .search-wrapper { position: relative; flex: 1; }
    .search-box {
      width: 100%;
      height: calc(42px * var(--pad-scale));
      padding: 0 14px 0 40px;
      background: transparent;
      border: none;
      color: var(--text-primary);
      font-size: calc(0.92rem * var(--pad-scale));
      outline: none;
    }
    .search-box::placeholder { color: var(--text-muted); opacity: 0.8; }
    .search-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      width: 18px;
      height: 18px;
      fill: var(--text-muted);
      pointer-events: none;
      transition: fill 0.2s ease;
    }
    .search-box:focus + .search-icon { fill: var(--accent); }

    /* Runde Icon Buttons */
    .icon-btn {
      width: calc(40px * var(--pad-scale));
      height: calc(40px * var(--pad-scale));
      border-radius: 50%;
      background: var(--glass-surface);
      border: 1px solid var(--glass-border);
      color: var(--text-primary);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s var(--ease-bounce);
      flex-shrink: 0;
    }
    .icon-btn:hover { background: var(--glass-surface-hover); transform: scale(1.05); }
    .icon-btn:active { transform: scale(0.92); }
    .icon-btn.active {
      background: var(--accent);
      border-color: var(--accent);
      color: var(--accent-text);
      box-shadow: 0 4px 16px var(--accent-glow);
    }
    .icon-btn.active svg { fill: var(--accent-text); }
    .icon-btn svg { width: 18px; height: 18px; fill: var(--text-primary); }

    /* Autocomplete Menü */
    .autocomplete-list {
      position: absolute;
      top: calc(50px * var(--pad-scale));
      left: 0;
      right: 0;
      background: var(--glass-capsule-bg);
      backdrop-filter: blur(28px) saturate(200%);
      -webkit-backdrop-filter: blur(28px) saturate(200%);
      border: 1px solid var(--glass-border-light);
      border-radius: var(--radius-card);
      box-shadow: var(--glass-shadow);
      max-height: 220px;
      overflow-y: auto;
      z-index: 105;
      display: none;
    }
    .autocomplete-item {
      padding: 10px 16px;
      font-size: calc(0.88rem * var(--pad-scale));
      cursor: pointer;
      border-bottom: 1px solid var(--glass-border);
      color: var(--text-primary);
    }
    .autocomplete-item:hover { background: var(--glass-surface-hover); color: var(--accent); }

    /* Drawers (Filter & Settings) */
    .drawer-panel {
      pointer-events: auto;
      display: grid;
      grid-template-rows: 0fr;
      opacity: 0;
      transform: translateY(-8px) scale(0.99);
      transition: grid-template-rows 0.3s var(--ease-ios), opacity 0.22s ease, transform 0.25s var(--ease-ios), margin-top 0.25s ease;
      margin-top: 0;
      will-change: transform, opacity, grid-template-rows;
    }
    .drawer-panel.open {
      grid-template-rows: 1fr;
      opacity: 1;
      transform: translateY(0) scale(1);
      margin-top: 10px;
    }
    .drawer-inner { overflow: hidden; }

    .glass-card-panel {
      background: var(--glass-capsule-bg);
      backdrop-filter: blur(28px);
      -webkit-backdrop-filter: blur(28px);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-card);
      padding: calc(16px * var(--pad-scale));
      box-shadow: var(--glass-shadow);
    }

    .filter-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
    .filter-group { display: flex; flex-direction: column; gap: 4px; }
    .filter-group label { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-muted); }
    .filter-control {
      height: calc(38px * var(--pad-scale));
      padding: 0 10px;
      background: var(--input-bg);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-inner);
      color: var(--text-primary);
      font-size: calc(0.85rem * var(--pad-scale));
      outline: none;
    }
    .filter-control option { background: var(--bg-body); color: var(--text-primary); }
    .reset-filters-btn {
      grid-column: 1 / -1;
      height: calc(36px * var(--pad-scale));
      background: var(--glass-surface-hover);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-pill);
      color: var(--text-primary);
      font-size: calc(0.82rem * var(--pad-scale));
      font-weight: 600;
      cursor: pointer;
    }

    /* Settings UI */
    .settings-section { display: flex; flex-direction: column; gap: 14px; }
    .settings-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
    .settings-label { font-size: calc(0.88rem * var(--pad-scale)); font-weight: 600; }
    .settings-subtext { font-size: 11px; color: var(--text-muted); }

    .segmented-control {
      display: inline-flex;
      background: var(--input-bg);
      border: 1px solid var(--glass-border);
      padding: 2px;
      border-radius: var(--radius-pill);
      gap: 3px;
    }
    .segment-btn {
      border: none;
      background: transparent;
      padding: 5px 12px;
      border-radius: var(--radius-pill);
      color: var(--text-muted);
      font-size: calc(0.8rem * var(--pad-scale));
      font-weight: 600;
      cursor: pointer;
    }
    .segment-btn.active { background: var(--accent); color: var(--accent-text); }

    .color-swatches { display: flex; gap: 8px; align-items: center; }
    .swatch {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      border: 2px solid transparent;
      cursor: pointer;
      transition: transform 0.2s ease;
    }
    .swatch:hover { transform: scale(1.15); }
    .swatch.active { border-color: var(--text-primary); transform: scale(1.15); }
    .swatch-contrast { background: linear-gradient(135deg, #ffffff 50%, #000000 50%); border: 1px solid var(--glass-border-light); }
    .swatch-blue { background: #0a84ff; }
    .swatch-emerald { background: #30d158; }
    .swatch-orange { background: #ff9f0a; }
    .swatch-purple { background: #bf5af2; }

    /* Match Liste Grid */
    .match-list { display: grid; grid-template-columns: 1fr; gap: 14px; }
    @media (min-width: 680px) { .match-list { grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); } }
    @media (min-width: 1024px) { .match-list { grid-template-columns: repeat(3, 1fr); } }

    /* Match Karten */
    .match-card {
      background: var(--glass-surface);
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-card);
      padding: calc(18px * var(--pad-scale));
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 14px;
      box-shadow: var(--glass-shadow);
      cursor: pointer;
      animation: glassFadeIn 0.35s var(--ease-ios) forwards;
      transition: transform 0.24s var(--ease-bounce), background 0.2s ease, border-color 0.2s ease, opacity 0.2s ease, filter 0.2s ease;
    }
    .match-card:hover { transform: translateY(-3px) scale(1.01); background: var(--glass-surface-hover); border-color: var(--glass-border-light); }
    .match-card:active { transform: scale(0.98); }

    /* Dezentes Ausgrauen vergangener Spiele */
    .match-card.past-match {
      opacity: var(--past-opacity);
      background: var(--past-card-bg);
      border-color: var(--past-border);
      filter: grayscale(35%);
    }
    .match-card.past-match:hover { opacity: 0.90; filter: grayscale(0%); background: var(--glass-surface-hover); }

    .match-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
    
    .match-league-badge {
      color: var(--accent);
      font-weight: 700;
      background: var(--badge-bg);
      border: 1px solid var(--badge-border);
      padding: 3px 9px;
      border-radius: var(--radius-pill);
      font-size: calc(0.72rem * var(--pad-scale));
    }

    .match-date { color: var(--text-muted); font-weight: 500; font-size: calc(0.78rem * var(--pad-scale)); white-space: nowrap; }

    .teams-versus-container { display: flex; flex-direction: column; gap: 10px; }
    .team-row { display: flex; align-items: center; gap: 10px; }

    .team-logo-wrapper {
      width: calc(34px * var(--pad-scale));
      height: calc(34px * var(--pad-scale));
      border-radius: 50%;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background: var(--glass-surface);
      border: 1px solid var(--glass-border);
    }
    .team-logo-img { width: 100%; height: 100%; object-fit: contain; padding: 2px; }
    .team-logo-fallback {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: calc(0.72rem * var(--pad-scale));
      color: #ffffff;
    }

    .team-name { font-size: calc(0.98rem * var(--pad-scale)); font-weight: 700; color: var(--text-primary); flex: 1; }

    .card-footer-hint {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-top: 1px solid var(--glass-border);
      padding-top: 8px;
      font-size: calc(0.72rem * var(--pad-scale));
      color: var(--text-muted);
    }
    .clickable-hint { color: var(--accent); font-weight: 600; }

    /* Modal Overlay & Details */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }
    .modal-overlay.active { opacity: 1; pointer-events: auto; }

    .modal-card {
      background: var(--modal-bg);
      backdrop-filter: blur(32px);
      -webkit-backdrop-filter: blur(32px);
      border: 1px solid var(--glass-border-light);
      border-radius: calc(24px * var(--pad-scale));
      width: 100%;
      max-width: 480px;
      box-shadow: 0 24px 50px rgba(0, 0, 0, 0.7);
      padding: calc(20px * var(--pad-scale));
      display: flex;
      flex-direction: column;
      gap: 16px;
      transform: scale(0.94) translateY(16px);
      transition: transform 0.3s var(--ease-bounce);
      max-height: 90vh;
      overflow-y: auto;
    }
    .modal-overlay.active .modal-card { transform: scale(1) translateY(0); }

    .modal-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
    .modal-close-btn {
      width: 32px; height: 32px; border-radius: 50%;
      background: var(--glass-surface-hover);
      border: 1px solid var(--glass-border);
      color: var(--text-primary);
      font-size: 16px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
    }

    .hero-versus-box {
      background: var(--glass-surface);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-inner);
      padding: 18px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      text-align: center;
    }
    .hero-team { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; }
    .hero-logo-wrapper {
      width: calc(52px * var(--pad-scale));
      height: calc(52px * var(--pad-scale));
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      overflow: hidden;
      background: var(--glass-surface);
      border: 1px solid var(--glass-border);
    }
    .hero-team-name { font-size: calc(0.88rem * var(--pad-scale)); font-weight: 700; line-height: 1.2; }

    .hero-score-box { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 0 6px; }
    .hero-score-main { font-size: calc(2.2rem * var(--pad-scale)); font-weight: 900; letter-spacing: -1px; color: var(--accent); line-height: 1; }

    .modal-actions { display: flex; flex-direction: column; gap: 8px; margin-top: 4px; }
    .modal-btn {
      width: 100%;
      height: calc(42px * var(--pad-scale));
      border-radius: var(--radius-pill);
      font-size: calc(0.85rem * var(--pad-scale));
      font-weight: 700;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: transform 0.2s var(--ease-bounce);
      text-decoration: none;
    }
    .modal-btn:hover { transform: translateY(-1px); }
    .modal-btn:active { transform: scale(0.96); }
    .modal-btn-primary { background: var(--accent); color: var(--accent-text); box-shadow: 0 4px 16px var(--accent-glow); }
    .modal-btn-secondary { background: var(--glass-surface-hover); color: var(--text-primary); border: 1px solid var(--glass-border-light); }
    .modal-btn-tertiary { background: rgba(255, 255, 255, 0.05); color: var(--text-muted); border: 1px solid var(--glass-border); font-family: monospace; font-size: 11px; }

    /* Toast Info */
    .toast-message {
      position: fixed;
      bottom: 20px; left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: var(--accent); color: var(--accent-text);
      padding: 10px 20px; border-radius: var(--radius-pill);
      font-weight: 700; font-size: 13px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
      z-index: 2000; opacity: 0;
      transition: all 0.25s var(--ease-bounce);
      pointer-events: none;
    }
    .toast-message.show { transform: translateX(-50%) translateY(0); opacity: 1; }

    .status-box {
      grid-column: 1 / -1; text-align: center; color: var(--text-muted);
      padding: 40px 16px; font-size: 14px;
      background: var(--glass-surface); border: 1px solid var(--glass-border);
      border-radius: var(--radius-card);
    }

    @keyframes glassFadeIn { from { opacity: 0; transform: translateY(8px) scale(0.98); } to { opacity: 1; transform: translateY(0) scale(1); } }
  </style>
</head>
<body>

  <div class="container">
    <header class="scrollable-header">
      <h1>SAMS Match Finder</h1>
      <p class="subtitle">Spiele suchen & OBS Scoreboard-Link abrufen</p>
    </header>

    <div class="floating-bar-wrapper">
      <div class="search-row">
        <div class="search-wrapper">
          <input type="text" id="search-input" class="search-box" placeholder="Verein, Team oder Liga suchen..." autocomplete="off">
          <svg class="search-icon" viewBox="0 0 24 24">
            <path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
          </svg>
          <div id="autocomplete-list" class="autocomplete-list"></div>
        </div>

        <button id="filter-toggle" class="icon-btn" aria-label="Filter" title="Filter">
          <svg viewBox="0 0 24 24"><path d="M10 18h4v-2h-4v2zM3 6v2h18V6H3zm3 7h12v-2H6v2z"/></svg>
        </button>

        <button id="settings-toggle" class="icon-btn" aria-label="Einstellungen" title="Einstellungen">

  <div id="toast" class="toast-message">Kopiert!</div>

  <script>
    const WORKER_URL = "https://tickerv2.nick-valbert2006.workers.dev";
    const SCOREBOARD_BASE_URL = "https://kitgaia.github.io/VBTicker/scoreboardV1.html";

    let allMatches = [];
    let leagueLookupMap = new Map();
    let currentActiveMatch = null;

    const LOGO_GRADIENTS = [
      ['#ff416c', '#ff4b2b'], ['#00c6ff', '#0072ff'], ['#f7971e', '#ffd200'],
      ['#11998e', '#38ef7d'], ['#8e2de2', '#4a00e0'], ['#fc466b', '#3f5efb']
    ];

    function getTeamInitials(name) {
      if (!name || name === 'Unbekannt') return '?';
      const parts = name.replace(/[^a-zA-Z0-9\s]/g, '').trim().split(/\s+/);
      if (parts.length >= 2) return (parts[0][0] + parts[1][0]).toUpperCase();
      return name.substring(0, 2).toUpperCase();
    }

    function generateFallbackStyle(name) {
      let hash = 0;
      for (let i = 0; i < (name || '').length; i++) hash = name.charCodeAt(i) + ((hash << 5) - hash);
      const pair = LOGO_GRADIENTS[Math.abs(hash) % LOGO_GRADIENTS.length];
      return `background: linear-gradient(135deg, ${pair[0]}, ${pair[1]});`;
    }

    function recursiveFindLogo(obj, name, id, depth = 0, visited = new Set()) {
      if (!obj || typeof obj !== 'object' || depth > 6 || visited.has(obj)) return null;
      visited.add(obj);

      const keys = ['logoImage200', 'logoImage', 'smallLogoImage', 'clubLogo', 'logo', 'teamLogo', 'logoUrl', 'imageUrl'];
      const objId = obj.id || obj.uuid || obj.teamId;
      const objName = obj.name || obj.teamName || obj.caption;
      const isTarget = (id && String(objId) === String(id)) || (name && typeof objName === 'string' && objName.toLowerCase().trim() === name.toLowerCase().trim());

      if (isTarget || depth === 0) {
        for (const k of keys) {
          if (typeof obj[k] === 'string' && obj[k].trim().length > 5) {
            let u = obj[k].trim();
            if (u.startsWith('//')) u = 'https:' + u;
            else if (u.startsWith('/')) u = 'https://www.volleyball-nrw.de' + u;
            if (u.startsWith('http://') || u.startsWith('https://')) return u;
          }
        }
      }

      for (const k of Object.keys(obj)) {
        if (typeof obj[k] === 'object' && obj[k] !== null) {
          const res = recursiveFindLogo(obj[k], name, id, depth + 1, visited);
          if (res) return res;
        }
      }
      return null;
    }

    function renderLogoElement(logoUrl, name, customClass = "team-logo-wrapper") {
      const init = getTeamInitials(name);
      const style = generateFallbackStyle(name);

      if (logoUrl) {
        return `
          <div class="${customClass}">
            <img src="${logoUrl}" alt="${name}" class="team-logo-img" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
            <div class="team-logo-fallback" style="${style} display:none;">${init}</div>
          </div>`;
      }
      return `<div class="${customClass}"><div class="team-logo-fallback" style="${style}">${init}</div></div>`;
    }

    function parseScore(m) {
      let sets1 = 0, sets2 = 0;
      if (m.score?.sets) {
        sets1 = m.score.sets.team1 ?? 0;
        sets2 = m.score.sets.team2 ?? 0;
      } else if (m.team1Sets !== undefined && m.team2Sets !== undefined) {
        sets1 = Number(m.team1Sets);
        sets2 = Number(m.team2Sets);
      } else if (m.results?.sets1 !== undefined || m.results?.sets2 !== undefined) {
        sets1 = Number(m.results?.sets1 || 0);
        sets2 = Number(m.results?.sets2 || 0);
      }
      return { sets1, sets2 };
    }

    /* RegEx Caching für exakte Wortgrenzen */
    const regexCache = new Map();
    function getExactWordRegex(word) {
      if (regexCache.has(word)) return regexCache.get(word);
      const escaped = word.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
      const isRomanOrNum = /^(i|ii|iii|iv|v|vi|vii|viii|ix|x|[0-9]+)$/i.test(word);
      const rx = new RegExp(isRomanOrNum ? `\\b${escaped}\\b` : `\\b${escaped}`, 'i');
      regexCache.set(word, rx);
      return rx;
    }

    function matchesExactQuery(text, query) {
      if (!query) return true;
      return query.trim().split(/\s+/).filter(Boolean).every(w => getExactWordRegex(w).test(text));
    }

    function debounce(fn, delay = 100) {
      let t;
      return function(...args) { clearTimeout(t); t = setTimeout(() => fn.apply(this, args), delay); };
    }

    document.addEventListener('DOMContentLoaded', () => {
      initSettings();
      initEventListeners();
      loadMatches();
    });

    function initSettings() {
      setTheme(localStorage.getItem('sams_theme') || 'dark');
      setAccent(localStorage.getItem('sams_accent') || 'contrast');
      setScale(localStorage.getItem('sams_scale') || 'normal');
    }

    function setTheme(t) {
      document.documentElement.setAttribute('data-theme', t);
      localStorage.setItem('sams_theme', t);
      document.querySelectorAll('[data-theme-val]').forEach(b => b.classList.toggle('active', b.getAttribute('data-theme-val') === t));
    }

    function setAccent(a) {
      document.documentElement.setAttribute('data-accent', a);
      localStorage.setItem('sams_accent', a);
      document.querySelectorAll('[data-accent-val]').forEach(s => s.classList.toggle('active', s.getAttribute('data-accent-val') === a));
    }

    function setScale(s) {
      document.documentElement.setAttribute('data-scale', s);
      localStorage.setItem('sams_scale', s);
      document.querySelectorAll('[data-scale-val]').forEach(b => b.classList.toggle('active', b.getAttribute('data-scale-val') === s));
    }

    function initEventListeners() {
      const searchInput = document.getElementById('search-input');
      const filterToggle = document.getElementById('filter-toggle');
      const settingsToggle = document.getElementById('settings-toggle');
      const filterDrawer = document.getElementById('filter-drawer');
      const settingsDrawer = document.getElementById('settings-drawer');
      const modalOverlay = document.getElementById('match-modal');

      const debouncedApply = debounce(() => applyFilters(false), 100);

      searchInput.addEventListener('input', (e) => { handleAutocomplete(e.target.value); debouncedApply(); });
      searchInput.addEventListener('focus', (e) => { if (e.target.value.trim()) handleAutocomplete(e.target.value); });
      document.addEventListener('click', (e) => { if (!e.target.closest('.search-wrapper')) closeAutocomplete(); });

      filterToggle.addEventListener('click', () => {
        const open = filterDrawer.classList.toggle('open');
        filterToggle.classList.toggle('active', open);
        if (open) { settingsDrawer.classList.remove('open'); settingsToggle.classList.remove('active'); }
      });

      settingsToggle.addEventListener('click', () => {
        const open = settingsDrawer.classList.toggle('open');
        settingsToggle.classList.toggle('active', open);
        if (open) { filterDrawer.classList.remove('open'); filterToggle.classList.remove('active'); }
      });

      document.getElementById('modal-close-btn').addEventListener('click', closeModal);
      modalOverlay.addEventListener('click', (e) => { if (e.target === modalOverlay) closeModal(); });
      document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModal(); });

      document.querySelectorAll('[data-theme-val]').forEach(b => b.addEventListener('click', () => setTheme(b.getAttribute('data-theme-val'))));
      document.querySelectorAll('[data-accent-val]').forEach(s => s.addEventListener('click', () => setAccent(s.getAttribute('data-accent-val'))));
      document.querySelectorAll('[data-scale-val]').forEach(b => b.addEventListener('click', () => setScale(b.getAttribute('data-scale-val'))));

      document.getElementById('filter-gender').addEventListener('change', () => { updateCascadingDropdowns(); applyFilters(false); });
      document.getElementById('filter-league').addEventListener('change', () => { updateTeamDropdown(); applyFilters(false); });
      document.getElementById('filter-team').addEventListener('change', () => applyFilters(false));
      document.getElementById('filter-date').addEventListener('change', () => applyFilters(false));
      document.getElementById('reset-filters').addEventListener('click', resetFilters);

      document.getElementById('btn-copy-scoreboard').addEventListener('click', () => {
        if (!currentActiveMatch) return;
        copyTextToClipboard(`${SCOREBOARD_BASE_URL}?match=${currentActiveMatch.id}&assoc=wvv`, "Scoreboard-Link kopiert!");
      });

      document.getElementById('btn-copy-id').addEventListener('click', () => {
        if (!currentActiveMatch) return;
        copyTextToClipboard(currentActiveMatch.id, "Match-ID kopiert!");
      });
    }

    function buildLeagueLookupMap(data) {
      leagueLookupMap.clear();
      function walk(obj, depth = 0) {
        if (!obj || typeof obj !== 'object' || depth > 8) return;
        const objId = obj.id || obj.uuid || obj.leagueId || obj.seriesId;
        const objName = obj.name || obj.leagueName || obj.caption || obj.groupName;
        const objGender = obj.gender || obj.leagueGender;

        if (objId && objName && typeof objName === 'string') leagueLookupMap.set(String(objId), { name: objName, gender: objGender || '' });
        if (Array.isArray(obj.matches) && objName) {
          obj.matches.forEach(m => {
            const mId = typeof m === 'object' ? (m.id || m.uuid || m.matchId) : m;
            if (mId) leagueLookupMap.set(`match_${mId}`, { name: objName, gender: objGender || '' });
          });
        }
        for (const k of Object.keys(obj)) if (typeof obj[k] === 'object' && obj[k] !== null) walk(obj[k], depth + 1);
      }
      walk(data);
    }

    async function loadMatches() {
      const statusEl = document.getElementById('status');
      try {
        const response = await fetch(`${WORKER_URL}/?assoc=wvv`);
        if (!response.ok) throw new Error("Worker konnte nicht geladen werden.");

        const data = await response.json();
        allMatches = [];

        buildLeagueLookupMap(data);

        const todayStart = new Date(new Date().setHours(0,0,0,0)).getTime();

        if (Array.isArray(data.matchDays)) {
          data.matchDays.forEach(day => {
            if (Array.isArray(day.matches)) {
              day.matches.forEach(m => {
                const team1Obj = m.team1 || {};
                const team2Obj = m.team2 || {};
                const team1Name = team1Obj.name || m.team1Name || m.teamDescription1 || '';
                const team2Name = team2Obj.name || m.team2Name || m.teamDescription2 || '';
                const team1Id = team1Obj.id || team1Obj.uuid || m.team1Id;
                const team2Id = team2Obj.id || team2Obj.uuid || m.team2Id;

                const matchId = m.id || m.matchId || m.uuid || '';
                const rawDate = m.date || m.startDate || day.date || null;

                const team1Logo = recursiveFindLogo(team1Obj, team1Name, team1Id, 0) || recursiveFindLogo(data, team1Name, team1Id, 0);
                const team2Logo = recursiveFindLogo(team2Obj, team2Name, team2Id, 0) || recursiveFindLogo(data, team2Name, team2Id, 0);

                let rawLeague = m.leagueName || m.league?.name || m.competitionName || m.seriesName;
                let rawGender = m.gender || m.leagueGender || m.league?.gender;

                if (!rawLeague && leagueLookupMap.has(`match_${matchId}`)) {
                  const info = leagueLookupMap.get(`match_${matchId}`);
                  rawLeague = info.name;
                  if (!rawGender) rawGender = info.gender;
                }

                if (!rawLeague) rawLeague = "Unbekannte Liga";
                if (!rawGender) rawGender = parseGenderFromLeague(rawLeague);

                const formattedGender = formatGender(rawGender);
                const leagueDisplay = formattedGender ? `${rawLeague} (${formattedGender})` : rawLeague;

                const dateObj = rawDate ? new Date(rawDate) : new Date(0);
                const matchDayTime = new Date(dateObj.getFullYear(), dateObj.getMonth(), dateObj.getDate()).getTime();
                const isPast = matchDayTime < todayStart;

                const parsed = parseScore(m);

                if (matchId && (team1Name || team2Name)) {
                  allMatches.push({
                    id: String(matchId),
                    team1: team1Name || 'Unbekannt',
                    team2: team2Name || 'Unbekannt',
                    team1Logo: team1Logo,
                    team2Logo: team2Logo,
                    dateObj: dateObj,
                    formattedDate: formatDate(rawDate),
                    rawDateString: rawDate ? new Date(rawDate).toISOString().split('T')[0] : '',
                    leagueRaw: rawLeague,
                    leagueDisplay: leagueDisplay,
                    gender: formattedGender || 'Unbekannt',
                    isPast: isPast,
                    parsedScore: parsed
                  });
                }
              });
            }
          });
        }

        allMatches.sort((a, b) => a.dateObj - b.dateObj);
        updateCascadingDropdowns();
        statusEl.style.display = 'none';
        applyFilters(true);

      } catch (err) {
        statusEl.innerText = "Fehler beim Laden: " + err.message;
      }
    }

    function parseGenderFromLeague(name) {
      if (!name) return '';
      const lower = name.toLowerCase();
      if (lower.includes('männer') || lower.includes('herren')) return 'Herren';
      if (lower.includes('frauen') || lower.includes('damen')) return 'Damen';
      if (lower.includes('mixed')) return 'Mixed';
      return '';
    }

    function formatGender(gStr) {
      if (!gStr) return '';
      const g = gStr.toString().toUpperCase();
      if (g === 'MALE' || g === 'HERREN' || g === 'M') return 'Herren';
      if (g === 'FEMALE' || g === 'DAMEN' || g === 'W') return 'Damen';
      if (g === 'MIXED') return 'Mixed';
      return gStr;
    }

    function updateCascadingDropdowns() {
      const selectedGender = document.getElementById('filter-gender').value;
      const leagueSelect = document.getElementById('filter-league');
      const prev = leagueSelect.value;

      leagueSelect.innerHTML = '<option value="">Alle Ligen</option>';
      const validLeagues = new Map();

      allMatches.forEach(m => {
        if (!selectedGender || m.gender === selectedGender) validLeagues.set(m.leagueRaw, m.leagueDisplay);
      });

      Array.from(validLeagues.entries()).sort((a, b) => a[1].localeCompare(b[1])).forEach(([raw, display]) => {
        const opt = document.createElement('option');
        opt.value = raw; opt.textContent = display;
        leagueSelect.appendChild(opt);
      });

      leagueSelect.value = validLeagues.has(prev) ? prev : "";
      updateTeamDropdown();
    }

    function updateTeamDropdown() {
      const selectedGender = document.getElementById('filter-gender').value;
      const selectedLeague = document.getElementById('filter-league').value;
      const teamSelect = document.getElementById('filter-team');
      const prev = teamSelect.value;

      teamSelect.innerHTML = '<option value="">Alle Mannschaften</option>';
      const validTeams = new Set();

      allMatches.forEach(m => {
        if ((!selectedGender || m.gender === selectedGender) && (!selectedLeague || m.leagueRaw === selectedLeague)) {
          if (m.team1 && m.team1 !== 'Unbekannt') validTeams.add(m.team1);
          if (m.team2 && m.team2 !== 'Unbekannt') validTeams.add(m.team2);
        }
      });

      Array.from(validTeams).sort((a, b) => a.localeCompare(b)).forEach(team => {
        const opt = document.createElement('option');
        opt.value = team; opt.textContent = team;
        teamSelect.appendChild(opt);
      });

      teamSelect.value = validTeams.has(prev) ? prev : "";
    }

    function handleAutocomplete(query) {
      const listEl = document.getElementById('autocomplete-list');
      const val = query.trim();
      if (val.length < 2) { closeAutocomplete(); return; }

      const teams = new Set();
      allMatches.forEach(m => { if (m.team1) teams.add(m.team1); if (m.team2) teams.add(m.team2); });

      const matches = Array.from(teams).filter(t => matchesExactQuery(t, val)).slice(0, 6);
      if (matches.length === 0) { closeAutocomplete(); return; }

      listEl.innerHTML = matches.map(t => `<div class="autocomplete-item" onclick="selectSuggestion('${escapeQuotes(t)}')">${t}</div>`).join('');
      listEl.style.display = 'block';
    }

    function selectSuggestion(team) {
      document.getElementById('search-input').value = team;
      closeAutocomplete();
      applyFilters(false);
    }

    function closeAutocomplete() {
      const listEl = document.getElementById('autocomplete-list');
      listEl.style.display = 'none';
      listEl.innerHTML = '';
    }

    function escapeQuotes(str) { return str.replace(/'/g, "\\'").replace(/"/g, '&quot;'); }

    function applyFilters(shouldJumpToToday = false) {
      const searchVal = document.getElementById('search-input').value;
      const genderVal = document.getElementById('filter-gender').value;
      const leagueVal = document.getElementById('filter-league').value;
      const teamVal = document.getElementById('filter-team').value;
      const dateVal = document.getElementById('filter-date').value;

      const filtered = allMatches.filter(m => {
        const matchesSearch = !searchVal || matchesExactQuery(m.team1, searchVal) || matchesExactQuery(m.team2, searchVal) || m.leagueDisplay.toLowerCase().includes(searchVal.toLowerCase());
        const matchesGender = !genderVal || m.gender === genderVal;
        const matchesLeague = !leagueVal || m.leagueRaw === leagueVal;
        const matchesTeam = !teamVal || m.team1 === teamVal || m.team2 === teamVal;
        const matchesDate = !dateVal || m.rawDateString === dateVal;
        return matchesSearch && matchesGender && matchesLeague && matchesTeam && matchesDate;
      });

      renderMatches(filtered);
      
      // Bei Aufruf und bei aktiven Filtern direkt zum heutigen Tag springen
      jumpDirectlyToToday();
    }

    function resetFilters() {
      document.getElementById('search-input').value = '';
      document.getElementById('filter-gender').value = '';
      document.getElementById('filter-league').value = '';
      document.getElementById('filter-team').value = '';
      document.getElementById('filter-date').value = '';
      closeAutocomplete();
      updateCascadingDropdowns();
      applyFilters(true);
    }

    function renderMatches(matches) {
      const listEl = document.getElementById('match-list');
      if (matches.length === 0) {
        listEl.innerHTML = '<div class="status-box">Keine Begegnungen gefunden.</div>';
        return;
      }

      listEl.innerHTML = matches.map(m => {
        const t1Logo = renderLogoElement(m.team1Logo, m.team1);
        const t2Logo = renderLogoElement(m.team2Logo, m.team2);

        return `
          <div class="match-card ${m.isPast ? 'past-match' : ''}" data-time="${m.dateObj.getTime()}" onclick="openMatchModal('${m.id}')">
            <div>
              <div class="match-header">
                <span class="match-league-badge">${m.leagueDisplay}</span>
                <span class="match-date">${m.formattedDate}</span>
              </div>

              <div class="teams-versus-container" style="margin-top: 12px;">
                <div class="team-row">${t1Logo}<div class="team-name">${m.team1}</div></div>
                <div class="team-row">${t2Logo}<div class="team-name">${m.team2}</div></div>
              </div>
            </div>

            <div class="card-footer-hint">
              <span>Scoreboard & Details</span>
              <span class="clickable-hint">Ansehen &rarr;</span>
            </div>
          </div>`;
      }).join('');
    }

    async function openMatchModal(targetMatchId) {
      const m = allMatches.find(x => String(x.id) === String(targetMatchId));
      if (!m) return;

      currentActiveMatch = m;

      document.getElementById('modal-league-badge').textContent = m.leagueDisplay;
      document.getElementById('modal-match-date').textContent = m.formattedDate;
      document.getElementById('modal-team1-name').textContent = m.team1;
      document.getElementById('modal-team2-name').textContent = m.team2;

      document.getElementById('modal-team1-logo').innerHTML = renderLogoElement(m.team1Logo, m.team1, "hero-logo-wrapper").replace('class="hero-logo-wrapper"', 'style="width:100%;height:100%;"');
      document.getElementById('modal-team2-logo').innerHTML = renderLogoElement(m.team2Logo, m.team2, "hero-logo-wrapper").replace('class="hero-logo-wrapper"', 'style="width:100%;height:100%;"');

      updateModalScore(m.parsedScore);

      document.getElementById('btn-open-scoreboard').setAttribute('href', `${SCOREBOARD_BASE_URL}?match=${m.id}&assoc=wvv`);
      document.getElementById('match-modal').classList.add('active');

      try {
        const liveRes = await fetch(`${WORKER_URL}/?match=${m.id}&assoc=wvv`);
        if (liveRes.ok) {
          const liveData = await liveRes.json();
          const liveParsed = parseScore(liveData);
          updateModalScore(liveParsed);
        }
      } catch (e) {}
    }

    function updateModalScore(parsed) {
      const scoreMain = document.getElementById('modal-hero-score');
      if (parsed.sets1 > 0 || parsed.sets2 > 0) {
        scoreMain.textContent = `${parsed.sets1} : ${parsed.sets2}`;
      } else {
        scoreMain.textContent = "- : -";
      }
    }

    function closeModal() { document.getElementById('match-modal').classList.remove('active'); }

    function formatDate(dateInput) {
      if (!dateInput) return 'Datum unbekannt';
      try {
        const d = new Date(dateInput);
        if (isNaN(d.getTime())) return dateInput;
        return d.toLocaleDateString('de-DE', { weekday: 'short', day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' }) + ' Uhr';
      } catch { return dateInput; }
    }

    function jumpDirectlyToToday() {
      const nowTime = Date.now();
      const cards = document.querySelectorAll('.match-card');
      for (let c of cards) {
        if (parseInt(c.getAttribute('data-time')) >= nowTime) {
          c.scrollIntoView({ behavior: 'auto', block: 'center' });
          break;
        }
      }
    }

    function copyTextToClipboard(text, msg) {
      navigator.clipboard.writeText(text).then(() => showToast(msg)).catch(() => showToast("Fehler beim Kopieren!"));
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2000);
    }
  </script>
</body>
</html>

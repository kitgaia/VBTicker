<!DOCTYPE html>
<html lang="de" data-theme="dark" data-scale="normal" data-accent="contrast">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>SAMS Match Finder</title>
  <style>
    /* CSS Design Tokens for Liquid Glass Aesthetics, Dynamic Themes & Scaling */
    :root {
      --font-scale: 1rem;
      --pad-scale: 1;
      --radius-card: 22px;
      --radius-pill: 9999px;
      --radius-inner: 16px;
      --ease-ios: cubic-bezier(0.16, 1, 0.3, 1);
      --ease-bounce: cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    [data-scale="compact"] {
      --font-scale: 0.88rem;
      --pad-scale: 0.85;
      --radius-card: 18px;
      --radius-inner: 12px;
    }

    [data-scale="large"] {
      --font-scale: 1.12rem;
      --pad-scale: 1.15;
      --radius-card: 26px;
      --radius-inner: 18px;
    }

    /* Dark Liquid Glass Palette */
    [data-theme="dark"] {
      --bg-body: #030508;
      --bg-gradient: radial-gradient(circle at 15% -10%, rgba(10, 132, 255, 0.22) 0%, transparent 45%),
                      radial-gradient(circle at 85% 110%, rgba(48, 209, 88, 0.12) 0%, transparent 50%),
                      radial-gradient(circle at 50% 50%, rgba(191, 90, 242, 0.08) 0%, transparent 60%);
      --glass-capsule-bg: rgba(20, 22, 28, 0.68);
      --glass-surface: rgba(255, 255, 255, 0.07);
      --glass-surface-hover: rgba(255, 255, 255, 0.13);
      --glass-surface-active: rgba(255, 255, 255, 0.18);
      --glass-border: rgba(255, 255, 255, 0.16);
      --glass-border-light: rgba(255, 255, 255, 0.28);
      --glass-shadow: 0 20px 48px rgba(0, 0, 0, 0.65), inset 0 1px 1px rgba(255, 255, 255, 0.28);
      --text-primary: #ffffff;
      --text-muted: #98989d;
      --accent-contrast: #ffffff;
      --badge-bg: rgba(255, 255, 255, 0.1);
      --badge-border: rgba(255, 255, 255, 0.22);
      --input-bg: rgba(0, 0, 0, 0.55);
      
      /* Past Match Specifics (Dark) */
      --past-card-bg: rgba(255, 255, 255, 0.025);
      --past-border: rgba(255, 255, 255, 0.08);
      --past-opacity: 0.42;
      --past-badge-bg: rgba(255, 255, 255, 0.06);
      --past-badge-text: #8e8e93;
    }

    /* Light Liquid Glass Palette */
    [data-theme="light"] {
      --bg-body: #f2f2f7;
      --bg-gradient: radial-gradient(circle at 20% -10%, rgba(0, 122, 255, 0.14) 0%, transparent 45%),
                      radial-gradient(circle at 80% 110%, rgba(52, 199, 89, 0.12) 0%, transparent 50%);
      --glass-capsule-bg: rgba(255, 255, 255, 0.76);
      --glass-surface: rgba(255, 255, 255, 0.72);
      --glass-surface-hover: rgba(255, 255, 255, 0.88);
      --glass-surface-active: rgba(255, 255, 255, 0.95);
      --glass-border: rgba(0, 0, 0, 0.12);
      --glass-border-light: rgba(0, 0, 0, 0.22);
      --glass-shadow: 0 14px 36px rgba(0, 0, 0, 0.09), inset 0 1px 1px rgba(255, 255, 255, 0.95);
      --text-primary: #000000;
      --text-muted: #6c6c70;
      --accent-contrast: #000000;
      --badge-bg: rgba(0, 0, 0, 0.06);
      --badge-border: rgba(0, 0, 0, 0.14);
      --input-bg: rgba(255, 255, 255, 0.85);
      
      /* Past Match Specifics (Light) */
      --past-card-bg: rgba(0, 0, 0, 0.03);
      --past-border: rgba(0, 0, 0, 0.06);
      --past-opacity: 0.52;
      --past-badge-bg: rgba(0, 0, 0, 0.05);
      --past-badge-text: #6c6c70;
    }

    /* Dynamic Accent Color Modes */
    [data-accent="contrast"][data-theme="dark"] { --accent: #ffffff; --accent-glow: rgba(255, 255, 255, 0.35); --accent-text: #000000; }
    [data-accent="contrast"][data-theme="light"] { --accent: #000000; --accent-glow: rgba(0, 0, 0, 0.25); --accent-text: #ffffff; }
    [data-accent="blue"] { --accent: #0a84ff; --accent-glow: rgba(10, 132, 255, 0.38); --accent-text: #ffffff; }
    [data-accent="emerald"] { --accent: #30d158; --accent-glow: rgba(48, 209, 88, 0.38); --accent-text: #000000; }
    [data-accent="orange"] { --accent: #ff9f0a; --accent-glow: rgba(255, 159, 10, 0.38); --accent-text: #000000; }
    [data-accent="purple"] { --accent: #bf5af2; --accent-glow: rgba(191, 90, 242, 0.38); --accent-text: #ffffff; }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-body);
      background-image: var(--bg-gradient);
      background-attachment: fixed;
      color: var(--text-primary);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: var(--font-scale);
      padding: env(safe-area-inset-top, 16px) 16px calc(env(safe-area-inset-bottom, 24px) + 32px) 16px;
      line-height: 1.45;
      -webkit-font-smoothing: antialiased;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    .container {
      max-width: 1080px;
      margin: 0 auto;
    }

    /* 1. Scrollable Header Area (Scrolls out of view naturally) */
    .scrollable-header {
      padding: 12px 6px 18px 6px;
      text-align: center;
    }

    h1 {
      font-size: calc(1.85rem * var(--pad-scale));
      font-weight: 800;
      letter-spacing: -0.7px;
      color: var(--text-primary);
    }

    .subtitle {
      color: var(--text-muted);
      font-size: calc(0.88rem * var(--pad-scale));
      margin-top: 4px;
      font-weight: 400;
    }

    /* 2. Floating Liquid Glass Island (No solid background block) */
    .floating-bar-wrapper {
      position: sticky;
      top: 12px;
      z-index: 100;
      margin: 0 auto 24px auto;
      max-width: 760px;
      width: 100%;
      pointer-events: none; /* Let scroll passes through margins */
    }

    .search-row {
      pointer-events: auto;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px;
      background: var(--glass-capsule-bg);
      backdrop-filter: blur(32px) saturate(210%);
      -webkit-backdrop-filter: blur(32px) saturate(210%);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-pill);
      box-shadow: var(--glass-shadow);
      position: relative;
      transition: transform 0.25s var(--ease-bounce), border-color 0.3s ease, box-shadow 0.3s ease;
      will-change: transform;
    }

    .search-row:focus-within {
      border-color: var(--accent);
      box-shadow: var(--glass-shadow), 0 0 0 3px var(--accent-glow);
    }

    .search-wrapper {
      position: relative;
      flex: 1;
    }

    .search-box {
      width: 100%;
      height: calc(44px * var(--pad-scale));
      padding: 0 16px 0 42px;
      background: transparent;
      border: none;
      color: var(--text-primary);
      font-size: calc(0.95rem * var(--pad-scale));
      outline: none;
    }

    .search-box::placeholder {
      color: var(--text-muted);
      opacity: 0.8;
    }

    .search-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      width: 18px;
      height: 18px;
      fill: var(--text-muted);
      pointer-events: none;
      transition: fill 0.25s ease;
    }

    .search-box:focus + .search-icon,
    .search-wrapper:focus-within .search-icon {
      fill: var(--accent);
    }

    /* Icon Buttons (Circular Filter & Settings Buttons inside capsule) */
    .icon-btn {
      width: calc(42px * var(--pad-scale));
      height: calc(42px * var(--pad-scale));
      border-radius: 50%;
      background: var(--glass-surface);
      border: 1px solid var(--glass-border);
      color: var(--text-primary);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.22s var(--ease-bounce);
      flex-shrink: 0;
      position: relative;
      overflow: hidden;
    }

    /* Liquid Glass Shimmer effect on hover */
    .icon-btn::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: linear-gradient(45deg, transparent 40%, rgba(255, 255, 255, 0.2) 50%, transparent 60%);
      transform: rotate(25deg) translateY(-100%);
      transition: transform 0.6s ease;
    }

    .icon-btn:hover::before {
      transform: rotate(25deg) translateY(100%);
    }

    .icon-btn:hover {
      background: var(--glass-surface-hover);
      transform: scale(1.06);
    }

    .icon-btn:active {
      transform: scale(0.92);
      opacity: 0.85;
    }

    .icon-btn.active {
      background: var(--accent);
      border-color: var(--accent);
      color: var(--accent-text);
      box-shadow: 0 4px 18px var(--accent-glow);
    }

    .icon-btn.active svg {
      fill: var(--accent-text);
    }

    .icon-btn svg {
      width: 19px;
      height: 19px;
      fill: var(--text-primary);
      transition: fill 0.2s ease, transform 0.3s var(--ease-bounce);
    }

    .icon-btn:hover svg {
      transform: rotate(12deg);
    }

    /* Autocomplete Suggestion Floating Dropdown */
    .autocomplete-list {
      position: absolute;
      top: calc(54px * var(--pad-scale));
      left: 0;
      right: 0;
      background: var(--glass-capsule-bg);
      backdrop-filter: blur(32px) saturate(210%);
      -webkit-backdrop-filter: blur(32px) saturate(210%);
      border: 1px solid var(--glass-border-light);
      border-radius: var(--radius-card);
      box-shadow: var(--glass-shadow);
      max-height: 250px;
      overflow-y: auto;
      z-index: 105;
      display: none;
    }

    .autocomplete-item {
      padding: 12px 18px;
      font-size: calc(0.9rem * var(--pad-scale));
      cursor: pointer;
      border-bottom: 1px solid var(--glass-border);
      color: var(--text-primary);
      transition: background 0.15s ease;
    }

    .autocomplete-item:last-child {
      border-bottom: none;
    }

    .autocomplete-item:hover, .autocomplete-item:active {
      background: var(--glass-surface-hover);
      color: var(--accent);
    }

    /* Highly Optimized GPU-Accelerated Drawer Panels (No Layout Reflow Lag!) */
    .drawer-panel {
      pointer-events: auto;
      display: grid;
      grid-template-rows: 0fr;
      opacity: 0;
      transform: translateY(-10px) scale(0.98);
      transition: grid-template-rows 0.32s var(--ease-ios), 
                  opacity 0.25s ease, 
                  transform 0.3s var(--ease-ios), 
                  margin-top 0.28s ease;
      margin-top: 0;
      will-change: transform, opacity, grid-template-rows;
    }

    .drawer-panel.open {
      grid-template-rows: 1fr;
      opacity: 1;
      transform: translateY(0) scale(1);
      margin-top: 12px;
    }

    .drawer-inner {
      overflow: hidden;
    }

    .glass-card-panel {
      background: var(--glass-capsule-bg);
      backdrop-filter: blur(32px) saturate(210%);
      -webkit-backdrop-filter: blur(32px) saturate(210%);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-card);
      padding: calc(18px * var(--pad-scale));
      box-shadow: var(--glass-shadow);
    }

    .filter-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 12px;
    }

    .filter-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .filter-group label {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: var(--text-muted);
    }

    .filter-control {
      height: calc(42px * var(--pad-scale));
      padding: 0 12px;
      background: var(--input-bg);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-inner);
      color: var(--text-primary);
      font-size: calc(0.88rem * var(--pad-scale));
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .filter-control option {
      background: var(--bg-body);
      color: var(--text-primary);
    }

    .filter-control:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px var(--accent-glow);
    }

    .reset-filters-btn {
      grid-column: 1 / -1;
      height: calc(40px * var(--pad-scale));
      background: var(--glass-surface-hover);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-pill);
      color: var(--text-primary);
      font-size: calc(0.85rem * var(--pad-scale));
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s var(--ease-bounce);
    }

    .reset-filters-btn:hover {
      background: var(--glass-border-light);
      transform: translateY(-1px);
    }

    .reset-filters-btn:active {
      transform: scale(0.97);
    }

    /* Settings UI Section */
    .settings-section {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .settings-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }

    .settings-label {
      font-size: calc(0.92rem * var(--pad-scale));
      font-weight: 600;
    }

    .settings-subtext {
      font-size: 12px;
      color: var(--text-muted);
    }

    /* Segmented Controls */
    .segmented-control {
      display: inline-flex;
      background: var(--input-bg);
      border: 1px solid var(--glass-border);
      padding: 3px;
      border-radius: var(--radius-pill);
      gap: 4px;
    }

    .segment-btn {
      border: none;
      background: transparent;
      padding: 6px 14px;
      border-radius: var(--radius-pill);
      color: var(--text-muted);
      font-size: calc(0.82rem * var(--pad-scale));
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s var(--ease-bounce);
    }

    .segment-btn.active {
      background: var(--accent);
      color: var(--accent-text);
      box-shadow: 0 2px 10px var(--accent-glow);
    }

    /* Color Swatches */
    .color-swatches {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .swatch {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 2px solid transparent;
      cursor: pointer;
      transition: transform 0.25s var(--ease-bounce), border-color 0.2s ease;
    }

    .swatch:hover {
      transform: scale(1.18);
    }

    .swatch.active {
      border-color: var(--text-primary);
      transform: scale(1.18);
      box-shadow: 0 0 0 2px var(--bg-body);
    }

    .swatch-contrast { background: linear-gradient(135deg, #ffffff 50%, #000000 50%); border: 1px solid var(--glass-border-light); }
    .swatch-blue { background: #0a84ff; }
    .swatch-emerald { background: #30d158; }
    .swatch-orange { background: #ff9f0a; }
    .swatch-purple { background: #bf5af2; }

    /* 3. Responsive Multi-Column Grid Layout (Desktop & Tablet) */
    .match-list {
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
    }

    @media (min-width: 680px) {
      .match-list {
        grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      }
      .filter-grid {
        grid-template-columns: repeat(4, 1fr);
      }
    }

    @media (min-width: 1024px) {
      .match-list {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    /* Match Cards with Refined Liquid Glass Effect & Animations */
    .match-card {
      background: var(--glass-surface);
      backdrop-filter: blur(24px) saturate(180%);
      -webkit-backdrop-filter: blur(24px) saturate(180%);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-card);
      padding: calc(18px * var(--pad-scale));
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 12px;
      box-shadow: var(--glass-shadow);
      position: relative;
      overflow: hidden;
      animation: glassFadeIn 0.38s var(--ease-ios) forwards;
      transition: transform 0.28s var(--ease-bounce), 
                  background 0.22s ease, 
                  border-color 0.22s ease, 
                  opacity 0.22s ease, 
                  filter 0.22s ease;
      will-change: transform;
    }

    .match-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.08), transparent);
      transition: transform 0.75s ease;
      pointer-events: none;
    }

    .match-card:hover::before {
      transform: translateX(200%);
    }

    .match-card:hover {
      transform: translateY(-3px) scale(1.01);
      background: var(--glass-surface-hover);
      border-color: var(--glass-border-light);
    }

    .match-card:active {
      transform: scale(0.98);
    }

    /* Visual Styling for Past / Completed Matches */
    .match-card.past-match {
      opacity: var(--past-opacity);
      background: var(--past-card-bg);
      border-color: var(--past-border);
      filter: grayscale(40%) contrast(90%);
    }

    .match-card.past-match:hover {
      opacity: 0.88;
      filter: grayscale(0%) contrast(100%);
      background: var(--glass-surface-hover);
    }

    .match-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      font-size: calc(0.8rem * var(--pad-scale));
      gap: 10px;
    }

    .badge-container {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .match-league-badge {
      color: var(--accent);
      font-weight: 700;
      background: var(--badge-bg);
      border: 1px solid var(--badge-border);
      padding: 4px 10px;
      border-radius: var(--radius-pill);
      font-size: calc(0.75rem * var(--pad-scale));
      letter-spacing: -0.01em;
    }

    /* Past Match Badge Indicator */
    .past-status-badge {
      background: var(--past-badge-bg);
      color: var(--past-badge-text);
      border: 1px solid var(--glass-border);
      padding: 3px 8px;
      border-radius: var(--radius-pill);
      font-size: calc(0.7rem * var(--pad-scale));
      font-weight: 600;
      letter-spacing: -0.01em;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .match-date {
      color: var(--text-muted);
      font-weight: 500;
      font-size: calc(0.8rem * var(--pad-scale));
      white-space: nowrap;
    }

    .match-teams {
      font-size: calc(1.08rem * var(--pad-scale));
      font-weight: 700;
      color: var(--text-primary);
      line-height: 1.35;
      letter-spacing: -0.015em;
    }

    .match-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 4px;
      padding-top: 10px;
      border-top: 1px solid var(--glass-border);
      gap: 10px;
    }

    .match-id {
      font-family: SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: calc(0.72rem * var(--pad-scale));
      color: var(--text-muted);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .btn-group {
      display: flex;
      gap: 8px;
      flex-shrink: 0;
    }

    .action-btn {
      border: none;
      height: calc(36px * var(--pad-scale));
      padding: 0 16px;
      font-weight: 600;
      font-size: calc(0.82rem * var(--pad-scale));
      border-radius: var(--radius-pill);
      cursor: pointer;
      transition: all 0.22s var(--ease-bounce);
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .action-btn:hover {
      transform: translateY(-2px) scale(1.03);
    }

    .action-btn:active {
      transform: scale(0.92);
    }

    .copy-btn {
      background: var(--accent);
      color: var(--accent-text);
      box-shadow: 0 4px 14px var(--accent-glow);
    }

    .copy-btn.copied {
      background: #30d158;
      color: #000000;
      box-shadow: 0 4px 14px rgba(48, 209, 88, 0.4);
    }

    .open-btn {
      background: var(--glass-surface-hover);
      color: var(--text-primary);
      border: 1px solid var(--glass-border);
    }

    .status-box {
      grid-column: 1 / -1;
      text-align: center;
      color: var(--text-muted);
      padding: 48px 20px;
      font-size: 15px;
      background: var(--glass-surface);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-card);
      box-shadow: var(--glass-shadow);
    }

    @keyframes glassFadeIn {
      from {
        opacity: 0;
        transform: translateY(12px) scale(0.98);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- 1. Scrollable Header Area (Scrolls out of view naturally) -->
    <header class="scrollable-header">
      <h1>SAMS Match Finder</h1>
      <p class="subtitle">Begegnungen suchen & OBS-Overlay Link erstellen</p>
    </header>

    <!-- 2. Floating Liquid Glass Capsule Bar (Centered floating island) -->
    <div class="floating-bar-wrapper">
      <div class="search-row">
        <div class="search-wrapper">
          <input type="text" id="search-input" class="search-box" placeholder="Verein, Team oder Liga suchen..." autocomplete="off">
          <svg class="search-icon" viewBox="0 0 24 24">
            <path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
          </svg>

    <!-- 3. Match Grid List Area -->
    <div id="status" class="status-box">Lade aktuelle Spieldaten...</div>
    <div id="match-list" class="match-list"></div>
  </div>

  <script>
    const WORKER_URL = "https://tickerv2.nick-valbert2006.workers.dev";
    const SCOREBOARD_BASE_URL = "https://kitgaia.github.io/VBTicker/scoreboardV1.html";

    let allMatches = [];
    let leagueLookupMap = new Map();

    /* --- Performance Optimization 1: RegEx Caching for Word Boundaries --- */
    const regexCache = new Map();
    function getExactWordRegex(word) {
      if (regexCache.has(word)) return regexCache.get(word);
      const escaped = word.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
      const isRomanOrNum = /^(i|ii|iii|iv|v|vi|vii|viii|ix|x|[0-9]+)$/i.test(word);
      const pattern = isRomanOrNum ? `\\b${escaped}\\b` : `\\b${escaped}`;
      const rx = new RegExp(pattern, 'i');
      regexCache.set(word, rx);
      return rx;
    }

    /* Exact word boundary query matching (e.g., "TuS Meinerzhagen II" vs "III") */
    function matchesExactQuery(text, query) {
      if (!query) return true;
      const words = query.trim().split(/\s+/).filter(Boolean);
      return words.every(word => getExactWordRegex(word).test(text));
    }

    /* --- Performance Optimization 2: Debounce Helper --- */
    function debounce(fn, delay = 100) {
      let timer;
      return function(...args) {
        clearTimeout(timer);
        timer = setTimeout(() => fn.apply(this, args), delay);
      };
    }

    document.addEventListener('DOMContentLoaded', () => {
      initSettings();
      initEventListeners();
      loadMatches();
    });

    /* --- Preferences & Settings Management --- */
    function initSettings() {
      const savedTheme = localStorage.getItem('sams_theme') || 'dark';
      const savedAccent = localStorage.getItem('sams_accent') || 'contrast';
      const savedScale = localStorage.getItem('sams_scale') || 'normal';

      setTheme(savedTheme);
      setAccent(savedAccent);
      setScale(savedScale);
    }

    function setTheme(theme) {
      document.documentElement.setAttribute('data-theme', theme);
      localStorage.setItem('sams_theme', theme);
      document.querySelectorAll('[data-theme-val]').forEach(btn => {
        btn.classList.toggle('active', btn.getAttribute('data-theme-val') === theme);
      });
    }

    function setAccent(accent) {
      document.documentElement.setAttribute('data-accent', accent);
      localStorage.setItem('sams_accent', accent);
      document.querySelectorAll('[data-accent-val]').forEach(swatch => {
        swatch.classList.toggle('active', swatch.getAttribute('data-accent-val') === accent);
      });
    }

    function setScale(scale) {
      document.documentElement.setAttribute('data-scale', scale);
      localStorage.setItem('sams_scale', scale);
      document.querySelectorAll('[data-scale-val]').forEach(btn => {
        btn.classList.toggle('active', btn.getAttribute('data-scale-val') === scale);
      });
    }

    function initEventListeners() {
      const searchInput = document.getElementById('search-input');
      const filterToggle = document.getElementById('filter-toggle');
      const settingsToggle = document.getElementById('settings-toggle');
      const filterDrawer = document.getElementById('filter-drawer');
      const settingsDrawer = document.getElementById('settings-drawer');

      // Debounced search input handler
      const debouncedApplyFilters = debounce(() => applyFilters(false), 100);

      searchInput.addEventListener('input', (e) => {
        handleAutocomplete(e.target.value);
        debouncedApplyFilters();
      });

      searchInput.addEventListener('focus', (e) => {
        if (e.target.value.trim().length > 0) {
          handleAutocomplete(e.target.value);
        }
      });

      document.addEventListener('click', (e) => {
        if (!e.target.closest('.search-wrapper')) {
          closeAutocomplete();
        }
      });

      // Optimized drawer toggling (no reflow lag)
      filterToggle.addEventListener('click', () => {
        const isOpen = filterDrawer.classList.toggle('open');
        filterToggle.classList.toggle('active', isOpen);
        if (isOpen) {
          settingsDrawer.classList.remove('open');
          settingsToggle.classList.remove('active');
        }
      });

      settingsToggle.addEventListener('click', () => {
        const isOpen = settingsDrawer.classList.toggle('open');
        settingsToggle.classList.toggle('active', isOpen);
        if (isOpen) {
          filterDrawer.classList.remove('open');
          filterToggle.classList.remove('active');
        }
      });

      // Settings Buttons Listeners
      document.querySelectorAll('[data-theme-val]').forEach(btn => {
        btn.addEventListener('click', () => setTheme(btn.getAttribute('data-theme-val')));
      });

      document.querySelectorAll('[data-accent-val]').forEach(swatch => {
        swatch.addEventListener('click', () => setAccent(swatch.getAttribute('data-accent-val')));
      });

      document.querySelectorAll('[data-scale-val]').forEach(btn => {
        btn.addEventListener('click', () => setScale(btn.getAttribute('data-scale-val')));
      });

      // Cascading Filter Reactions
      document.getElementById('filter-gender').addEventListener('change', () => {
        updateCascadingDropdowns();
        applyFilters(false);
      });

      document.getElementById('filter-league').addEventListener('change', () => {
        updateTeamDropdown();
        applyFilters(false);
      });

      document.getElementById('filter-team').addEventListener('change', () => applyFilters(false));
      document.getElementById('filter-date').addEventListener('change', () => applyFilters(false));
      document.getElementById('reset-filters').addEventListener('click', resetFilters);
    }

    /* --- Performance Optimization 3: Single-Pass Tree Indexing --- */
    function buildLeagueLookupMap(data) {
      leagueLookupMap.clear();

      function walk(obj, depth = 0) {
        if (!obj || typeof obj !== 'object' || depth > 8) return;

        const objId = obj.id || obj.uuid || obj.leagueId || obj.seriesId || obj.matchSeriesId;
        const objName = obj.name || obj.leagueName || obj.competitionName || obj.caption || obj.groupName || obj.title || obj.seriesName;
        const objGender = obj.gender || obj.leagueGender || obj.competitionGender;

        if (objId && objName && typeof objName === 'string') {
          leagueLookupMap.set(String(objId), { name: objName, gender: objGender || '' });
        }

        if (Array.isArray(obj.matches) && objName) {
          obj.matches.forEach(m => {
            const mId = typeof m === 'object' ? (m.id || m.uuid || m.matchId) : m;
            if (mId) {
              leagueLookupMap.set(`match_${mId}`, { name: objName, gender: objGender || '' });
            }
          });
        }

        for (const key of Object.keys(obj)) {
          if (typeof obj[key] === 'object' && obj[key] !== null) {
            walk(obj[key], depth + 1);
          }
        }
      }

      walk(data);
    }

    function deepSearchLeagueAndGender(rootData, matchId, matchObj) {
      let foundName = null;
      let foundGender = null;

      function search(obj, depth = 0) {
        if (!obj || typeof obj !== 'object' || depth > 8 || (foundName && foundGender)) return;

        const hasMatch = Array.isArray(obj.matches) && obj.matches.some(m => {
          const id = typeof m === 'object' ? (m.id || m.uuid || m.matchId) : m;
          return id === matchId;
        });

        const targetIds = [matchObj.leagueId, matchObj.seriesId, matchObj.matchSeriesId, matchObj.groupId].filter(Boolean);
        const isTargetId = targetIds.some(id => id === obj.id || id === obj.uuid);

        if (hasMatch || isTargetId) {
          const name = obj.name || obj.leagueName || obj.competitionName || obj.caption || obj.groupName || obj.title;
          const gender = obj.gender || obj.leagueGender || obj.competitionGender;
          
          if (name && !foundName) foundName = name;
          if (gender && !foundGender) foundGender = gender;
        }

        for (const key of Object.keys(obj)) {
          if (typeof obj[key] === 'object' && obj[key] !== null) {
            search(obj[key], depth + 1);
          }
        }
      }

      search(rootData);
      return { name: foundName, gender: foundGender };
    }

    async function loadMatches() {
      const statusEl = document.getElementById('status');
      try {
        const response = await fetch(`${WORKER_URL}/?assoc=wvv`);
        if (!response.ok) throw new Error("Fehler beim Abrufen der Daten vom Worker.");

        const data = await response.json();
        allMatches = [];

        buildLeagueLookupMap(data);

        if (Array.isArray(data.matchDays)) {
          data.matchDays.forEach(day => {
            if (Array.isArray(day.matches)) {
              day.matches.forEach(m => {
                const team1 = m.team1?.name || m.team1Name || m.teamDescription1 || '';
                const team2 = m.team2?.name || m.team2Name || m.teamDescription2 || '';
                const matchId = m.id || m.matchId || m.uuid || m.matchUuid || '';
                const rawDate = m.date || m.startDate || day.date || null;

                let rawLeague = m.leagueName || m.league?.name || m.competitionName || m.groupName || m.seriesName;
                let rawGender = m.gender || m.leagueGender || m.league?.gender;

                if (!rawLeague && leagueLookupMap.has(`match_${matchId}`)) {
                  const info = leagueLookupMap.get(`match_${matchId}`);
                  rawLeague = info.name;
                  if (!rawGender) rawGender = info.gender;
                }

                const possibleIds = [m.leagueId, m.seriesId, m.matchSeriesId, m.groupId, m.competitionId].filter(Boolean);
                for (const id of possibleIds) {
                  if ((!rawLeague || !rawGender) && leagueLookupMap.has(String(id))) {
                    const info = leagueLookupMap.get(String(id));
                    if (!rawLeague) rawLeague = info.name;
                    if (!rawGender) rawGender = info.gender;
                  }
                }

                if (!rawLeague || !rawGender) {
                  const deepRes = deepSearchLeagueAndGender(data, matchId, m);
                  if (!rawLeague) rawLeague = deepRes.name;
                  if (!rawGender) rawGender = deepRes.gender;
                }

                if (!rawLeague) rawLeague = "Unbekannte Liga";
                if (!rawGender) rawGender = parseGenderFromLeague(rawLeague);

                const formattedGender = formatGender(rawGender);
                const leagueDisplay = formattedGender ? `${rawLeague} (${formattedGender})` : rawLeague;

                if (matchId && (team1 || team2)) {
                  allMatches.push({
                    id: matchId,
                    team1: team1 || 'Unbekannt',
                    team2: team2 || 'Unbekannt',
                    dateObj: rawDate ? new Date(rawDate) : new Date(0),
                    formattedDate: formatDate(rawDate),
                    rawDateString: rawDate ? new Date(rawDate).toISOString().split('T')[0] : '',
                    leagueRaw: rawLeague,
                    leagueDisplay: leagueDisplay,
                    gender: formattedGender || 'Unbekannt'
                  });
                }
              });
            }
          });
        }

        allMatches.sort((a, b) => a.dateObj - b.dateObj);

        updateCascadingDropdowns();
        statusEl.style.display = 'none';
        
        applyFilters(true);

      } catch (err) {
        statusEl.innerText = "Fehler beim Laden: " + err.message;
      }
    }

    function parseGenderFromLeague(leagueName) {
      if (!leagueName) return '';
      const lower = leagueName.toLowerCase();
      if (lower.includes('männer') || lower.includes('herren') || lower.includes(' männer')) return 'Herren';
      if (lower.includes('frauen') || lower.includes('damen') || lower.includes(' damen')) return 'Damen';
      if (lower.includes('mixed')) return 'Mixed';
      return '';
    }

    function formatGender(genderStr) {
      if (!genderStr) return '';
      const g = genderStr.toString().toUpperCase();
      if (g === 'MALE' || g === 'MÄNNER' || g === 'HERREN' || g === 'M') return 'Herren';
      if (g === 'FEMALE' || g === 'FRAUEN' || g === 'DAMEN' || g === 'W') return 'Damen';
      if (g === 'MIXED') return 'Mixed';
      return genderStr;
    }

    /* --- Cascading Filter Logic (Gender -> League -> Team) --- */
    function updateCascadingDropdowns() {
      const selectedGender = document.getElementById('filter-gender').value;
      const leagueSelect = document.getElementById('filter-league');
      const previousSelectedLeague = leagueSelect.value;

      leagueSelect.innerHTML = '<option value="">Alle Ligen</option>';

      const validLeagues = new Map();
      allMatches.forEach(m => {
        if (!selectedGender || m.gender === selectedGender) {
          validLeagues.set(m.leagueRaw, m.leagueDisplay);
        }
      });

      Array.from(validLeagues.entries())
        .sort((a, b) => a[1].localeCompare(b[1]))
        .forEach(([raw, display]) => {
          const opt = document.createElement('option');
          opt.value = raw;
          opt.textContent = display;
          leagueSelect.appendChild(opt);
        });

      if (validLeagues.has(previousSelectedLeague)) {
        leagueSelect.value = previousSelectedLeague;
      } else {
        leagueSelect.value = "";
      }

      updateTeamDropdown();
    }

    function updateTeamDropdown() {
      const selectedGender = document.getElementById('filter-gender').value;
      const selectedLeague = document.getElementById('filter-league').value;
      const teamSelect = document.getElementById('filter-team');
      const previousSelectedTeam = teamSelect.value;

      teamSelect.innerHTML = '<option value="">Alle Mannschaften</option>';

      const validTeams = new Set();
      allMatches.forEach(m => {
        const matchesGender = !selectedGender || m.gender === selectedGender;
        const matchesLeague = !selectedLeague || m.leagueRaw === selectedLeague;

        if (matchesGender && matchesLeague) {
          if (m.team1 && m.team1 !== 'Unbekannt') validTeams.add(m.team1);
          if (m.team2 && m.team2 !== 'Unbekannt') validTeams.add(m.team2);
        }
      });

      Array.from(validTeams)
        .sort((a, b) => a.localeCompare(b))
        .forEach(team => {
          const opt = document.createElement('option');
          opt.value = team;
          opt.textContent = team;
          teamSelect.appendChild(opt);
        });

      if (validTeams.has(previousSelectedTeam)) {
        teamSelect.value = previousSelectedTeam;
      } else {
        teamSelect.value = "";
      }
    }

    function handleAutocomplete(query) {
      const listEl = document.getElementById('autocomplete-list');
      const val = query.trim();

      if (val.length < 2) {
        closeAutocomplete();
        return;
      }

      const allTeams = new Set();
      allMatches.forEach(m => {
        if (m.team1) allTeams.add(m.team1);
        if (m.team2) allTeams.add(m.team2);
      });

      const matches = Array.from(allTeams)
        .filter(team => matchesExactQuery(team, val))
        .slice(0, 6);

      if (matches.length === 0) {
        closeAutocomplete();
        return;
      }

      listEl.innerHTML = matches.map(team => `
        <div class="autocomplete-item" onclick="selectSuggestion('${escapeQuotes(team)}')">
          ${team}
        </div>
      `).join('');

      listEl.style.display = 'block';
    }

    function selectSuggestion(teamName) {
      document.getElementById('search-input').value = teamName;
      closeAutocomplete();
      applyFilters(false);
    }

    function closeAutocomplete() {
      const listEl = document.getElementById('autocomplete-list');
      listEl.style.display = 'none';
      listEl.innerHTML = '';
    }

    function escapeQuotes(str) {
      return str.replace(/'/g, "\\'").replace(/"/g, '&quot;');
    }

    function applyFilters(shouldJumpToToday = false) {
      const searchVal = document.getElementById('search-input').value;
      const genderVal = document.getElementById('filter-gender').value;
      const leagueVal = document.getElementById('filter-league').value;
      const teamVal = document.getElementById('filter-team').value;
      const dateVal = document.getElementById('filter-date').value;

      const isUnfiltered = !searchVal && !genderVal && !leagueVal && !teamVal && !dateVal;

      const filtered = allMatches.filter(m => {
        const matchesSearch = !searchVal || 
          matchesExactQuery(m.team1, searchVal) ||
          matchesExactQuery(m.team2, searchVal) ||
          m.leagueDisplay.toLowerCase().includes(searchVal.toLowerCase());

        const matchesGender = !genderVal || m.gender === genderVal;
        const matchesLeague = !leagueVal || m.leagueRaw === leagueVal;
        const matchesTeam = !teamVal || 
          m.team1 === teamVal || 
          m.team2 === teamVal;
        const matchesDate = !dateVal || m.rawDateString === dateVal;

        return matchesSearch && matchesGender && matchesLeague && matchesTeam && matchesDate;
      });

      renderMatches(filtered);

      if (shouldJumpToToday && isUnfiltered) {
        jumpDirectlyToToday();
      }
    }

    function resetFilters() {
      document.getElementById('search-input').value = '';
      document.getElementById('filter-gender').value = '';
      document.getElementById('filter-league').value = '';
      document.getElementById('filter-team').value = '';
      document.getElementById('filter-date').value = '';
      closeAutocomplete();
      updateCascadingDropdowns();
      applyFilters(true);
    }

    /* --- Performance Optimization 4: DOM Fragment Batch Rendering --- */
    function renderMatches(matches) {
      const listEl = document.getElementById('match-list');

      if (matches.length === 0) {
        listEl.innerHTML = '<div class="status-box">Keine Begegnungen gefunden.</div>';
        return;
      }

      const now = new Date();
      const todayStart = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();

      const htmlContent = matches.map(m => {
        const fullLink = `${SCOREBOARD_BASE_URL}?match=${m.id}&assoc=wvv`;
        const matchDayTime = new Date(m.dateObj.getFullYear(), m.dateObj.getMonth(), m.dateObj.getDate()).getTime();
        const isPast = matchDayTime < todayStart;

        return `
          <div class="match-card ${isPast ? 'past-match' : ''}" data-time="${m.dateObj.getTime()}">
            <div>
              <div class="match-header">
                <div class="badge-container">
                  <span class="match-league-badge">${m.leagueDisplay}</span>
                  ${isPast ? '<span class="past-status-badge"><span>✓</span> Beendet</span>' : ''}
                </div>
                <span class="match-date">${m.formattedDate}</span>
              </div>
              <div class="match-teams" style="margin-top: 10px;">${m.team1} vs. ${m.team2}</div>
            </div>
            <div class="match-footer">
              <span class="match-id" title="${m.id}">ID: ${m.id}</span>
              <div class="btn-group">
                <a href="${fullLink}" target="_blank" rel="noopener" class="action-btn open-btn">Öffnen</a>
                <button class="action-btn copy-btn" onclick="copyToClipboard('${fullLink}', this)">Kopieren</button>
              </div>
            </div>
          </div>
        `;
      }).join('');

      listEl.innerHTML = htmlContent;
    }

    function formatDate(dateInput) {
      if (!dateInput) return 'Datum unbekannt';
      try {
        const d = new Date(dateInput);
        if (isNaN(d.getTime())) return dateInput;
        return d.toLocaleDateString('de-DE', {
          weekday: 'short',
          day: '2-digit',
          month: '2-digit',
          year: 'numeric',
          hour: '2-digit',
          minute: '2-digit'
        }) + ' Uhr';
      } catch {
        return dateInput;
      }
    }

    function jumpDirectlyToToday() {
      const nowTime = new Date().getTime();
      const cards = document.querySelectorAll('.match-card');
      let targetCard = null;

      for (let card of cards) {
        const cardTime = parseInt(card.getAttribute('data-time'));
        if (cardTime >= nowTime) {
          targetCard = card;
          break;
        }
      }

      if (targetCard) {
        targetCard.scrollIntoView({ behavior: 'auto', block: 'center' });
      }
    }

    function copyToClipboard(text, btnElement) {
      navigator.clipboard.writeText(text).then(() => {
        const originalText = btnElement.innerText;
        btnElement.innerText = "Kopiert!";
        btnElement.classList.add('copied');
        setTimeout(() => {
          btnElement.innerText = originalText;
          btnElement.classList.remove('copied');
        }, 2000);
      }).catch(err => {
        alert('Fehler beim Kopieren: ' + err);
      });
    }
  </script>
</body>
</html>

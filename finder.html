<script>
        async function fuelleSpiele() {
            const container = document.getElementById('ergebnis');
            container.innerHTML = "Lade Daten...";

            const workerUrl = 'https://curly-mode-4eaa.nick-valbert2006.workers.dev/';

            try {
                const response = await fetch(workerUrl);
                const data = await response.json();
                
                // Wir prüfen, ob die Daten direkt ein Array sind, oder ob sie in properties/matches/content stecken
                let matches = [];
                if (Array.isArray(data)) {
                    matches = data;
                } else if (data.matches && Array.isArray(data.matches)) {
                    matches = data.matches;
                } else if (data.content && Array.isArray(data.content)) {
                    matches = data.content;
                } else {
                    // Fallback: Falls es ein einzelnes Objekt oder ein verschachteltes Array ist, wandeln wir es in ein Array um
                    matches = Object.values(data).find(val => Array.isArray(val)) || [data];
                }
                
                const meinerzhagenSpiele = matches.filter(m => {
                    const t1 = m.teamDescription1 || '';
                    const t2 = m.teamDescription2 || '';
                    return t1.toLowerCase().includes('meinerzhagen') || t2.toLowerCase().includes('meinerzhagen');
                });

                if (meinerzhagenSpiele.length === 0) {
                    container.innerHTML = "<p>Keine Spiele für Meinerzhagen gefunden. (Geprüfte Datensätze: " + matches.length + ")</p>";
                    return;
                }

                container.innerHTML = "";
                meinerzhagenSpiele.forEach(m => {
                    const datumFormatiert = new Date(m.date).toLocaleString('de-DE', {
                        dateStyle: 'full',
                        timeStyle: 'short'
                    });

                    const div = document.createElement('div');
                    div.className = 'match-box';
                    div.innerHTML = `
                        <div class="match-teams">${m.teamDescription1} vs ${m.teamDescription2}</div>
                        <div class="match-date">📅 ${datumFormatiert}</div>
                        <div class="match-id">ID: ${m.id}</div>
                    `;
                    container.appendChild(div);
                });

            } catch (error) {
                container.innerHTML = "<p style='color: red;'>Fehler beim Laden der Daten über den Worker.</p>";
                console.error(error);
            }
        }
    </script>

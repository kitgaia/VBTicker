<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>SAMS Match Finder</title>
  <style>
    :root {
      --bg-body: #030508;
      --glass-surface: rgba(255, 255, 255, 0.07);
      --glass-surface-hover: rgba(255, 255, 255, 0.12);
      --glass-border: rgba(255, 255, 255, 0.14);
      --glass-border-light: rgba(255, 255, 255, 0.22);
      --glass-gloss: rgba(255, 255, 255, 0.18);
      --glass-shadow: 0 16px 40px rgba(0, 0, 0, 0.6), inset 0 1px 1px rgba(255, 255, 255, 0.2);
      
      --apple-blue: #0a84ff;
      --apple-blue-glow: rgba(10, 132, 255, 0.35);
      --apple-green: #30d158;
      --apple-gray: #98989d;
      
      --text-primary: #ffffff;
      --text-muted: #a1a1a6;
      
      --radius-pill: 9999px;
      --radius-card: 20px;
      --radius-inner: 14px;
      --ease-ios: cubic-bezier(0.16, 1, 0.3, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-body);
      background-image: 
        radial-gradient(circle at 20% -10%, rgba(10, 132, 255, 0.18) 0%, transparent 50%),
        radial-gradient(circle at 80% 100%, rgba(48, 209, 88, 0.08) 0%, transparent 50%);
      background-attachment: fixed;
      color: var(--text-primary);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
      padding: env(safe-area-inset-top, 12px) 14px calc(env(safe-area-inset-bottom, 24px) + 24px) 14px;
      line-height: 1.45;
      -webkit-font-smoothing: antialiased;
    }

    .container {
      max-width: 680px;
      margin: 0 auto;
    }

    /* Liquid Glass Header */
    .sticky-header {
      position: sticky;
      top: 0;
      background: rgba(3, 5, 8, 0.72);
      backdrop-filter: blur(28px) saturate(200%);
      -webkit-backdrop-filter: blur(28px) saturate(200%);
      padding: calc(8px + env(safe-area-inset-top, 0px)) 0 16px 0;
      z-index: 100;
      border-bottom: 1px solid var(--glass-border);
      margin-bottom: 20px;
    }

    .header-top {
      margin-bottom: 12px;
      padding: 0 4px;
    }

    h1 {
      font-size: 25px;
      font-weight: 700;
      letter-spacing: -0.5px;
      color: var(--text-primary);
    }

    .subtitle {
      color: var(--text-muted);
      font-size: 13px;
      margin-top: 2px;
      font-weight: 400;
    }

    /* Search & Action Row */
    .search-row {
      display: flex;
      align-items: center;
      gap: 10px;
      position: relative;
    }

    .search-wrapper {
      position: relative;
      flex: 1;
    }

    /* Vollständig abgerundete (Pill-förmige) Suchleiste */
    .search-box {
      width: 100%;
      height: 46px;
      padding: 0 16px 0 42px;
      background: var(--glass-surface);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-pill);
      color: var(--text-primary);
      font-size: 15px;
      outline: none;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.18);
      transition: all 0.25s var(--ease-ios);
    }

    .search-box:focus {
      border-color: var(--apple-blue);
      background: rgba(255, 255, 255, 0.11);
      box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.25), 0 0 0 3px var(--apple-blue-glow);
    }

    .search-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      width: 17px;
      height: 17px;
      fill: var(--text-muted);
      pointer-events: none;
    }

    /* Kreisförmiger Filter-Button (nur 3-Striche Icon) */
    .filter-toggle-btn {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      background: var(--glass-surface);
      border: 1px solid var(--glass-border);
      color: var(--apple-blue);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.18);
      transition: all 0.22s var(--ease-ios);
      flex-shrink: 0;
    }

    .filter-toggle-btn:active {
      transform: scale(0.92);
      opacity: 0.85;
    }

    .filter-toggle-btn.active {
      background: var(--apple-blue);
      border-color: var(--apple-blue);
      box-shadow: 0 4px 18px var(--apple-blue-glow);
    }

    .filter-toggle-btn.active svg {
      fill: #ffffff;
    }

    .filter-icon {
      width: 18px;
      height: 18px;
      fill: var(--apple-blue);
      transition: fill 0.2s ease;
    }

    /* Autocomplete Dropdown Panel */
    .autocomplete-list {
      position: absolute;
      top: 52px;
      left: 0;
      right: 0;
      background: rgba(20, 24, 33, 0.92);
      backdrop-filter: blur(30px) saturate(200%);
      -webkit-backdrop-filter: blur(30px) saturate(200%);
      border: 1px solid var(--glass-border-light);
      border-radius: var(--radius-inner);
      box-shadow: var(--glass-shadow);
      max-height: 240px;
      overflow-y: auto;
      z-index: 105;
      display: none;
    }

    .autocomplete-item {
      padding: 12px 18px;
      font-size: 14px;
      cursor: pointer;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      color: var(--text-primary);
      transition: background 0.15s ease;
    }

    .autocomplete-item:last-child {
      border-bottom: none;
    }

    .autocomplete-item:hover, .autocomplete-item:active {
      background: rgba(10, 132, 255, 0.2);
      color: #ffffff;
    }

    /* Liquid Glass Filter Drawer */
    .filter-drawer {
      max-height: 0;
      overflow: hidden;
      opacity: 0;
      transform: translateY(-8px);
      transition: max-height 0.35s var(--ease-ios), opacity 0.25s ease, transform 0.3s var(--ease-ios), margin-top 0.25s ease;
      margin-top: 0;
    }

    .filter-drawer.open {
      max-height: 380px;
      opacity: 1;
      transform: translateY(0);
      margin-top: 14px;
    }

    .filter-grid {
      background: var(--glass-surface);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-card);
      padding: 16px;
      box-shadow: var(--glass-shadow);
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 12px;
    }

    .filter-group {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .filter-group label {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
    }

    .filter-control {
      height: 40px;
      padding: 0 12px;
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-inner);
      color: var(--text-primary);
      font-size: 13px;
      outline: none;
      transition: border-color 0.2s ease;
    }

    .filter-control:focus {
      border-color: var(--apple-blue);
    }

    .reset-filters-btn {
      grid-column: 1 / -1;
      height: 38px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-pill);
      color: var(--text-muted);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .reset-filters-btn:active {
      transform: scale(0.97);
      background: rgba(255, 255, 255, 0.15);
      color: var(--text-primary);
    }

    /* Match List & Liquid Glass Cards */
    .match-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .match-card {
      background: var(--glass-surface);
      backdrop-filter: blur(25px) saturate(180%);
      -webkit-backdrop-filter: blur(25px) saturate(180%);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-card);
      padding: 16px 18px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      box-shadow: var(--glass-shadow);
      animation: glassFadeIn 0.35s var(--ease-ios) forwards;
      transition: transform 0.22s var(--ease-ios), background 0.2s ease, opacity 0.22s ease;
    }

    .match-card:active {
      transform: scale(0.985);
      background: var(--glass-surface-hover);
    }

    /* Dezentes Ausgrauen vergangener Spiele */
    .match-card.past-match {
      opacity: 0.38;
      filter: grayscale(25%);
    }

    .match-card.past-match:hover {
      opacity: 0.8;
      filter: grayscale(0%);
    }

    .match-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      gap: 10px;
    }

    .match-league-badge {
      color: var(--apple-blue);
      font-weight: 600;
      background: rgba(10, 132, 255, 0.15);
      border: 1px solid rgba(10, 132, 255, 0.25);
      padding: 4px 10px;
      border-radius: var(--radius-pill);
      font-size: 11px;
      letter-spacing: -0.01em;
    }

    .match-date {
      color: var(--text-muted);
      font-weight: 500;
      font-size: 12px;
    }

    .match-teams {
      font-size: 16.5px;
      font-weight: 600;
      color: var(--text-primary);
      line-height: 1.4;
      letter-spacing: -0.015em;
    }

    .match-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 2px;
      padding-top: 10px;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
      gap: 10px;
    }

    .match-id {
      font-family: SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 11px;
      color: var(--text-muted);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .btn-group {
      display: flex;
      gap: 8px;
      flex-shrink: 0;
    }

    .action-btn {
      border: none;
      height: 34px;
      padding: 0 15px;
      font-weight: 600;
      font-size: 12px;
      border-radius: var(--radius-pill);
      cursor: pointer;
      transition: all 0.2s var(--ease-ios);
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .action-btn:active {
      transform: scale(0.93);
    }

    .copy-btn {
      background: var(--apple-blue);
      color: #ffffff;
      box-shadow: 0 4px 14px var(--apple-blue-glow);
    }

    .copy-btn.copied {
      background: var(--apple-green);
      color: #ffffff;
      box-shadow: 0 4px 14px rgba(48, 209, 88, 0.35);
    }

    .open-btn {
      background: rgba(255, 255, 255, 0.1);
      color: var(--text-primary);
      border: 1px solid var(--glass-border);
    }

    .status-box {
      text-align: center;
      color: var(--text-muted);
      padding: 44px 20px;
      font-size: 15px;
      background: var(--glass-surface);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-card);
      box-shadow: var(--glass-shadow);
    }

    @keyframes glassFadeIn {
      from {
        opacity: 0;
        transform: translateY(8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 480px) {
      body { padding-left: 10px; padding-right: 10px; }
      .search-box { font-size: 14.5px; }
      .match-teams { font-size: 15.5px; }
      .action-btn { padding: 0 12px; font-size: 11.5px; }
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="sticky-header">
      <div class="header-top">
        <h1>SAMS Match Finder</h1>
        <p class="subtitle">Begegnungen suchen & OBS-Overlay Link erstellen</p>
      </div>

      <div class="search-row">
        <div class="search-wrapper">
          <svg class="search-icon" viewBox="0 0 24 24">
            <path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
          </svg>
          <input type="text" id="search-input" class="search-box" placeholder="Verein, Team oder Liga suchen..." autocomplete="off">
          <div id="autocomplete-list" class="autocomplete-list"></div>
        </div>

        <button id="filter-toggle" class="filter-toggle-btn" aria-label="Filter umschalten">
          <svg class="filter-icon" viewBox="0 0 24 24">
            <path d="M10 18h4v-2h-4v2zM3 6v2h18V6H3zm3 7h12v-2H6v2z"/>
          </svg>
        </button>
      </div>

      <div id="filter-drawer" class="filter-drawer">
        <div class="filter-grid">
          <div class="filter-group">
            <label for="filter-gender">Geschlecht</label>
            <select id="filter-gender" class="filter-control">
              <option value="">Alle</option>
              <option value="Herren">Herren</option>
              <option value="Damen">Damen</option>
              <option value="Mixed">Mixed</option>
            </select>
          </div>

          <div class="filter-group">
            <label for="filter-league">Liga</label>
            <select id="filter-league" class="filter-control">
              <option value="">Alle Ligen</option>
            </select>
          </div>

          <div class="filter-group">
            <label for="filter-team">Mannschaft</label>
            <input type="text" id="filter-team" class="filter-control" placeholder="Name filtern...">
          </div>

          <div class="filter-group">
            <label for="filter-date">Datum</label>
            <input type="date" id="filter-date" class="filter-control">
          </div>

          <button id="reset-filters" class="reset-filters-btn">Filter zurücksetzen</button>
        </div>
      </div>
    </div>

    <div id="status" class="status-box">Lade aktuelle Spieldaten...</div>
    <div id="match-list" class="match-list"></div>
  </div>

  <script>
    const WORKER_URL = "https://tickerv2.nick-valbert2006.workers.dev";
    const SCOREBOARD_BASE_URL = "https://kitgaia.github.io/VBTicker/scoreboardV1.html";

    let allMatches = [];
    let uniqueTeamsSet = new Set();
    let uniqueLeaguesMap = new Map();
    let leagueLookupMap = new Map();

    document.addEventListener('DOMContentLoaded', () => {
      initEventListeners();
      loadMatches();
    });

    function initEventListeners() {
      const searchInput = document.getElementById('search-input');
      const filterToggle = document.getElementById('filter-toggle');
      const filterDrawer = document.getElementById('filter-drawer');

      searchInput.addEventListener('input', (e) => {
        handleAutocomplete(e.target.value);
        applyFilters(false);
      });

      searchInput.addEventListener('focus', (e) => {
        if (e.target.value.trim().length > 0) {
          handleAutocomplete(e.target.value);
        }
      });

      document.addEventListener('click', (e) => {
        if (!e.target.closest('.search-wrapper')) {
          closeAutocomplete();
        }
      });

      filterToggle.addEventListener('click', () => {
        const isOpen = filterDrawer.classList.toggle('open');
        filterToggle.classList.toggle('active', isOpen);
      });

      document.getElementById('filter-gender').addEventListener('change', () => applyFilters(false));
      document.getElementById('filter-league').addEventListener('change', () => applyFilters(false));
      document.getElementById('filter-team').addEventListener('input', () => applyFilters(false));
      document.getElementById('filter-date').addEventListener('change', () => applyFilters(false));
      document.getElementById('reset-filters').addEventListener('click', resetFilters);
    }

    // Exakter Wortgrenzen-Match für Teams (z. B. "TuS Meinerzhagen II" trifft NICHT "TuS Meinerzhagen III")
    function matchesExactQuery(text, query) {
      if (!query) return true;
      const words = query.trim().split(/\s+/).filter(Boolean);

      return words.every(word => {
        const escaped = word.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        const isRomanOrNum = /^(i|ii|iii|iv|v|vi|vii|viii|ix|x|[0-9]+)$/i.test(word);

        const pattern = isRomanOrNum ? `\\b${escaped}\\b` : `\\b${escaped}`;
        return new RegExp(pattern, 'i').test(text);
      });
    }

    function buildLeagueLookupMap(data) {
      leagueLookupMap.clear();

      function walk(obj, depth = 0) {
        if (!obj || typeof obj !== 'object' || depth > 10) return;

        const objId = obj.id || obj.uuid || obj.leagueId || obj.seriesId || obj.matchSeriesId;
        const objName = obj.name || obj.leagueName || obj.competitionName || obj.caption || obj.groupName || obj.title || obj.seriesName;
        const objGender = obj.gender || obj.leagueGender || obj.competitionGender;

        if (objId && objName && typeof objName === 'string') {
          leagueLookupMap.set(String(objId), {
            name: objName,
            gender: objGender || ''
          });
        }

        if (Array.isArray(obj.matches) && objName) {
          obj.matches.forEach(m => {
            const mId = typeof m === 'object' ? (m.id || m.uuid || m.matchId) : m;
            if (mId) {
              leagueLookupMap.set(`match_${mId}`, {
                name: objName,
                gender: objGender || ''
              });
            }
          });
        }

        for (const key of Object.keys(obj)) {
          if (typeof obj[key] === 'object' && obj[key] !== null) {
            walk(obj[key], depth + 1);
          }
        }
      }

      walk(data);
    }

    function deepSearchLeagueAndGender(rootData, matchId, matchObj) {
      let foundName = null;
      let foundGender = null;

      function search(obj, depth = 0) {
        if (!obj || typeof obj !== 'object' || depth > 10 || (foundName && foundGender)) return;

        const hasMatch = Array.isArray(obj.matches) && obj.matches.some(m => {
          const id = typeof m === 'object' ? (m.id || m.uuid || m.matchId) : m;
          return id === matchId;
        });

        const targetIds = [matchObj.leagueId, matchObj.seriesId, matchObj.matchSeriesId, matchObj.groupId].filter(Boolean);
        const isTargetId = targetIds.some(id => id === obj.id || id === obj.uuid);

        if (hasMatch || isTargetId) {
          const name = obj.name || obj.leagueName || obj.competitionName || obj.caption || obj.groupName || obj.title;
          const gender = obj.gender || obj.leagueGender || obj.competitionGender;
          
          if (name && !foundName) foundName = name;
          if (gender && !foundGender) foundGender = gender;
        }

        for (const key of Object.keys(obj)) {
          if (typeof obj[key] === 'object' && obj[key] !== null) {
            search(obj[key], depth + 1);
          }
        }
      }

      search(rootData);
      return { name: foundName, gender: foundGender };
    }

    async function loadMatches() {
      const statusEl = document.getElementById('status');
      try {
        const response = await fetch(`${WORKER_URL}/?assoc=wvv`);
        if (!response.ok) throw new Error("Fehler beim Abrufen der Daten vom Worker.");

        const data = await response.json();
        allMatches = [];
        uniqueTeamsSet.clear();
        uniqueLeaguesMap.clear();

        buildLeagueLookupMap(data);

        if (Array.isArray(data.matchDays)) {
          data.matchDays.forEach(day => {
            if (Array.isArray(day.matches)) {
              day.matches.forEach(m => {
                const team1 = m.team1?.name || m.team1Name || m.teamDescription1 || '';
                const team2 = m.team2?.name || m.team2Name || m.teamDescription2 || '';
                const matchId = m.id || m.matchId || m.uuid || m.matchUuid || '';
                const rawDate = m.date || m.startDate || day.date || null;

                let rawLeague = m.leagueName || m.league?.name || m.competitionName || m.groupName || m.seriesName;
                let rawGender = m.gender || m.leagueGender || m.league?.gender;

                if (!rawLeague && leagueLookupMap.has(`match_${matchId}`)) {
                  const info = leagueLookupMap.get(`match_${matchId}`);
                  rawLeague = info.name;
                  if (!rawGender) rawGender = info.gender;
                }

                const possibleIds = [m.leagueId, m.seriesId, m.matchSeriesId, m.groupId, m.competitionId].filter(Boolean);
                for (const id of possibleIds) {
                  if ((!rawLeague || !rawGender) && leagueLookupMap.has(String(id))) {
                    const info = leagueLookupMap.get(String(id));
                    if (!rawLeague) rawLeague = info.name;
                    if (!rawGender) rawGender = info.gender;
                  }
                }

                if (!rawLeague || !rawGender) {
                  const deepRes = deepSearchLeagueAndGender(data, matchId, m);
                  if (!rawLeague) rawLeague = deepRes.name;
                  if (!rawGender) rawGender = deepRes.gender;
                }

                if (!rawLeague) rawLeague = "Unbekannte Liga";
                if (!rawGender) rawGender = parseGenderFromLeague(rawLeague);

                const formattedGender = formatGender(rawGender);
                const leagueDisplay = formattedGender ? `${rawLeague} (${formattedGender})` : rawLeague;

                if (matchId && (team1 || team2)) {
                  if (team1) uniqueTeamsSet.add(team1);
                  if (team2) uniqueTeamsSet.add(team2);
                  uniqueLeaguesMap.set(rawLeague, leagueDisplay);

                  allMatches.push({
                    id: matchId,
                    team1: team1 || 'Unbekannt',
                    team2: team2 || 'Unbekannt',
                    dateObj: rawDate ? new Date(rawDate) : new Date(0),
                    formattedDate: formatDate(rawDate),
                    rawDateString: rawDate ? new Date(rawDate).toISOString().split('T')[0] : '',
                    leagueRaw: rawLeague,
                    leagueDisplay: leagueDisplay,
                    gender: formattedGender || 'Unbekannt'
                  });
                }
              });
            }
          });
        }

        allMatches.sort((a, b) => a.dateObj - b.dateObj);

        populateLeagueSelect();
        statusEl.style.display = 'none';
        
        applyFilters(true);

      } catch (err) {
        statusEl.innerText = "Fehler beim Laden: " + err.message;
      }
    }

    function parseGenderFromLeague(leagueName) {
      if (!leagueName) return '';
      const lower = leagueName.toLowerCase();
      if (lower.includes('männer') || lower.includes('herren') || lower.includes(' männer')) return 'Herren';
      if (lower.includes('frauen') || lower.includes('damen') || lower.includes(' damen')) return 'Damen';
      if (lower.includes('mixed')) return 'Mixed';
      return '';
    }

    function formatGender(genderStr) {
      if (!genderStr) return '';
      const g = genderStr.toString().toUpperCase();
      if (g === 'MALE' || g === 'MÄNNER' || g === 'HERREN' || g === 'M') return 'Herren';
      if (g === 'FEMALE' || g === 'FRAUEN' || g === 'DAMEN' || g === 'W') return 'Damen';
      if (g === 'MIXED') return 'Mixed';
      return genderStr;
    }

    function populateLeagueSelect() {
      const select = document.getElementById('filter-league');
      select.innerHTML = '<option value="">Alle Ligen</option>';

      Array.from(uniqueLeaguesMap.entries())
        .sort((a, b) => a[1].localeCompare(b[1]))
        .forEach(([raw, display]) => {
          const opt = document.createElement('option');
          opt.value = raw;
          opt.textContent = display;
          select.appendChild(opt);
        });
    }

    function handleAutocomplete(query) {
      const listEl = document.getElementById('autocomplete-list');
      const val = query.trim();

      if (val.length < 2) {
        closeAutocomplete();
        return;
      }

      const matches = Array.from(uniqueTeamsSet)
        .filter(team => matchesExactQuery(team, val))
        .slice(0, 6);

      if (matches.length === 0) {
        closeAutocomplete();
        return;
      }

      listEl.innerHTML = matches.map(team => `
        <div class="autocomplete-item" onclick="selectSuggestion('${escapeQuotes(team)}')">
          ${team}
        </div>
      `).join('');

      listEl.style.display = 'block';
    }

    function selectSuggestion(teamName) {
      document.getElementById('search-input').value = teamName;
      closeAutocomplete();
      applyFilters(false);
    }

    function closeAutocomplete() {
      const listEl = document.getElementById('autocomplete-list');
      listEl.style.display = 'none';
      listEl.innerHTML = '';
    }

    function escapeQuotes(str) {
      return str.replace(/'/g, "\\'").replace(/"/g, '&quot;');
    }

    function applyFilters(shouldJumpToToday = false) {
      const searchVal = document.getElementById('search-input').value;
      const genderVal = document.getElementById('filter-gender').value;
      const leagueVal = document.getElementById('filter-league').value;
      const teamVal = document.getElementById('filter-team').value;
      const dateVal = document.getElementById('filter-date').value;

      const isUnfiltered = !searchVal && !genderVal && !leagueVal && !teamVal && !dateVal;

      const filtered = allMatches.filter(m => {
        const matchesSearch = !searchVal || 
          matchesExactQuery(m.team1, searchVal) ||
          matchesExactQuery(m.team2, searchVal) ||
          m.leagueDisplay.toLowerCase().includes(searchVal.toLowerCase());

        const matchesGender = !genderVal || m.gender === genderVal;
        const matchesLeague = !leagueVal || m.leagueRaw === leagueVal;
        const matchesTeam = !teamVal || 
          matchesExactQuery(m.team1, teamVal) || 
          matchesExactQuery(m.team2, teamVal);
        const matchesDate = !dateVal || m.rawDateString === dateVal;

        return matchesSearch && matchesGender && matchesLeague && matchesTeam && matchesDate;
      });

      renderMatches(filtered);

      if (shouldJumpToToday && isUnfiltered) {
        jumpDirectlyToToday();
      }
    }

    function resetFilters() {
      document.getElementById('search-input').value = '';
      document.getElementById('filter-gender').value = '';
      document.getElementById('filter-league').value = '';
      document.getElementById('filter-team').value = '';
      document.getElementById('filter-date').value = '';
      closeAutocomplete();
      applyFilters(true);
    }

    function renderMatches(matches) {
      const listEl = document.getElementById('match-list');

      if (matches.length === 0) {
        listEl.innerHTML = '<div class="status-box">Keine Begegnungen gefunden.</div>';
        return;
      }

      const now = new Date();
      const todayStart = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();

      listEl.innerHTML = matches.map(m => {
        const fullLink = `${SCOREBOARD_BASE_URL}?match=${m.id}&assoc=wvv`;
        const matchDayTime = new Date(m.dateObj.getFullYear(), m.dateObj.getMonth(), m.dateObj.getDate()).getTime();
        const isPast = matchDayTime < todayStart;

        return `
          <div class="match-card ${isPast ? 'past-match' : ''}" data-time="${m.dateObj.getTime()}">
            <div class="match-header">
              <span class="match-league-badge">${m.leagueDisplay}</span>
              <span class="match-date">${m.formattedDate}</span>
            </div>
            <div class="match-teams">${m.team1} vs. ${m.team2}</div>
            <div class="match-footer">
              <span class="match-id" title="${m.id}">ID: ${m.id}</span>
              <div class="btn-group">
                <a href="${fullLink}" target="_blank" rel="noopener" class="action-btn open-btn">Öffnen</a>
                <button class="action-btn copy-btn" onclick="copyToClipboard('${fullLink}', this)">Kopieren</button>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    function formatDate(dateInput) {
      if (!dateInput) return 'Datum unbekannt';
      try {
        const d = new Date(dateInput);
        if (isNaN(d.getTime())) return dateInput;
        return d.toLocaleDateString('de-DE', {
          weekday: 'short',
          day: '2-digit',
          month: '2-digit',
          year: 'numeric',
          hour: '2-digit',
          minute: '2-digit'
        }) + ' Uhr';
      } catch {
        return dateInput;
      }
    }

    function jumpDirectlyToToday() {
      const nowTime = new Date().getTime();
      const cards = document.querySelectorAll('.match-card');
      let targetCard = null;

      for (let card of cards) {
        const cardTime = parseInt(card.getAttribute('data-time'));
        if (cardTime >= nowTime) {
          targetCard = card;
          break;
        }
      }

      if (targetCard) {
        targetCard.scrollIntoView({ behavior: 'auto', block: 'center' });
      }
    }

    function copyToClipboard(text, btnElement) {
      navigator.clipboard.writeText(text).then(() => {
        const originalText = btnElement.innerText;
        btnElement.innerText = "Kopiert!";
        btnElement.classList.add('copied');
        setTimeout(() => {
          btnElement.innerText = originalText;
          btnElement.classList.remove('copied');
        }, 2000);
      }).catch(err => {
        alert('Fehler beim Kopieren: ' + err);
      });
    }
  </script>
</body>
</html>

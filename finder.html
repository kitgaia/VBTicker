<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>SAMS Match Finder</title>
  <style>
    :root {
      --bg-body: #000000;
      --bg-card: #1c1c1e;
      --bg-card-hover: #2c2c2e;
      --bg-input: #1c1c1e;
      --bg-tertiary: #2c2c2e;
      --apple-blue: #0a84ff;
      --apple-blue-tap: #0066cc;
      --apple-green: #30d158;
      --apple-gray: #8e8e93;
      --apple-gray-light: #aeaeb2;
      --border-subtle: rgba(255, 255, 255, 0.1);
      --border-focus: rgba(10, 132, 255, 0.5);
      --text-primary: #ffffff;
      --text-secondary: #ebdbe0;
      --text-muted: #8e8e93;
      --radius-lg: 16px;
      --radius-md: 12px;
      --radius-pill: 20px;
      --ease-ios: cubic-bezier(0.16, 1, 0.3, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-body);
      color: var(--text-primary);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
      padding: 16px 16px 32px 16px;
      line-height: 1.47059;
      letter-spacing: -0.022em;
      -webkit-font-smoothing: antialiased;
    }

    .container {
      max-width: 680px;
      margin: 0 auto;
    }

    /* Apple Glassmorphism Header */
    .sticky-header {
      position: sticky;
      top: 0;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      padding: 12px 0 16px 0;
      z-index: 100;
      border-bottom: 1px solid var(--border-subtle);
      margin-bottom: 16px;
    }

    .header-top {
      margin-bottom: 12px;
    }

    h1 {
      font-size: 26px;
      font-weight: 700;
      letter-spacing: -0.5px;
      color: var(--text-primary);
    }

    .subtitle {
      color: var(--apple-gray);
      font-size: 13px;
      margin-top: 2px;
      font-weight: 400;
    }

    /* Search & Filter Bar */
    .search-row {
      display: flex;
      gap: 10px;
      position: relative;
    }

    .search-wrapper {
      position: relative;
      flex: 1;
    }

    .search-box {
      width: 100%;
      height: 44px;
      padding: 0 14px 0 38px;
      background: var(--bg-input);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      color: var(--text-primary);
      font-size: 15px;
      outline: none;
      transition: all 0.25s var(--ease-ios);
    }

    .search-box:focus {
      border-color: var(--apple-blue);
      box-shadow: 0 0 0 3px rgba(10, 132, 255, 0.25);
    }

    .search-icon {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      width: 16px;
      height: 16px;
      fill: var(--apple-gray);
      pointer-events: none;
    }

    /* Filter Toggle Button */
    .filter-toggle-btn {
      height: 44px;
      padding: 0 16px;
      background: var(--bg-input);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      color: var(--apple-blue);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s var(--ease-ios);
      flex-shrink: 0;
    }

    .filter-toggle-btn:active {
      transform: scale(0.96);
      opacity: 0.8;
    }

    .filter-toggle-btn.active {
      background: var(--apple-blue);
      color: #ffffff;
      border-color: var(--apple-blue);
    }

    .filter-toggle-btn.active svg {
      fill: #ffffff;
    }

    .filter-icon {
      width: 16px;
      height: 16px;
      fill: var(--apple-blue);
      transition: fill 0.2s ease;
    }

    /* Autocomplete Dropdown */
    .autocomplete-list {
      position: absolute;
      top: 50px;
      left: 0;
      right: 0;
      background: rgba(28, 28, 30, 0.95);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.6);
      max-height: 240px;
      overflow-y: auto;
      z-index: 105;
      display: none;
    }

    .autocomplete-item {
      padding: 12px 16px;
      font-size: 14px;
      cursor: pointer;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      color: var(--text-primary);
      transition: background 0.15s ease;
    }

    .autocomplete-item:last-child {
      border-bottom: none;
    }

    .autocomplete-item:hover, .autocomplete-item:active {
      background: var(--bg-tertiary);
      color: var(--apple-blue);
    }

    /* Filter Drawer Panel */
    .filter-drawer {
      max-height: 0;
      overflow: hidden;
      opacity: 0;
      transform: translateY(-8px);
      transition: max-height 0.35s var(--ease-ios), opacity 0.25s ease, transform 0.3s var(--ease-ios), margin-top 0.25s ease;
      margin-top: 0;
    }

    .filter-drawer.open {
      max-height: 360px;
      opacity: 1;
      transform: translateY(0);
      margin-top: 12px;
    }

    .filter-grid {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: 14px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 10px;
    }

    .filter-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .filter-group label {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      color: var(--apple-gray);
    }

    .filter-control {
      height: 38px;
      padding: 0 10px;
      background: var(--bg-body);
      border: 1px solid var(--border-subtle);
      border-radius: 8px;
      color: var(--text-primary);
      font-size: 13px;
      outline: none;
      transition: border-color 0.2s ease;
    }

    .filter-control:focus {
      border-color: var(--apple-blue);
    }

    .reset-filters-btn {
      grid-column: 1 / -1;
      height: 34px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-subtle);
      border-radius: 8px;
      color: var(--apple-gray-light);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .reset-filters-btn:active {
      transform: scale(0.98);
      background: rgba(255, 255, 255, 0.1);
    }

    /* Match List & Cards */
    .match-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .match-card {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      animation: iosFadeIn 0.35s var(--ease-ios) forwards;
      transition: transform 0.2s var(--ease-ios), background-color 0.2s ease, border-color 0.2s ease;
    }

    .match-card:active {
      transform: scale(0.985);
      background-color: var(--bg-card-hover);
    }

    .match-card.past-match {
      opacity: 0.45;
    }

    .match-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      gap: 8px;
    }

    .match-league-badge {
      color: var(--apple-blue);
      font-weight: 600;
      background: rgba(10, 132, 255, 0.12);
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 11px;
      letter-spacing: -0.01em;
    }

    .match-date {
      color: var(--apple-gray);
      font-weight: 500;
      font-size: 12px;
    }

    .match-teams {
      font-size: 16px;
      font-weight: 600;
      color: var(--text-primary);
      line-height: 1.35;
      letter-spacing: -0.015em;
    }

    .match-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 4px;
      padding-top: 8px;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      gap: 8px;
    }

    .match-id {
      font-family: SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 11px;
      color: var(--apple-gray);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .btn-group {
      display: flex;
      gap: 8px;
      flex-shrink: 0;
    }

    .action-btn {
      border: none;
      height: 32px;
      padding: 0 14px;
      font-weight: 600;
      font-size: 12px;
      border-radius: var(--radius-pill);
      cursor: pointer;
      transition: all 0.2s var(--ease-ios);
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .action-btn:active {
      transform: scale(0.94);
    }

    .copy-btn {
      background: var(--apple-blue);
      color: #ffffff;
    }

    .copy-btn.copied {
      background: var(--apple-green);
      color: #ffffff;
    }

    .open-btn {
      background: var(--bg-tertiary);
      color: var(--text-primary);
    }

    .status-box {
      text-align: center;
      color: var(--apple-gray);
      padding: 40px 16px;
      font-size: 15px;
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
    }

    @keyframes iosFadeIn {
      from {
        opacity: 0;
        transform: translateY(8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 480px) {
      body { padding: 12px; }
      .search-box { font-size: 14px; }
      .match-teams { font-size: 15px; }
      .action-btn { padding: 0 12px; font-size: 11px; }
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="sticky-header">
      <div class="header-top">
        <h1>SAMS Match Finder</h1>
        <p class="subtitle">Finde deine Begegnung und kopiere den OBS-Overlay Link.</p>
      </div>

      <div class="search-row">
        <div class="search-wrapper">
          <svg class="search-icon" viewBox="0 0 24 24">
            <path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
          </svg>
          <input type="text" id="search-input" class="search-box" placeholder="Verein, Team oder Liga suchen..." autocomplete="off">
          <div id="autocomplete-list" class="autocomplete-list"></div>
        </div>

        <button id="filter-toggle" class="filter-toggle-btn" aria-label="Filter umschalten">
          <svg class="filter-icon" viewBox="0 0 24 24">
            <path d="M10 18h4v-2h-4v2zM3 6v2h18V6H3zm3 7h12v-2H6v2z"/>
          </svg>
          <span>Filter</span>
        </button>
      </div>

      <div id="filter-drawer" class="filter-drawer">
        <div class="filter-grid">
          <div class="filter-group">
            <label for="filter-gender">Geschlecht</label>
            <select id="filter-gender" class="filter-control">
              <option value="">Alle</option>
              <option value="Herren">Herren</option>
              <option value="Damen">Damen</option>
              <option value="Mixed">Mixed</option>
            </select>
          </div>

          <div class="filter-group">
            <label for="filter-league">Liga</label>
            <select id="filter-league" class="filter-control">
              <option value="">Alle Ligen</option>
            </select>
          </div>

          <div class="filter-group">
            <label for="filter-team">Mannschaft</label>
            <input type="text" id="filter-team" class="filter-control" placeholder="Name filtern...">
          </div>

          <div class="filter-group">
            <label for="filter-date">Datum</label>
            <input type="date" id="filter-date" class="filter-control">
          </div>

          <button id="reset-filters" class="reset-filters-btn">Filter zurücksetzen</button>
        </div>
      </div>
    </div>

    <div id="status" class="status-box">Lade aktuelle Spieldaten...</div>
    <div id="match-list" class="match-list"></div>
  </div>

  <script>
    const WORKER_URL = "https://tickerv2.nick-valbert2006.workers.dev";
    const SCOREBOARD_BASE_URL = "https://kitgaia.github.io/VBTicker/scoreboardV1.html";

    let allMatches = [];
    let uniqueTeamsSet = new Set();
    let uniqueLeaguesMap = new Map(); // Raw Name -> Display Name
    let leagueLookupMap = new Map();  // ID / Key -> { name, gender }

    document.addEventListener('DOMContentLoaded', () => {
      initEventListeners();
      loadMatches();
    });

    function initEventListeners() {
      const searchInput = document.getElementById('search-input');
      const filterToggle = document.getElementById('filter-toggle');
      const filterDrawer = document.getElementById('filter-drawer');

      searchInput.addEventListener('input', (e) => {
        handleAutocomplete(e.target.value);
        applyFilters();
      });

      searchInput.addEventListener('focus', (e) => {
        if (e.target.value.trim().length > 0) {
          handleAutocomplete(e.target.value);
        }
      });

      document.addEventListener('click', (e) => {
        if (!e.target.closest('.search-wrapper')) {
          closeAutocomplete();
        }
      });

      filterToggle.addEventListener('click', () => {
        const isOpen = filterDrawer.classList.toggle('open');
        filterToggle.classList.toggle('active', isOpen);
      });

      document.getElementById('filter-gender').addEventListener('change', applyFilters);
      document.getElementById('filter-league').addEventListener('change', applyFilters);
      document.getElementById('filter-team').addEventListener('input', applyFilters);
      document.getElementById('filter-date').addEventListener('change', applyFilters);
      document.getElementById('reset-filters').addEventListener('click', resetFilters);
    }

    // Erstellt einen tiefen Index aller Ligen-Objekte aus den SAMS-Rohdaten
    function buildLeagueLookupMap(data) {
      leagueLookupMap.clear();

      function walk(obj, depth = 0) {
        if (!obj || typeof obj !== 'object' || depth > 6) return;

        const objId = obj.id || obj.uuid || obj.leagueId || obj.seriesId;
        const objName = obj.name || obj.leagueName || obj.competitionName || obj.caption || obj.groupName;
        const objGender = obj.gender || obj.leagueGender;

        if (objId && objName && typeof objName === 'string') {
          leagueLookupMap.set(objId, {
            name: objName,
            gender: objGender || ''
          });
        }

        for (const key of Object.keys(obj)) {
          if (typeof obj[key] === 'object' && obj[key] !== null) {
            walk(obj[key], depth + 1);
          }
        }
      }

      walk(data);
    }

    async function loadMatches() {
      const statusEl = document.getElementById('status');
      try {
        const response = await fetch(`${WORKER_URL}/?assoc=wvv`);
        if (!response.ok) throw new Error("Fehler beim Abrufen der Daten vom Worker.");

        const data = await response.json();
        allMatches = [];
        uniqueTeamsSet.clear();
        uniqueLeaguesMap.clear();

        // 1. Tiefen-Lookup für Ligen aufbauen
        buildLeagueLookupMap(data);

        // 2. Spiele verarbeiten
        if (Array.isArray(data.matchDays)) {
          data.matchDays.forEach(day => {
            if (Array.isArray(day.matches)) {
              day.matches.forEach(m => {
                const team1 = m.team1?.name || m.team1Name || m.teamDescription1 || '';
                const team2 = m.team2?.name || m.team2Name || m.teamDescription2 || '';
                const matchId = m.id || m.matchId || m.uuid || m.matchUuid || '';
                const rawDate = m.date || m.startDate || day.date || null;

                // Dynamische Liga-Ermittlung
                let rawLeague = m.leagueName || m.league?.name || m.competitionName || m.groupName || m.seriesName;
                let rawGender = m.gender || m.leagueGender || m.league?.gender;

                if (!rawLeague && m.leagueId && leagueLookupMap.has(m.leagueId)) {
                  rawLeague = leagueLookupMap.get(m.leagueId).name;
                  if (!rawGender) rawGender = leagueLookupMap.get(m.leagueId).gender;
                }
                if (!rawLeague && m.seriesId && leagueLookupMap.has(m.seriesId)) {
                  rawLeague = leagueLookupMap.get(m.seriesId).name;
                  if (!rawGender) rawGender = leagueLookupMap.get(m.seriesId).gender;
                }

                if (!rawLeague) rawLeague = "WVV Liga";

                if (!rawGender) {
                  rawGender = parseGenderFromLeague(rawLeague);
                }

                const formattedGender = formatGender(rawGender);
                const leagueDisplay = formattedGender ? `${rawLeague} (${formattedGender})` : rawLeague;

                if (matchId && (team1 || team2)) {
                  if (team1) uniqueTeamsSet.add(team1);
                  if (team2) uniqueTeamsSet.add(team2);
                  uniqueLeaguesMap.set(rawLeague, leagueDisplay);

                  allMatches.push({
                    id: matchId,
                    team1: team1 || 'Unbekannt',
                    team2: team2 || 'Unbekannt',
                    dateObj: rawDate ? new Date(rawDate) : new Date(0),
                    formattedDate: formatDate(rawDate),
                    rawDateString: rawDate ? new Date(rawDate).toISOString().split('T')[0] : '',
                    leagueRaw: rawLeague,
                    leagueDisplay: leagueDisplay,
                    gender: formattedGender || 'Unbekannt'
                  });
                }
              });
            }
          });
        }

        allMatches.sort((a, b) => a.dateObj - b.dateObj);

        populateLeagueSelect();
        statusEl.style.display = 'none';
        applyFilters();

        setTimeout(scrollToToday, 250);

      } catch (err) {
        statusEl.innerText = "Fehler beim Laden: " + err.message;
      }
    }

    function parseGenderFromLeague(leagueName) {
      if (!leagueName) return '';
      const lower = leagueName.toLowerCase();
      if (lower.includes('männer') || lower.includes('herren') || lower.includes(' männer')) return 'Herren';
      if (lower.includes('frauen') || lower.includes('damen') || lower.includes(' damen')) return 'Damen';
      if (lower.includes('mixed')) return 'Mixed';
      return '';
    }

    function formatGender(genderStr) {
      if (!genderStr) return '';
      const g = genderStr.toString().toUpperCase();
      if (g === 'MALE' || g === 'MÄNNER' || g === 'HERREN' || g === 'M') return 'Herren';
      if (g === 'FEMALE' || g === 'FRAUEN' || g === 'DAMEN' || g === 'W') return 'Damen';
      if (g === 'MIXED') return 'Mixed';
      return genderStr;
    }

    function populateLeagueSelect() {
      const select = document.getElementById('filter-league');
      select.innerHTML = '<option value="">Alle Ligen</option>';

      Array.from(uniqueLeaguesMap.entries())
        .sort((a, b) => a[1].localeCompare(b[1]))
        .forEach(([raw, display]) => {
          const opt = document.createElement('option');
          opt.value = raw;
          opt.textContent = display;
          select.appendChild(opt);
        });
    }

    function handleAutocomplete(query) {
      const listEl = document.getElementById('autocomplete-list');
      const val = query.trim().toLowerCase();

      if (val.length < 2) {
        closeAutocomplete();
        return;
      }

      const matches = Array.from(uniqueTeamsSet)
        .filter(team => team.toLowerCase().includes(val))
        .slice(0, 6);

      if (matches.length === 0) {
        closeAutocomplete();
        return;
      }

      listEl.innerHTML = matches.map(team => `
        <div class="autocomplete-item" onclick="selectSuggestion('${escapeQuotes(team)}')">
          ${team}
        </div>
      `).join('');

      listEl.style.display = 'block';
    }

    function selectSuggestion(teamName) {
      document.getElementById('search-input').value = teamName;
      closeAutocomplete();
      applyFilters();
    }

    function closeAutocomplete() {
      const listEl = document.getElementById('autocomplete-list');
      listEl.style.display = 'none';
      listEl.innerHTML = '';
    }

    function escapeQuotes(str) {
      return str.replace(/'/g, "\\'").replace(/"/g, '&quot;');
    }

    function applyFilters() {
      const searchVal = document.getElementById('search-input').value.trim().toLowerCase();
      const genderVal = document.getElementById('filter-gender').value;
      const leagueVal = document.getElementById('filter-league').value;
      const teamVal = document.getElementById('filter-team').value.trim().toLowerCase();
      const dateVal = document.getElementById('filter-date').value;

      const filtered = allMatches.filter(m => {
        const matchesSearch = !searchVal || 
          m.team1.toLowerCase().includes(searchVal) ||
          m.team2.toLowerCase().includes(searchVal) ||
          m.leagueDisplay.toLowerCase().includes(searchVal);

        const matchesGender = !genderVal || m.gender === genderVal;
        const matchesLeague = !leagueVal || m.leagueRaw === leagueVal;
        const matchesTeam = !teamVal || 
          m.team1.toLowerCase().includes(teamVal) || 
          m.team2.toLowerCase().includes(teamVal);
        const matchesDate = !dateVal || m.rawDateString === dateVal;

        return matchesSearch && matchesGender && matchesLeague && matchesTeam && matchesDate;
      });

      renderMatches(filtered);
    }

    function resetFilters() {
      document.getElementById('search-input').value = '';
      document.getElementById('filter-gender').value = '';
      document.getElementById('filter-league').value = '';
      document.getElementById('filter-team').value = '';
      document.getElementById('filter-date').value = '';
      closeAutocomplete();
      applyFilters();
    }

    function renderMatches(matches) {
      const listEl = document.getElementById('match-list');

      if (matches.length === 0) {
        listEl.innerHTML = '<div class="status-box">Keine Begegnungen gefunden.</div>';
        return;
      }

      const now = new Date();
      const todayStart = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();

      listEl.innerHTML = matches.map(m => {
        const fullLink = `${SCOREBOARD_BASE_URL}?match=${m.id}&assoc=wvv`;
        const matchDayTime = new Date(m.dateObj.getFullYear(), m.dateObj.getMonth(), m.dateObj.getDate()).getTime();
        const isPast = matchDayTime < todayStart;

        return `
          <div class="match-card ${isPast ? 'past-match' : ''}" data-time="${m.dateObj.getTime()}">
            <div class="match-header">
              <span class="match-league-badge">${m.leagueDisplay}</span>
              <span class="match-date">${m.formattedDate}</span>
            </div>
            <div class="match-teams">${m.team1} vs. ${m.team2}</div>
            <div class="match-footer">
              <span class="match-id" title="${m.id}">ID: ${m.id}</span>
              <div class="btn-group">
                <a href="${fullLink}" target="_blank" rel="noopener" class="action-btn open-btn">Öffnen</a>
                <button class="action-btn copy-btn" onclick="copyToClipboard('${fullLink}', this)">Kopieren</button>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    function formatDate(dateInput) {
      if (!dateInput) return 'Datum unbekannt';
      try {
        const d = new Date(dateInput);
        if (isNaN(d.getTime())) return dateInput;
        return d.toLocaleDateString('de-DE', {
          weekday: 'short',
          day: '2-digit',
          month: '2-digit',
          year: 'numeric',
          hour: '2-digit',
          minute: '2-digit'
        }) + ' Uhr';
      } catch {
        return dateInput;
      }
    }

    function scrollToToday() {
      const nowTime = new Date().getTime();
      const cards = document.querySelectorAll('.match-card');
      let targetCard = null;

      for (let card of cards) {
        const cardTime = parseInt(card.getAttribute('data-time'));
        if (cardTime >= nowTime) {
          targetCard = card;
          break;
        }
      }

      if (targetCard) {
        targetCard.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }
    }

    function copyToClipboard(text, btnElement) {
      navigator.clipboard.writeText(text).then(() => {
        const originalText = btnElement.innerText;
        btnElement.innerText = "Kopiert!";
        btnElement.classList.add('copied');
        setTimeout(() => {
          btnElement.innerText = originalText;
          btnElement.classList.remove('copied');
        }, 2000);
      }).catch(err => {
        alert('Fehler beim Kopieren: ' + err);
      });
    }
  </script>
</body>
</html>

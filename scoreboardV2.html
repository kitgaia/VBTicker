<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Volleyball Scoreboard Overlay - V1.5 Base</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: transparent; /* In OBS transparent */
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, 'Helvetica Neue', Arial, sans-serif;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding-top: 20px;
    }

    :root {
      --color-home: #0a84ff;
      --color-guest: #ff9f0a;
      --color-home-text: #ffffff;
      --color-guest-text: #ffffff;
    }

    /* Scoreboard Wrapper */
    .scoreboard-wrapper {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      z-index: 10;
      width: max-content;
      max-width: 98vw;
      animation: slideDownIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes slideDownIn {
      0% { opacity: 0; transform: translate(-50%, -30px); }
      100% { opacity: 1; transform: translate(-50%, 0); }
    }

    /* Haupt-Scoreboard Container */
    .scoreboard {
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #030712 0%, #0f172a 100%);
      border-radius: 6px;
      padding: 6px 12px;
      color: #ffffff;
      box-shadow: 0 10px 35px rgba(0, 0, 0, 0.85);
      border-left: 5px solid var(--color-home);
      border-right: 5px solid var(--color-guest);
      border-top: 1px solid rgba(255, 255, 255, 0.12);
      border-bottom: 2px solid rgba(255, 255, 255, 0.12);
      font-weight: 800;
      gap: 12px;
      transition: border-color 0.4s ease;
    }

    /* Team Hälften */
    .team { 
      display: flex; 
      align-items: center; 
      gap: 10px; 
      padding: 0 4px;
    }
    
    .team.home { flex-direction: row; }
    .team.guest { flex-direction: row-reverse; }

    .team-logo {
      width: 32px;
      height: 32px;
      object-fit: contain;
      flex-shrink: 0;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
    }

    /* Vollständiger Teamname zentriert */
    .team-name-wrapper {
      flex-grow: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 8px;
    }

    .team-name {
      font-size: clamp(13px, 2.2vw, 17px);
      letter-spacing: 0.8px;
      text-transform: uppercase;
      white-space: nowrap;
      font-weight: 900;
      text-align: center;
    }

    /* Punkteanzeige */
    .points {
      background: var(--color-home);
      color: var(--color-home-text);
      font-size: clamp(20px, 3.5vw, 28px);
      font-weight: 900;
      padding: 2px 12px;
      border-radius: 4px;
      min-width: 44px;
      text-align: center;
      flex-shrink: 0;
      box-shadow: inset 0 2px 4px rgba(0,0,0,0.25), 0 2px 8px rgba(0,0,0,0.4);
      transition: background-color 0.4s ease, color 0.4s ease;
      display: inline-block;
    }

    .guest .points { 
      background: var(--color-guest); 
      color: var(--color-guest-text); 
    }

    @keyframes pulseScore {
      0% { transform: scale(1); }
      50% { transform: scale(1.25); filter: brightness(1.3); }
      100% { transform: scale(1); }
    }
    .pulse { animation: pulseScore 0.45s ease-out !important; }

    /* Satzstand */
    .sets-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 0 10px;
      flex-shrink: 0;
      border-left: 2px solid rgba(255,255,255,0.12);
      border-right: 2px solid rgba(255,255,255,0.12);
    }
    .sets-score { font-size: clamp(16px, 2.8vw, 22px); color: #f8fafc; letter-spacing: 2px; font-weight: 900; }
    .sets-label { font-size: 8px; color: #38bdf8; text-transform: uppercase; letter-spacing: 1px; font-weight: 900; }

    /* Version Badge */
    .version-badge {
      position: fixed;
      bottom: 12px;
      right: 12px;
      background: rgba(3, 7, 18, 0.85);
      border: 1px solid rgba(0, 242, 254, 0.4);
      color: #00f2fe;
      font-size: 10px;
      font-weight: 900;
      padding: 3px 8px;
      border-radius: 4px;
      letter-spacing: 1px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.6);
      z-index: 1000;
      text-transform: uppercase;
      backdrop-filter: blur(4px);
    }

    /* Mobile Responsive Layout */
    @media (max-width: 600px) {
      .scoreboard {
        flex-direction: column;
        width: 95vw;
        border-left: none;
        border-right: none;
        border-top: 4px solid var(--color-home);
        border-bottom: 4px solid var(--color-guest);
        padding: 10px;
        gap: 8px;
      }

      .team {
        width: 100% !important;
        justify-content: space-between;
      }

      .team.guest {
        flex-direction: row;
      }

      .sets-container {
        border-left: none;
        border-right: none;
        border-top: 1px solid rgba(255,255,255,0.12);
        border-bottom: 1px solid rgba(255,255,255,0.12);
        width: 100%;
        padding: 4px 0;
        margin: 2px 0;
      }
    }
  </style>
</head>
<body>

  <div class="version-badge">v1.5 Base</div>

  <div class="scoreboard-wrapper">
    <div class="scoreboard" id="main-scoreboard">
      <!-- HEIM TEAM -->
      <div class="team home" id="team-home">
        <img id="team1-logo" class="team-logo" src="" style="display:none;" crossorigin="anonymous" alt="">
        <div class="team-name-wrapper">
          <span id="team1-name" class="team-name">HEIM</span>
        </div>
        <span id="team1-points" class="points">0</span>
      </div>

      <!-- SÄTZE MITTE -->
      <div class="sets-container">
        <span class="sets-label">SÄTZE</span>
        <span id="sets-score" class="sets-score">0 : 0</span>
      </div>

      <!-- GAST TEAM -->
      <div class="team guest" id="team-guest">
        <img id="team2-logo" class="team-logo" src="" style="display:none;" crossorigin="anonymous" alt="">
        <div class="team-name-wrapper">
          <span id="team2-name" class="team-name">GAST</span>
        </div>
        <span id="team2-points" class="points">0</span>
      </div>
    </div>
  </div>

  <script>
    const WORKER_URL = "https://vb-ticker-router.vbticker.workers.dev";
    
    let prevP1 = null, prevP2 = null, prevS1 = null, prevS2 = null;
    let isInitialized = false;

    document.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      const matchId = urlParams.get('match') || '9f93d1e6-58df-4116-ac9c-62992ab9641b';
      const assoc = urlParams.get('assoc') || urlParams.get('verband') || 'wvv';

      fetchScore(matchId, assoc);
      setInterval(() => fetchScore(matchId, assoc), 4000);
    });

    async function fetchScore(matchId, assoc) {
      try {
        const response = await fetch(`${WORKER_URL}/?match=${matchId}&assoc=${assoc}`);
        if (!response.ok) return;

        const data = await response.json();

        const uiData = {
          team1: data.teams?.team1?.name || 'HEIM',
          team2: data.teams?.team2?.name || 'GAST',
          logo1: data.teams?.team1?.logo || null,
          logo2: data.teams?.team2?.logo || null,
          p1: data.score?.currentSetScore?.team1 ?? 0,
          p2: data.score?.currentSetScore?.team2 ?? 0,
          s1: data.score?.sets?.team1 ?? 0,
          s2: data.score?.sets?.team2 ?? 0
        };

        if (!isInitialized) {
          initializeStaticData(uiData);
          isInitialized = true;
        }

        updateLiveScore(uiData);

      } catch (err) {
        console.error('Scoreboard-Fehler:', err);
      }
    }

    function initializeStaticData(d) {
      document.getElementById('team1-name').innerText = d.team1;
      document.getElementById('team2-name').innerText = d.team2;

      setupTeamLogoAndColor('team1-logo', d.logo1, '--color-home', '--color-home-text', '#0a84ff');
      setupTeamLogoAndColor('team2-logo', d.logo2, '--color-guest', '--color-guest-text', '#ff9f0a');

      prevP1 = d.p1; prevP2 = d.p2;
      prevS1 = d.s1; prevS2 = d.s2;
      document.getElementById('team1-points').innerText = d.p1;
      document.getElementById('team2-points').innerText = d.p2;
      document.getElementById('sets-score').innerText = `${d.s1} : ${d.s2}`;

      setTimeout(equalizeTeamWidths, 100);
      window.addEventListener('resize', equalizeTeamWidths);
    }

    function equalizeTeamWidths() {
      if (window.innerWidth <= 600) {
        document.getElementById('team-home').style.width = '100%';
        document.getElementById('team-guest').style.width = '100%';
        return;
      }

      const homeEl = document.getElementById('team-home');
      const guestEl = document.getElementById('team-guest');

      homeEl.style.width = 'auto';
      guestEl.style.width = 'auto';

      const w1 = homeEl.getBoundingClientRect().width;
      const w2 = guestEl.getBoundingClientRect().width;

      const maxWidth = Math.max(w1, w2);
      homeEl.style.width = `${maxWidth}px`;
      guestEl.style.width = `${maxWidth}px`;
    }

    function updateLiveScore(d) {
      if (prevP1 !== null && prevP1 !== d.p1) triggerPulse('team1-points');
      prevP1 = d.p1;
      document.getElementById('team1-points').innerText = d.p1;

      if (prevP2 !== null && prevP2 !== d.p2) triggerPulse('team2-points');
      prevP2 = d.p2;
      document.getElementById('team2-points').innerText = d.p2;

      if ((prevS1 !== null && prevS1 !== d.s1) || (prevS2 !== null && prevS2 !== d.s2)) {
        triggerPulse('sets-score');
      }
      prevS1 = d.s1; prevS2 = d.s2;
      document.getElementById('sets-score').innerText = `${d.s1} : ${d.s2}`;
    }

    function triggerPulse(elementId) {
      const el = document.getElementById(elementId);
      if (!el) return;
      el.classList.remove('pulse');
      void el.offsetWidth;
      el.classList.add('pulse');
      setTimeout(() => el.classList.remove('pulse'), 450);
    }

    function setupTeamLogoAndColor(imgId, logoUrl, cssVarName, cssTextVarName, fallbackColor) {
      const img = document.getElementById(imgId);
      if (!logoUrl) {
        img.style.display = 'none';
        applyColor(cssVarName, cssTextVarName, fallbackColor);
        return;
      }

      img.src = logoUrl;
      img.style.display = 'block';

      img.onload = () => {
        try {
          const color = extractLargestConnectedColor(img);
          applyColor(cssVarName, cssTextVarName, color || fallbackColor);
        } catch (e) {
          applyColor(cssVarName, cssTextVarName, fallbackColor);
        }
      };

      img.onerror = () => {
        img.style.display = 'none';
        applyColor(cssVarName, cssTextVarName, fallbackColor);
      };
    }

    /* EXAKTE Connected Component Flood-Fill Methode */
    function extractLargestConnectedColor(img) {
      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d');
      const width = 64;
      const height = 64;
      canvas.width = width;
      canvas.height = height;

      ctx.drawImage(img, 0, 0, width, height);
      const imgData = ctx.getImageData(0, 0, width, height).data;

      const visited = new Uint8Array(width * height);
      const colorBins = new Int32Array(width * height);

      for (let i = 0; i < width * height; i++) {
        const idx = i * 4;
        const r = imgData[idx];
        const g = imgData[idx + 1];
        const b = imgData[idx + 2];
        const a = imgData[idx + 3];

        if (a < 128) {
          colorBins[i] = -1; // Transparenz
          continue;
        }

        const qR = Math.floor(r / 32);
        const qG = Math.floor(g / 32);
        const qB = Math.floor(b / 32);
        colorBins[i] = (qR << 10) | (qG << 5) | qB;
      }

      let maxColorScore = -1;
      let bestColorRgb = null;

      let maxMonoSize = -1;
      let bestMonoRgb = null;

      for (let y = 0; y < height; y++) {
        for (let x = 0; x < width; x++) {
          const pos = y * width + x;
          if (visited[pos] || colorBins[pos] === -1) continue;

          const bin = colorBins[pos];
          let currentRegionSize = 0;
          let sumR = 0, sumG = 0, sumB = 0;

          const queue = [pos];
          visited[pos] = 1;

          while (queue.length > 0) {
            const curr = queue.pop();
            const cx = curr % width;
            const cy = Math.floor(curr / width);
            const pixelIdx = curr * 4;

            currentRegionSize++;
            sumR += imgData[pixelIdx];
            sumG += imgData[pixelIdx + 1];
            sumB += imgData[pixelIdx + 2];

            const neighbors = [];
            if (cx > 0) neighbors.push(curr - 1);
            if (cx < width - 1) neighbors.push(curr + 1);
            if (cy > 0) neighbors.push(curr - width);
            if (cy < height - 1) neighbors.push(curr + width);

            for (const n of neighbors) {
              if (n >= 0 && n < width * height && !visited[n] && colorBins[n] === bin) {
                visited[n] = 1;
                queue.push(n);
              }
            }
          }

          const avgR = Math.round(sumR / currentRegionSize);
          const avgG = Math.round(sumG / currentRegionSize);
          const avgB = Math.round(sumB / currentRegionSize);

          const [h, s, v] = rgbToHsv(avgR, avgG, avgB);

          // Prüfen ob Buntfarbe vorliegt
          const isChromaticallyVibrant = (v >= 0.20 && v <= 0.98 && s >= 0.20);

          if (isChromaticallyVibrant) {
            const score = currentRegionSize * (1 + s);
            if (score > maxColorScore) {
              maxColorScore = score;
              bestColorRgb = `rgb(${avgR}, ${avgG}, ${avgB})`;
            }
          } else {
            // Schwarz/Weiß/Graustufen Fallback-Verarbeitung
            if (currentRegionSize > maxMonoSize) {
              maxMonoSize = currentRegionSize;
              bestMonoRgb = `rgb(${avgR}, ${avgG}, ${avgB})`;
            }
          }
        }
      }

      // Falls Buntfarbe existiert, nimm diese; sonst nimm die größte Schwarz/Weiß/Grau-Fläche
      return bestColorRgb || bestMonoRgb;
    }

    function rgbToHsv(r, g, b) {
      r /= 255; g /= 255; b /= 255;
      const max = Math.max(r, g, b), min = Math.min(r, g, b);
      let h, s, v = max;
      const d = max - min;
      s = max === 0 ? 0 : d / max;

      if (max === min) {
        h = 0;
      } else {
        switch (max) {
          case r: h = (g - b) / d + (g < b ? 6 : 0); break;
          case g: h = (b - r) / d + 2; break;
          case b: h = (r - g) / d + 4; break;
        }
        h /= 6;
      }
      return [h, s, v];
    }

    function applyColor(cssVarName, cssTextVarName, colorRgb) {
      document.documentElement.style.setProperty(cssVarName, colorRgb);
      
      const rgb = colorRgb.match(/\d+/g);
      if (rgb && rgb.length >= 3) {
        const brightness = (parseInt(rgb[0]) * 299 + parseInt(rgb[1]) * 587 + parseInt(rgb[2]) * 114) / 1000;
        const textColor = brightness > 165 ? '#030712' : '#ffffff';
        document.documentElement.style.setProperty(cssTextVarName, textColor);
      }
    }
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Volleyball Scoreboard Overlay - V1 Standard</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: transparent;
      font-family: 'Helvetica Neue', Arial, sans-serif;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
    }

    /* Team-Farben Variablen */
    :root {
      --color-home: #00f2fe;
      --color-guest: #f59e0b;
    }

    /* Container für Scoreboard oben mittig */
    .scoreboard-wrapper {
      position: absolute;
      top: 30px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      z-index: 10;
      width: fit-content;
      max-width: 95vw;
      animation: slideDownIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes slideDownIn {
      0% { opacity: 0; transform: translate(-50%, -40px); }
      100% { opacity: 1; transform: translate(-50%, 0); }
    }

    /* V1 Haupt-Scoreboard */
    .scoreboard {
      display: inline-flex;
      align-items: center;
      background: linear-gradient(135deg, #030712 0%, #0f172a 100%);
      border-radius: 4px;
      padding: 10px 22px;
      color: #ffffff;
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.8);
      border-left: 6px solid var(--color-home);
      border-right: 6px solid var(--color-guest);
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      border-bottom: 2px solid rgba(255, 255, 255, 0.1);
      font-weight: 800;
      gap: 18px;
      white-space: nowrap;
    }

    /* Exakt gleich lange Hälften für Heim und Gast */
    .team { 
      display: flex; 
      align-items: center; 
      justify-content: space-between; 
      min-width: 300px; 
      gap: 14px; 
    }
    .team.home { flex-direction: row; }
    .team.guest { flex-direction: row-reverse; }
    
    .team-logo {
      width: 32px;
      height: 32px;
      object-fit: contain;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
    }

    .team-name {
      font-size: 21px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      white-space: nowrap;
      overflow: visible;
      font-weight: 900;
      text-align: center;
      flex-grow: 1;
    }

    /* Punkte-Anzeige mit Pulse-Animation */
    .points {
      background: var(--color-home);
      color: #030712;
      font-size: 30px;
      font-weight: 900;
      padding: 2px 14px;
      border-radius: 2px;
      min-width: 55px;
      text-align: center;
      box-shadow: inset 0 2px 4px rgba(0,0,0,0.2);
      transition: background-color 0.3s ease;
      display: inline-block;
    }
    .guest .points { background: var(--color-guest); color: #030712; }

    @keyframes pulseScore {
      0% { transform: scale(1); }
      50% { transform: scale(1.35); filter: brightness(1.4); }
      100% { transform: scale(1); }
    }
    .pulse {
      animation: pulseScore 0.4s ease-out !important;
    }

    .sets-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 0 16px;
      border-left: 2px solid rgba(255,255,255,0.1);
      border-right: 2px solid rgba(255,255,255,0.1);
    }
    .sets-score { font-size: 22px; color: #f8fafc; letter-spacing: 3px; font-weight: 900; display: inline-block; }
    .sets-label { font-size: 8px; color: #38bdf8; text-transform: uppercase; letter-spacing: 2px; font-weight: 900; }

    /* Versions-Badge unten rechts */
    .version-badge {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: rgba(3, 7, 18, 0.85);
      border: 1px solid rgba(0, 242, 254, 0.4);
      color: var(--color-home);
      font-size: 11px;
      font-weight: 900;
      padding: 4px 10px;
      border-radius: 4px;
      letter-spacing: 1.5px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.6);
      z-index: 1000;
      text-transform: uppercase;
      backdrop-filter: blur(4px);
    }
  </style>
</head>
<body>

  <!-- Version Badge -->
  <div class="version-badge">v1.1 (Optimized)</div>

  <!-- Scoreboard -->
  <div class="scoreboard-wrapper">
    <div class="scoreboard" id="main-scoreboard">
      <div class="team home">
        <img id="team1-logo" class="team-logo" src="" style="display:none;" alt="">
        <span id="team1-name" class="team-name">HEIM</span>
        <span id="team1-points" class="points">0</span>
      </div>

      <div class="sets-container">
        <span class="sets-label">SÄTZE</span>
        <span id="sets-score" class="sets-score">0 : 0</span>
      </div>

      <div class="team guest">
        <img id="team2-logo" class="team-logo" src="" style="display:none;" alt="">
        <span id="team2-name" class="team-name">GAST</span>
        <span id="team2-points" class="points">0</span>
      </div>
    </div>
  </div>

  <script>
    const WORKER_URL = "https://rapid-bread-25a8.nick-valbert2006.workers.dev";
    
    let fetchInterval = null;
    let prevP1 = null;
    let prevP2 = null;
    let prevS1 = null;
    let prevS2 = null;
    let isInitialized = false; // Merkert sich, ob Stammdaten bereits geladen wurden

    document.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      const matchId = urlParams.get('match') || '9f93d1e6-58df-4116-ac9c-62992ab9641b';
      const assoc = urlParams.get('assoc') || urlParams.get('verband') || 'wvv';

      // Sofortiger erster Abruf (inkl. Namen & Logos)
      fetchScore(matchId, assoc);
      
      // Danach alle 3 Sekunden nur noch den Spielstand aktualisieren
      fetchInterval = setInterval(() => fetchScore(matchId, assoc), 3000);
    });

    async function fetchScore(matchId, assoc) {
      try {
        const response = await fetch(`${WORKER_URL}/?match=${matchId}&assoc=${assoc}`);
        if (!response.ok) return;

        const data = await response.json();

        const uiData = {
          team1: data.teams?.team1?.name || 'HEIM',
          team2: data.teams?.team2?.name || 'GAST',
          logo1: data.teams?.team1?.logo || null,
          logo2: data.teams?.team2?.logo || null,
          p1: data.score?.currentSetScore?.team1 ?? 0,
          p2: data.score?.currentSetScore?.team2 ?? 0,
          s1: data.score?.sets?.team1 ?? 0,
          s2: data.score?.sets?.team2 ?? 0
        };

        // Beim ersten Mal setzen wir alles (Namen, Logos & Punkte) und sperren die Initialisierung
        if (!isInitialized) {
          initializeStaticData(uiData);
          isInitialized = true;
        }

        // Ab dem zweiten Mal werden nur noch die Punkte/Sätze aktualisiert
        updateLiveScore(uiData);

      } catch (err) {
        console.error('Ticker-Fehler:', err);
      }
    }

    // Wird exakt 1x beim Start ausgeführt (Namen und Logos)
    function initializeStaticData(d) {
      document.getElementById('team1-name').innerText = d.team1;
      document.getElementById('team2-name').innerText = d.team2;

      const logo1El = document.getElementById('team1-logo');
      if (d.logo1) { 
        logo1El.src = d.logo1; 
        logo1El.style.display = 'block'; 
      } else { 
        logo1El.style.display = 'none'; 
      }

      const logo2El = document.getElementById('team2-logo');
      if (d.logo2) { 
        logo2El.src = d.logo2; 
        logo2El.style.display = 'block'; 
      } else { 
        logo2El.style.display = 'none'; 
      }

      // Startwerte direkt setzen
      prevP1 = d.p1;
      prevP2 = d.p2;
      prevS1 = d.s1;
      prevS2 = d.s2;
      document.getElementById('team1-points').innerText = d.p1;
      document.getElementById('team2-points').innerText = d.p2;
      document.getElementById('sets-score').innerText = `${d.s1} : ${d.s2}`;
    }

    // Läuft alle 3 Sekunden und aktualisiert nur den dynamischen Spielstand
    function updateLiveScore(d) {
      // Heim-Punkte & Animation
      if (prevP1 !== null && prevP1 !== d.p1) {
        triggerPulse('team1-points');
      }
      prevP1 = d.p1;
      document.getElementById('team1-points').innerText = d.p1;

      // Gast-Punkte & Animation
      if (prevP2 !== null && prevP2 !== d.p2) {
        triggerPulse('team2-points');
      }
      prevP2 = d.p2;
      document.getElementById('team2-points').innerText = d.p2;

      // Sätze & Animation
      if ((prevS1 !== null && prevS1 !== d.s1) || (prevS2 !== null && prevS2 !== d.s2)) {
        triggerPulse('sets-score');
      }
      prevS1 = d.s1;
      prevS2 = d.s2;
      document.getElementById('sets-score').innerText = `${d.s1} : ${d.s2}`;
    }

    function triggerPulse(elementId) {
      const el = document.getElementById(elementId);
      if (!el) return;
      el.classList.remove('pulse');
      void el.offsetWidth;
      el.classList.add('pulse');
      setTimeout(() => el.classList.remove('pulse'), 450);
    }
  </script>
</body>
</html>

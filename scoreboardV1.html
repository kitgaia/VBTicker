<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Volleyball Scoreboard Overlay - V1 Mobile Optimized</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0b0f19; /* Dunkler Hintergrund zum Testen auf dem Handy (in OBS transparent) */
      font-family: 'Helvetica Neue', Arial, sans-serif;
      overflow-x: hidden;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    /* Team-Farben Variablen */
    :root {
      --color-home: #00f2fe;
      --color-guest: #f59e0b;
    }

    /* Container für Scoreboard oben mittig - Mobil skaliert */
    .scoreboard-wrapper {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      z-index: 10;
      width: 96vw;
      max-width: 800px;
      animation: slideDownIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes slideDownIn {
      0% { opacity: 0; transform: translate(-50%, -30px); }
      100% { opacity: 1; transform: translate(-50%, 0); }
    }

    /* V1 Haupt-Scoreboard (Flexibel für Mobile) */
    .scoreboard {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      background: linear-gradient(135deg, #030712 0%, #0f172a 100%);
      border-radius: 6px;
      padding: 8px 12px;
      color: #ffffff;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
      border-left: 5px solid var(--color-home);
      border-right: 5px solid var(--color-guest);
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      border-bottom: 2px solid rgba(255, 255, 255, 0.1);
      font-weight: 800;
      gap: 8px;
    }

    /* Team-Hälften passen sich flexibel an Handyscreens an */
    .team { 
      display: flex; 
      align-items: center; 
      justify-content: space-between; 
      flex: 1; 
      gap: 8px; 
      min-width: 0; /* Verhindert Flexbox-Überlauf */
    }
    .team.home { flex-direction: row; }
    .team.guest { flex-direction: row-reverse; }
    
    .team-logo {
      width: 28px;
      height: 28px;
      object-fit: contain;
      flex-shrink: 0;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
    }

    .team-name {
      font-size: clamp(12px, 3.5vw, 18px); /* Skaliert automatisch mit der Bildschirmgröße */
      letter-spacing: 1px;
      text-transform: uppercase;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis; /* Schneidet extrem lange Namen auf Handys elegant mit ... ab */
      font-weight: 900;
      text-align: center;
      flex-grow: 1;
    }

    /* Punkte-Anzeige mit Pulse-Animation */
    .points {
      background: var(--color-home);
      color: #030712;
      font-size: clamp(20px, 5vw, 28px);
      font-weight: 900;
      padding: 2px 10px;
      border-radius: 2px;
      min-width: 42px;
      text-align: center;
      flex-shrink: 0;
      box-shadow: inset 0 2px 4px rgba(0,0,0,0.2);
      transition: background-color 0.3s ease;
      display: inline-block;
    }
    .guest .points { background: var(--color-guest); color: #030712; }

    @keyframes pulseScore {
      0% { transform: scale(1); }
      50% { transform: scale(1.3); filter: brightness(1.3); }
      100% { transform: scale(1); }
    }
    .pulse {
      animation: pulseScore 0.4s ease-out !important;
    }

    .sets-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 0 8px;
      flex-shrink: 0;
      border-left: 2px solid rgba(255,255,255,0.1);
      border-right: 2px solid rgba(255,255,255,0.1);
    }
    .sets-score { font-size: clamp(16px, 4vw, 20px); color: #f8fafc; letter-spacing: 2px; font-weight: 900; display: inline-block; }
    .sets-label { font-size: 7px; color: #38bdf8; text-transform: uppercase; letter-spacing: 1px; font-weight: 900; }

    /* Versions-Badge unten rechts */
    .version-badge {
      position: fixed;
      bottom: 15px;
      right: 15px;
      background: rgba(3, 7, 18, 0.85);
      border: 1px solid rgba(0, 242, 254, 0.4);
      color: var(--color-home);
      font-size: 10px;
      font-weight: 900;
      padding: 3px 8px;
      border-radius: 4px;
      letter-spacing: 1px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.6);
      z-index: 1000;
      text-transform: uppercase;
      backdrop-filter: blur(4px);
    }
  </style>
</head>
<body>

  <!-- Version Badge -->
  <div class="version-badge">v1.2 (Mobile)</div>

  <!-- Scoreboard -->
  <div class="scoreboard-wrapper">
    <div class="scoreboard" id="main-scoreboard">
      <div class="team home">
        <img id="team1-logo" class="team-logo" src="" style="display:none;" alt="">
        <span id="team1-name" class="team-name">HEIM</span>
        <span id="team1-points" class="points">0</span>
      </div>

      <div class="sets-container">
        <span class="sets-label">SÄTZE</span>
        <span id="sets-score" class="sets-score">0 : 0</span>
      </div>

      <div class="team guest">
        <img id="team2-logo" class="team-logo" src="" style="display:none;" alt="">
        <span id="team2-name" class="team-name">GAST</span>
        <span id="team2-points" class="points">0</span>
      </div>
    </div>
  </div>

  <script>
    const WORKER_URL = "https://rapid-bread-25a8.nick-valbert2006.workers.dev";
    
    let fetchInterval = null;
    let prevP1 = null;
    let prevP2 = null;
    let prevS1 = null;
    let prevS2 = null;
    let isInitialized = false;

    document.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      const matchId = urlParams.get('match') || '9f93d1e6-58df-4116-ac9c-62992ab9641b';
      const assoc = urlParams.get('assoc') || urlParams.get('verband') || 'wvv';

      // Sofortiger erster Abruf
      fetchScore(matchId, assoc);
      
      // Auf 5 Sekunden erhöht, um 403-Timeouts auf dem Handy zu verhindern
      fetchInterval = setInterval(() => fetchScore(matchId, assoc), 5000);
    });

    async function fetchScore(matchId, assoc) {
      try {
        const response = await fetch(`${WORKER_URL}/?match=${matchId}&assoc=${assoc}`);
        if (!response.ok) return;

        const data = await response.json();

        const uiData = {
          team1: data.teams?.team1?.name || 'HEIM',
          team2: data.teams?.team2?.name || 'GAST',
          logo1: data.teams?.team1?.logo || null,
          logo2: data.teams?.team2?.logo || null,
          p1: data.score?.currentSetScore?.team1 ?? 0,
          p2: data.score?.currentSetScore?.team2 ?? 0,
          s1: data.score?.sets?.team1 ?? 0,
          s2: data.score?.sets?.team2 ?? 0
        };

        if (!isInitialized) {
          initializeStaticData(uiData);
          isInitialized = true;
        }

        updateLiveScore(uiData);

      } catch (err) {
        console.error('Ticker-Fehler:', err);
      }
    }

    function initializeStaticData(d) {
      document.getElementById('team1-name').innerText = d.team1;
      document.getElementById('team2-name').innerText = d.team2;

      const logo1El = document.getElementById('team1-logo');
      if (d.logo1) { 
        logo1El.src = d.logo1; 
        logo1El.style.display = 'block'; 
      } else { 
        logo1El.style.display = 'none'; 
      }

      const logo2El = document.getElementById('team2-logo');
      if (d.logo2) { 
        logo2El.src = d.logo2; 
        logo2El.style.display = 'block'; 
      } else { 
        logo2El.style.display = 'none'; 
      }

      prevP1 = d.p1;
      prevP2 = d.p2;
      prevS1 = d.s1;
      prevS2 = d.s2;
      document.getElementById('team1-points').innerText = d.p1;
      document.getElementById('team2-points').innerText = d.p2;
      document.getElementById('sets-score').innerText = `${d.s1} :${d.s2}`;
    }

    function updateLiveScore(d) {
      if (prevP1 !== null && prevP1 !== d.p1) {
        triggerPulse('team1-points');
      }
      prevP1 = d.p1;
      document.getElementById('team1-points').innerText = d.p1;

      if (prevP2 !== null && prevP2 !== d.p2) {
        triggerPulse('team2-points');
      }
      prevP2 = d.p2;
      document.getElementById('team2-points').innerText = d.p2;

      if ((prevS1 !== null && prevS1 !== d.s1) || (prevS2 !== null && prevS2 !== d.s2)) {
        triggerPulse('sets-score');
      }
      prevS1 = d.s1;
      prevS2 = d.s2;
      document.getElementById('sets-score').innerText = `${d.s1} : `${d.s2}`;
    }

    function triggerPulse(elementId) {
      const el = document.getElementById(elementId);
      if (!el) return;
      el.classList.remove('pulse');
      void el.offsetWidth;
      el.classList.add('pulse');
      setTimeout(() => el.classList.remove('pulse'), 450);
    }
  </script>
</body>
</html>

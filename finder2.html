<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SAMS Match Finder - Gefiltert</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0b0f19;
      color: #f8fafc;
      font-family: 'Helvetica Neue', Arial, sans-serif;
      padding: 16px;
    }
    .container {
      max-width: 800px;
      margin: 0 auto;
    }
    h1 {
      font-size: 22px;
      margin-bottom: 6px;
      color: #00f2fe;
    }
    p {
      color: #94a3b8;
      margin-bottom: 16px;
      font-size: 13px;
    }
    
    /* Filter-Bereich */
    .filter-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
      margin-bottom: 16px;
    }
    @media(min-width: 600px) {
      .filter-grid {
        grid-template-columns: 1fr 1fr;
      }
      .filter-full {
        grid-column: span 2;
      }
    }

    .filter-control {
      width: 100%;
      padding: 10px 12px;
      background: #1e293b;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 6px;
      color: white;
      font-size: 14px;
      outline: none;
    }
    .filter-control:focus {
      border-color: #00f2fe;
    }
    label {
      display: block;
      font-size: 11px;
      color: #94a3b8;
      margin-bottom: 4text-transform;
      text-transform: uppercase;
      font-weight: 700;
    }

    .match-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .match-card {
      background: linear-gradient(135deg, #030712 0%, #0f172a 100%);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-left: 4px solid #00f2fe;
      border-radius: 6px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }
    .match-header {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: #38bdf8;
      font-weight: 700;
      text-transform: uppercase;
      gap: 8px;
    }
    .match-teams {
      font-size: 16px;
      font-weight: 900;
      letter-spacing: 0.5px;
      word-break: break-word;
    }
    .match-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 4px;
      padding-top: 8px;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      gap: 8px;
    }
    .match-id {
      font-family: monospace;
      font-size: 10px;
      color: #64748b;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .btn-group {
      display: flex;
      gap: 6px;
      flex-shrink: 0;
    }
    .action-btn {
      border: none;
      padding: 6px 12px;
      font-weight: 900;
      font-size: 11px;
      border-radius: 4px;
      cursor: pointer;
      text-transform: uppercase;
      transition: all 0.2s ease;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .copy-btn {
      background: #00f2fe;
      color: #030712;
    }
    .copy-btn:hover { background: #38bdf8; }
    .copy-btn.copied { background: #4ade80; color: #030712; }

    .open-btn {
      background: #334155;
      color: #f8fafc;
    }
    .open-btn:hover { background: #475569; }

    .loading {
      text-align: center;
      color: #94a3b8;
      margin-top: 40px;
      font-size: 15px;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>SAMS Match Finder</h1>
    <p>Nutze die Filteroptionen, um gezielt nach Spielen, Ligen oder Zeiträumen zu suchen.</p>
    
    <!-- Filter Sektion -->
    <div class="filter-grid">
      <div class="filter-full">
        <label>Team-Suche</label>
        <input type="text" id="search-input" class="filter-control" placeholder="z.B. Meinerzhagen..." value="Meinerzhagen">
      </div>

      <div>
        <label>Geschlecht</label>
        <select id="filter-gender" class="filter-control">
          <option value="all">Alle</option>
          <option value="damen">Damen / Frauen</option>
          <option value="herren">Herren / Männer</option>
          <option value="mixed">Mixed</option>
        </select>
      </div>

      <div>
        <label>Liga</label>
        <select id="filter-league" class="filter-control">
          <option value="all">Alle Ligen</option>
        </select>
      </div>

      <div>
        <label>Datum von</label>
        <input type="date" id="date-from" class="filter-control">
      </div>

      <div>
        <label>Datum bis</label>
        <input type="date" id="date-to" class="filter-control">
      </div>
    </div>

    <div id="status" class="loading">Lade Spieldaten vom Worker...</div>
    <div id="match-list" class="match-list"></div>
  </div>

  <script>
    const WORKER_URL = "https://rapid-bread-25a8.nick-valbert2006.workers.dev";
    let allMatches = [];

    document.addEventListener('DOMContentLoaded', () => {
      loadMatches();
      
      // Event Listener für alle Filter-Änderungen
      document.getElementById('search-input').addEventListener('input', renderMatches);
      document.getElementById('filter-gender').addEventListener('change', renderMatches);
      document.getElementById('filter-league').addEventListener('change', renderMatches);
      document.getElementById('date-from').addEventListener('change', renderMatches);
      document.getElementById('date-to').addEventListener('change', renderMatches);
    });

    async function loadMatches() {
      const statusEl = document.getElementById('status');
      try {
        const response = await fetch(`${WORKER_URL}/?assoc=wvv`);
        if (!response.ok) throw new Error("Fehler beim Abrufen der Daten vom Worker");

        const data = await response.json();
        allMatches = [];
        const leaguesSet = new Set();

        if (Array.isArray(data.matchDays)) {
          data.matchDays.forEach(day => {
            if (Array.isArray(day.matches)) {
              day.matches.forEach(m => {
                const team1 = m.team1?.name || m.team1Name || m.teamDescription1 || '';
                const team2 = m.team2?.name || m.team2Name || m.teamDescription2 || '';
                const matchId = m.id || m.matchId || m.uuid || m.matchUuid || '';
                const rawDate = m.date || m.startDate || day.date || null;
                const league = m.leagueName || m.competitionName || 'WVV Liga';

                if (matchId && (team1 || team2)) {
                  leaguesSet.add(league);
                  allMatches.push({
                    id: matchId,
                    team1: team1 || 'Unbekannt',
                    team2: team2 || 'Unbekannt',
                    dateObj: rawDate ? new Date(rawDate) : new Date(0),
                    formattedDate: formatDate(rawDate),
                    league: league
                  });
                }
              });
            }
          });
        }

        // Liga-Dropdown dynamisch befüllen
        const leagueSelect = document.getElementById('filter-league');
        Array.from(leaguesSet).sort().forEach(l => {
          const opt = document.createElement('option');
          opt.value = l;
          opt.textContent = l;
          leagueSelect.appendChild(opt);
        });

        // Nach Datum sortieren
        allMatches.sort((a, b) => a.dateObj - b.dateObj);

        statusEl.style.display = 'none';
        renderMatches();

      } catch (err) {
        statusEl.innerText = "Fehler beim Laden: " + err.message;
      }
    }

    function formatDate(dateInput) {
      if (!dateInput) return 'Datum unbekannt';
      try {
        const d = new Date(dateInput);
        if (isNaN(d.getTime())) return dateInput;
        return d.toLocaleDateString('de-DE', {
          weekday: 'short',
          day: '2-digit',
          month: '2-digit',
          year: 'numeric',
          hour: '2-digit',
          minute: '2-digit'
        }) + ' Uhr';
      } catch {
        return dateInput;
      }
    }

    function renderMatches() {
      const query = document.getElementById('search-input').value.toLowerCase();
      const genderFilter = document.getElementById('filter-gender').value;
      const leagueFilter = document.getElementById('filter-league').value;
      const dateFromVal = document.getElementById('date-from').value;
      const dateToVal = document.getElementById('date-to').value;
      
      const listEl = document.getElementById('match-list');

      const filtered = allMatches.filter(m => {
        // 1. Textsuche (Teams oder Liga)
        const matchesQuery = m.team1.toLowerCase().includes(query) || 
                             m.team2.toLowerCase().includes(query) ||
                             m.league.toLowerCase().includes(query);
        if (!matchesQuery) return false;

        // 2. Liga Filter
        if (leagueFilter !== 'all' && m.league !== leagueFilter) return false;

        // 3. Geschlechter Filter (Erkennung über gängige Schlüsselwörter im Liginamen oder Teamnamen)
        if (genderFilter !== 'all') {
          const textToCheck = (m.league + " " + m.team1 + " " + m.team2).toLowerCase();
          const isDamen = textToCheck.includes('damen') || textToCheck.includes('frauen') || textToCheck.includes('w.');
          const isHerren = textToCheck.includes('herren') || textToCheck.includes('männer') || textToCheck.includes('m.');
          
          if (genderFilter === 'damen' && !isDamen) return false;
          if (genderFilter === 'herren' && !isHerren) return false;
          if (genderFilter === 'mixed' && !textToCheck.includes('mixed')) return false;
        }

        // 4. Datumsfilter (Von / Bis)
        if (dateFromVal && m.dateObj.getTime() !== 0) {
          const fromDate = new Date(dateFromVal);
          fromDate.setHours(0, 0, 0, 0);
          if (m.dateObj < fromDate) return false;
        }

        if (dateToVal && m.dateObj.getTime() !== 0) {
          const toDate = new Date(dateToVal);
          toDate.setHours(23, 59, 59, 999);
          if (m.dateObj > toDate) return false;
        }

        return true;
      });

      if (filtered.length === 0) {
        listEl.innerHTML = '<div class="loading">Keine Spiele für diese Filterkriterien gefunden.</div>';
        return;
      }

      const scoreboardBaseUrl = "https://kitgaia.github.io/VBTicker/scoreboardV1.html";

      listEl.innerHTML = filtered.map(m => {
        const fullLink = `${scoreboardBaseUrl}?match=${m.id}&assoc=wvv`;
        return `
          <div class="match-card">
            <div class="match-header">
              <span>📅 ${m.formattedDate}</span>
              <span>${m.league}</span>
            </div>
            <div class="match-teams">${m.team1} vs. ${m.team2}</div>
            <div class="match-footer">
              <span class="match-id" title="${m.id}">ID: ${m.id}</span>
              <div class="btn-group">
                <a href="${fullLink}" target="_blank" class="action-btn open-btn">Öffnen</a>
                <button class="action-btn copy-btn" onclick="copyToClipboard('${fullLink}', this)">Kopieren</button>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    function copyToClipboard(text, btnElement) {
      navigator.clipboard.writeText(text).then(() => {
        const originalText = btnElement.innerText;
        btnElement.innerText = "Kopiert!";
        btnElement.classList.add('copied');
        setTimeout(() => {
          btnElement.innerText = originalText;
          btnElement.classList.remove('copied');
        }, 2000);
      }).catch(err => {
        alert('Fehler beim Kopieren: ' + err);
      });
    }
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SAMS Match Finder - Smart Filter</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0b0f19;
      color: #f8fafc;
      font-family: 'Helvetica Neue', Arial, sans-serif;
      padding: 16px;
    }
    .container {
      max-width: 800px;
      margin: 0 auto;
    }
    
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    h1 {
      font-size: 22px;
      color: #00f2fe;
    }
    
    /* Filter Toggle Button */
    .filter-toggle-btn {
      background: #1e293b;
      color: #00f2fe;
      border: 1px solid rgba(0, 242, 254, 0.4);
      padding: 8px 14px;
      border-radius: 6px;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      text-transform: uppercase;
    }
    .filter-toggle-btn:hover {
      background: #334155;
    }

    /* Filter Sektion (Einklappbar) */
    .filter-container {
      background: #111827;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      padding: 14px;
      margin-bottom: 16px;
      display: none; /* Standardmäßig eingeklappt, kann per Button geöffnet werden */
      flex-direction: column;
      gap: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.6);
    }
    .filter-container.show {
      display: flex;
    }

    .filter-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
    }
    @media(min-width: 600px) {
      .filter-grid {
        grid-template-columns: 1fr 1fr;
      }
      .filter-full {
        grid-column: span 2;
      }
    }

    .filter-control {
      width: 100%;
      padding: 10px 12px;
      background: #1e293b;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 6px;
      color: white;
      font-size: 14px;
      outline: none;
    }
    .filter-control:focus {
      border-color: #00f2fe;
    }
    label {
      display: block;
      font-size: 11px;
      color: #94a3b8;
      margin-bottom: 4px;
      text-transform: uppercase;
      font-weight: 700;
    }

    .match-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .match-card {
      background: linear-gradient(135deg, #030712 0%, #0f172a 100%);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-left: 4px solid #00f2fe;
      border-radius: 6px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }
    .match-card.today-highlight {
      border-left-color: #4ade80; /* Heutige Spiele grün hervorheben */
    }
    .match-header {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: #38bdf8;
      font-weight: 700;
      text-transform: uppercase;
      gap: 8px;
    }
    .match-teams {
      font-size: 16px;
      font-weight: 900;
      letter-spacing: 0.5px;
      word-break: break-word;
    }
    .match-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 4px;
      padding-top: 8px;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      gap: 8px;
    }
    .match-id {
      font-family: monospace;
      font-size: 10px;
      color: #64748b;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .btn-group {
      display: flex;
      gap: 6px;
      flex-shrink: 0;
    }
    .action-btn {
      border: none;
      padding: 6px 12px;
      font-weight: 900;
      font-size: 11px;
      border-radius: 4px;
      cursor: pointer;
      text-transform: uppercase;
      transition: all 0.2s ease;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .copy-btn {
      background: #00f2fe;
      color: #030712;
    }
    .copy-btn:hover { background: #38bdf8; }
    .copy-btn.copied { background: #4ade80; color: #030712; }

    .open-btn {
      background: #334155;
      color: #f8fafc;
    }
    .open-btn:hover { background: #475569; }

    .loading {
      text-align: center;
      color: #94a3b8;
      margin-top: 40px;
      font-size: 15px;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="top-bar">
      <h1>SAMS Match Finder</h1>
      <button class="filter-toggle-btn" onclick="toggleFilter()">🔍 Filter</button>
    </div>

    <!-- Filter Sektion (Geschlecht -> Liga -> Mannschaft) -->
    <div id="filter-container" class="filter-container">
      <div class="filter-grid">
        <div class="filter-full">
          <label>Freitext-Suche (Team / Begriff)</label>
          <input type="text" id="search-input" class="filter-control" placeholder="Suchen...">
        </div>

        <div>
          <label>1. Geschlecht</label>
          <select id="filter-gender" class="filter-control">
            <option value="all">Alle Geschlechter</option>
            <option value="FEMALE">Damen / Frauen</option>
            <option value="MALE">Herren / Männer</option>
            <option value="MIXED">Mixed</option>
          </select>
        </div>

        <div>
          <label>2. Liga auswählen</label>
          <select id="filter-league" class="filter-control">
            <option value="all">Alle Ligen</option>
          </select>
        </div>

        <div class="filter-full">
          <label>3. Mannschaft auswählen</label>
          <select id="filter-team" class="filter-control">
            <option value="all">Alle Mannschaften</option>
          </select>
        </div>
      </div>
    </div>

    <div id="status" class="loading">Lade Spieldaten vom Worker...</div>
    <div id="match-list" class="match-list"></div>
  </div>

  <script>
    const WORKER_URL = "https://rapid-bread-25a8.nick-valbert2006.workers.dev";
    let allMatches = [];
    let leaguesMap = new Map(); // Speichert Ligen mit zugehörigen Infos

    document.addEventListener('DOMContentLoaded', () => {
      loadMatches();
      
      // Events für Filter
      document.getElementById('search-input').addEventListener('input', renderMatches);
      document.getElementById('filter-gender').addEventListener('change', onGenderChange);
      document.getElementById('filter-league').addEventListener('change', onLeagueChange);
      document.getElementById('filter-team').addEventListener('change', renderMatches);
    });

    function toggleFilter() {
      const box = document.getElementById('filter-container');
      box.classList.toggle('show');
    }

    async function loadMatches() {
      const statusEl = document.getElementById('status');
      try {
        const response = await fetch(`${WORKER_URL}/?assoc=wvv`);
        if (!response.ok) throw new Error("Fehler beim Abrufen der Daten vom Worker");

        const data = await response.json();
        allMatches = [];
        leaguesMap.clear();

        // 1. Ligen-Struktur auslesen falls vorhanden (SAMS Struktur)
        if (data.leagues && typeof data.leagues === 'object') {
          Object.values(data.leagues).forEach(l => {
            if (l.id) {
              leaguesMap.set(l.id, {
                id: l.id,
                name: l.name || 'Unbekannte Liga',
                gender: l.gender || 'UNKNOWN',
                matches: l.matches || []
              });
            }
          });
        }

        // 2. Spiele einsammeln
        if (Array.isArray(data.matchDays)) {
          data.matchDays.forEach(day => {
            if (Array.isArray(day.matches)) {
              day.matches.forEach(m => {
                const team1 = m.team1?.name || m.team1Name || m.teamDescription1 || '';
                const team2 = m.team2?.name || m.team2Name || m.teamDescription2 || '';
                const matchId = m.id || m.matchId || m.uuid || m.matchUuid || '';
                const rawDate = m.date || m.startDate || day.date || null;
                const leagueId = m.leagueId || m.league?.id || '';
                
                // Versuche Geschlecht aus Liga-Daten zu ermitteln
                let gender = 'UNKNOWN';
                let leagueName = m.leagueName || m.competitionName || 'WVV Liga';

                if (leagueId && leaguesMap.has(leagueId)) {
                  const lData = leaguesMap.get(leagueId);
                  gender = lData.gender;
                  leagueName = lData.name;
                } else {
                  // Fallback Texterkennung
                  const checkTxt = (leagueName + " " + team1).toLowerCase();
                  if (checkTxt.includes('damen') || checkTxt.includes('frauen') || checkTxt.includes('w.')) gender = 'FEMALE';
                  else if (checkTxt.includes('herren') || checkTxt.includes('männer') || checkTxt.includes('m.')) gender = 'MALE';
                }

                if (matchId && (team1 || team2)) {
                  allMatches.push({
                    id: matchId,
                    team1: team1 || 'Unbekannt',
                    team2: team2 || 'Unbekannt',
                    dateObj: rawDate ? new Date(rawDate) : new Date(0),
                    formattedDate: formatDate(rawDate),
                    league: leagueName,
                    leagueId: leagueId,
                    gender: gender
                  });
                }
              });
            }
          });
        }

        // Nach Datum sortieren (chronologisch aufsteigend)
        allMatches.sort((a, b) => a.dateObj - b.dateObj);

        updateLeagueDropdown();
        statusEl.style.display = 'none';
        renderMatches();

        // Automatischer Scroll zum heutigen Tag (oder dem nächsten anstehenden Spiel)
        scrollToToday();

      } catch (err) {
        statusEl.innerText = "Fehler beim Laden: " + err.message;
      }
    }

    // Filter-Abhängigkeit 1: Wenn Geschlecht geändert wird -> Ligen anpassen
    function onGenderChange() {
      updateLeagueDropdown();
      renderMatches();
    }

    // Füllt das Liga-Dropdown abhängig vom gewählten Geschlecht
    function updateLeagueDropdown() {
      const genderVal = document.getElementById('filter-gender').value;
      const leagueSelect = document.getElementById('filter-league');
      
      // Aktuelle Auswahl merken
      const currentLeague = leagueSelect.value;
      
      leagueSelect.innerHTML = '<option value="all">Alle Ligen</option>';

      const uniqueLeagues = new Map();
      allMatches.forEach(m => {
        if (genderVal === 'all' || m.gender === genderVal) {
          uniqueLeagues.set(m.league, m.league);
        }
      });

      Array.from(uniqueLeagues.keys()).sort().forEach(lName => {
        const opt = document.createElement('option');
        opt.value = lName;
        opt.textContent = lName;
        leagueSelect.appendChild(opt);
      });

      // Versuche vorherige Auswahl beizubehalten falls gültig
      leagueSelect.value = uniqueLeagues.has(currentLeague) ? currentLeague : 'all';
      updateTeamDropdown();
    }

    // Filter-Abhängigkeit 2: Wenn Liga geändert wird -> Mannschaften anpassen
    function onLeagueChange() {
      updateTeamDropdown();
      renderMatches();
    }

    // Füllt das Mannschafts-Dropdown abhängig von Geschlecht und Liga
    function updateTeamDropdown() {
      const genderVal = document.getElementById('filter-gender').value;
      const leagueVal = document.getElementById('filter-league').value;
      const teamSelect = document.getElementById('filter-team');

      const currentTeam = teamSelect.value;
      teamSelect.innerHTML = '<option value="all">Alle Mannschaften</option>';

      const teamsSet = new Set();
      allMatches.forEach(m => {
        if (genderVal !== 'all' && m.gender !== genderVal) return;
        if (leagueVal !== 'all' && m.league !== leagueVal) return;
        teamsSet.add(m.team1);
        teamsSet.add(m.team2);
      });

      Array.from(teamsSet).sort().forEach(teamName => {
        const opt = document.createElement('option');
        opt.value = teamName;
        opt.textContent = teamName;
        teamSelect.appendChild(opt);
      });

      teamSelect.value = teamsSet.has(currentTeam) ? currentTeam : 'all';
    }

    function formatDate(dateInput) {
      if (!dateInput) return 'Datum unbekannt';
      try {
        const d = new Date(dateInput);
        if (isNaN(d.getTime())) return dateInput;
        return d.toLocaleDateString('de-DE', {
          weekday: 'short',
          day: '2-digit',
          month: '2-digit',
          year: 'numeric',
          hour: '2-digit',
          minute: '2-digit'
        }) + ' Uhr';
      } catch {
        return dateInput;
      }
    }

    function renderMatches() {
      const query = document.getElementById('search-input').value.toLowerCase();
      const genderFilter = document.getElementById('filter-gender').value;
      const leagueFilter = document.getElementById('filter-league').value;
      const teamFilter = document.getElementById('filter-team').value;
      
      const listEl = document.getElementById('match-list');

      const filtered = allMatches.filter(m => {
        // Freitext
        if (query && !m.team1.toLowerCase().includes(query) && !m.team2.toLowerCase().includes(query) && !m.league.toLowerCase().includes(query)) {
          return false;
        }
        // Geschlecht
        if (genderFilter !== 'all' && m.gender !== genderFilter) return false;
        // Liga
        if (leagueFilter !== 'all' && m.league !== leagueFilter) return false;
        // Mannschaft
        if (teamFilter !== 'all' && m.team1 !== teamFilter && m.team2 !== teamFilter) return false;

        return true;
      });

      if (filtered.length === 0) {
        listEl.innerHTML = '<div class="loading">Keine Spiele für diese Auswahl gefunden.</div>';
        return;
      }

      const scoreboardBaseUrl = "https://kitgaia.github.io/VBTicker/scoreboardV1.html";
      const now = new Date();

      listEl.innerHTML = filtered.map(m => {
        const fullLink = `${scoreboardBaseUrl}?match=${m.id}&assoc=wvv`;
        // Markiere Spiele, die heute stattfinden
        const isToday = m.dateObj.toDateString() === now.toDateString();

        return `
          <div class="match-card ${isToday ? 'today-highlight' : ''}" data-id="${m.id}" data-time="${m.dateObj.getTime()}">
            <div class="match-header">
              <span>📅 ${m.formattedDate} ${isToday ? '⭐ (HEUTE)' : ''}</span>
              <span>${m.league}</span>
            </div>
            <div class="match-teams">${m.team1} vs. ${m.team2}</div>
            <div class="match-footer">
              <span class="match-id" title="${m.id}">ID: ${m.id}</span>
              <div class="btn-group">
                <a href="${fullLink}" target="_blank" class="action-btn open-btn">Öffnen</a>
                <button class="action-btn copy-btn" onclick="copyToClipboard('${fullLink}', this)">Kopieren</button>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    // Scrollt beim Start automatisch zum nächsten anstehenden Spiel (heute oder Zukunft)
    function scrollToToday() {
      const nowTime = new Date().getTime();
      const cards = document.querySelectorAll('.match-card');
      let targetCard = null;

      for (let card of cards) {
        const cardTime = parseInt(card.getAttribute('data-time'));
        if (cardTime >= nowTime) {
          targetCard = card;
          break; // Nimmt das erste Spiel ab jetzt
        }
      }

      if (targetCard) {
        targetCard.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }
    }

    function copyToClipboard(text, btnElement) {
      navigator.clipboard.writeText(text).then(() => {
        const originalText = btnElement.innerText;
        btnElement.innerText = "Kopiert!";
        btnElement.classList.add('copied');
        setTimeout(() => {
          btnElement.innerText = originalText;
          btnElement.classList.remove('copied');
        }, 2000);
      }).catch(err => {
        alert('Fehler beim Kopieren: ' + err);
      });
    }
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Volleyball Scoreboard Overlay - VNL Edition v1.3.4</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: transparent;
      font-family: 'Helvetica Neue', Arial, sans-serif;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
    }

    /* Team-Farben Variablen */
    :root {
      --color-home: #00f2fe;
      --color-guest: #f59e0b;
    }

    /* Container für Scoreboard + Sub-Popups oben mittig */
    .scoreboard-wrapper {
      position: absolute;
      top: 30px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      z-index: 10;
      width: fit-content;
      max-width: 95vw;
    }

    /* VNL Haupt-Scoreboard (Clean & Minimalistisch) */
    .scoreboard {
      display: inline-flex;
      align-items: center;
      background: linear-gradient(135deg, #030712 0%, #0f172a 100%);
      border-radius: 4px;
      padding: 10px 22px;
      color: #ffffff;
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.8);
      border-left: 6px solid var(--color-home);
      border-right: 6px solid var(--color-guest);
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      border-bottom: 2px solid rgba(255, 255, 255, 0.1);
      font-weight: 800;
      gap: 18px;
      white-space: nowrap;
    }

    /* Jede Seite bekommt exakt denselben Platz, damit beide Hälften gleich lang sind */
    .team { 
      display: flex; 
      align-items: center; 
      justify-content: space-between; 
      min-width: 300px; 
      gap: 14px; 
    }
    .team.home { flex-direction: row; }
    .team.guest { flex-direction: row-reverse; }
    
    .team-logo {
      width: 32px;
      height: 32px;
      object-fit: contain;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
    }

    .team-name {
      font-size: 21px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      white-space: nowrap;
      overflow: visible;
      font-weight: 900;
      text-align: center;
      flex-grow: 1;
    }

    .points {
      background: var(--color-home);
      color: #030712;
      font-size: 30px;
      font-weight: 900;
      padding: 2px 14px;
      border-radius: 2px;
      min-width: 55px;
      text-align: center;
      box-shadow: inset 0 2px 4px rgba(0,0,0,0.2);
    }
    .guest .points { background: var(--color-guest); color: #030712; }

    .sets-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 0 16px;
      border-left: 2px solid rgba(255,255,255,0.1);
      border-right: 2px solid rgba(255,255,255,0.1);
    }
    .sets-score { font-size: 22px; color: #f8fafc; letter-spacing: 3px; font-weight: 900; }
    .sets-label { font-size: 8px; color: #38bdf8; text-transform: uppercase; letter-spacing: 2px; font-weight: 900; }

    /* Auswechslungs-Popups unter dem Scoreboard */
    .sub-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      width: 100%;
    }

    .sub-popup {
      background: rgba(3, 7, 18, 0.95);
      border-left: 4px solid var(--color-home);
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      border-right: 1px solid rgba(255, 255, 255, 0.1);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding: 8px 14px;
      border-radius: 4px;
      color: #ffffff;
      font-size: 13px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.7);
      display: flex;
      align-items: center;
      gap: 12px;
      opacity: 0;
      transform: translateY(-10px);
      transition: all 0.3s ease;
      max-width: 400px;
    }
    .sub-popup.guest-sub { border-left-color: var(--color-guest); }
    .sub-popup.show { opacity: 1; transform: translateY(0); }
    .sub-tag {
      background: var(--color-home);
      color: #030712;
      font-size: 9px;
      font-weight: 900;
      padding: 2px 6px;
      border-radius: 2px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .guest-sub .sub-tag { background: var(--color-guest); }
    .sub-out { color: #f87171; font-weight: 800; text-decoration: line-through; }
    .sub-in { color: #4ade80; font-weight: 800; }
    .sub-icon { font-weight: bold; color: #fbbf24; margin: 0 4px; }

    /* Versions-Badge unten rechts */
    .version-badge {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: rgba(3, 7, 18, 0.85);
      border: 1px solid rgba(0, 242, 254, 0.4);
      color: var(--color-home);
      font-size: 11px;
      font-weight: 900;
      padding: 4px 10px;
      border-radius: 4px;
      letter-spacing: 1.5px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.6);
      z-index: 1000;
      text-transform: uppercase;
      backdrop-filter: blur(4px);
    }

    /* VNL AUFSTELLUNGS-POPUP (Äußerer Container) */
    .vnl-fullscreen {
      position: fixed;
      top: 50%;
      left: 50%;
      width: 780px;
      height: 480px;
      background: rgba(3, 7, 18, 0.96);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 20px 25px;
      color: white;
      opacity: 0;
      pointer-events: none;
      transform: translate(-50%, -50%) scale(0.92);
      transition: all 0.3s ease;
      z-index: 100;
      box-shadow: 0 25px 60px rgba(0,0,0,0.85);
    }
    .vnl-active {
      opacity: 1;
      pointer-events: auto;
      transform: translate(-50%, -50%) scale(1);
    }

    /* Flache Kopfleiste */
    .vnl-top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding-bottom: 10px;
    }
    .vnl-event-title {
      font-size: 15px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: #94a3b8;
    }
    .vnl-match-subtitle {
      font-size: 11px;
      color: #64748b;
      letter-spacing: 1px;
      text-transform: uppercase;
      font-weight: 700;
    }

    .vnl-team-header {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin: 5px 0 10px 0;
      z-index: 2;
    }
    .vnl-team-title-text {
      font-size: 20px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: var(--color-home);
    }
    .guest-mode .vnl-team-title-text { color: var(--color-guest); }

    .vnl-court-container {
      perspective: 1000px;
      flex-grow: 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .vnl-court-diagram {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      background: linear-gradient(180deg, rgba(15, 23, 42, 0.8) 0%, rgba(3, 7, 18, 0.95) 100%);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 6px;
      padding: 15px 25px;
      position: relative;
      box-shadow: inset 0 0 25px rgba(0,0,0,0.6);
      transform: rotateX(14deg);
      transform-origin: center center;
    }

    .court-net-line {
      position: absolute;
      top: 50%;
      left: 10%;
      width: 80%;
      height: 1px;
      border-top: 1px dashed rgba(255, 255, 255, 0.3);
    }

    .court-row {
      display: flex;
      justify-content: space-between;
      width: 100%;
      max-width: 880px;
      margin: 0 auto;
      z-index: 2;
    }

    .vnl-player-card {
      background: linear-gradient(135deg, #090d16 0%, #1e293b 100%);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-left: 3px solid var(--color-home);
      border-radius: 4px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 8px 12px;
      text-align: center;
      min-width: 200px;
      box-shadow: 0 6px 15px rgba(0,0,0,0.5);
    }
    .guest-mode .vnl-player-card { border-left-color: var(--color-guest); }

    .vnl-p-content {
      font-size: 14px;
      font-weight: 800;
      color: #ffffff;
      letter-spacing: 0.5px;
      white-space: nowrap;
    }

    .vnl-zone-tag {
      font-size: 8px;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-top: 2px;
      font-weight: 700;
    }
  </style>
</head>
<body>

  <!-- Versions-Badge -->
  <div class="version-badge">v1.3.4</div>

  <!-- Scoreboard & Sub-Popups (Zentriert oben, gleich lange Hälften) -->
  <div class="scoreboard-wrapper">
    <div class="scoreboard" id="main-scoreboard">
      <div class="team home">
        <img id="team1-logo" class="team-logo" src="" style="display:none;" alt="">
        <span id="team1-name" class="team-name">HEIM</span>
        <span id="team1-points" class="points">0</span>
      </div>

      <div class="sets-container">
        <span class="sets-label">SÄTZE</span>
        <span id="sets-score" class="sets-score">0 : 0</span>
      </div>

      <div class="team guest">
        <img id="team2-logo" class="team-logo" src="" style="display:none;" alt="">
        <span id="team2-name" class="team-name">GAST</span>
        <span id="team2-points" class="points">0</span>
      </div>
    </div>

    <div id="sub-container" class="sub-container"></div>
  </div>

  <!-- VNL Popup-Overlay -->
  <div id="vnl-overlay" class="vnl-fullscreen">
    <div class="vnl-top-bar">
      <div id="vnl-title" class="vnl-event-title">Satz 1 – Startaufstellung</div>
      <div id="vnl-subtitle" class="vnl-match-subtitle">SC Halle vs. TV Hörde</div>
    </div>

    <div class="vnl-team-header">
      <img id="vnl-team-logo" class="team-logo" style="width:28px; height:28px; display:none;" alt="">
      <span id="vnl-single-team-name" class="vnl-team-title-text">SC Halle</span>
    </div>

    <div class="vnl-court-container">
      <div class="vnl-court-diagram">
        <div class="court-net-line"></div>
        <div class="court-row" id="vnl-front-row"></div>
        <div class="court-row" id="vnl-back-row"></div>
      </div>
    </div>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    let matchId = urlParams.get('match') || 'a27bea5a-1330-4f40-b567-64c138dbd7ba';

    if (matchId === 'test') {
      runTestSimulation();
    } else {
      fetchScore();
      setInterval(fetchScore, 3000);
    }

    async function fetchScore() {
      try {
        const myWorker = "https://withered-sea-3b06.nick-valbert2006.workers.dev"; 
        const response = await fetch(`${myWorker}/?match=${matchId}`);
        if (!response.ok) return;

        const data = await response.json();
        const matchInfo = data.match || {};
        const stateInfo = data.state || {};

        let currentSetScore = { team1: 0, team2: 0 };
        if (stateInfo.matchSets && stateInfo.matchSets.length > 0) {
          const latestSet = stateInfo.matchSets[stateInfo.matchSets.length - 1];
          if (latestSet && latestSet.setScore) currentSetScore = latestSet.setScore;
        }

        updateUI({
          team1: matchInfo.teamDescription1 || 'Heim',
          team2: matchInfo.teamDescription2 || 'Gast',
          logo1: matchInfo.teamLogo1 || matchInfo.logo1 || null,
          logo2: matchInfo.teamLogo2 || matchInfo.logo2 || null,
          p1: currentSetScore.team1 ?? 0,
          p2: currentSetScore.team2 ?? 0,
          s1: stateInfo.setPoints?.team1 ?? 0,
          s2: stateInfo.setPoints?.team2 ?? 0
        });
      } catch (err) {
        console.error('Ticker-Fehler:', err);
      }
    }

    function updateUI(d) {
      document.getElementById('team1-name').innerText = d.team1;
      document.getElementById('team2-name').innerText = d.team2;
      document.getElementById('team1-points').innerText = d.p1;
      document.getElementById('team2-points').innerText = d.p2;
      document.getElementById('sets-score').innerText = `${d.s1} : ${d.s2}`;

      const logo1El = document.getElementById('team1-logo');
      if (d.logo1) { logo1El.src = d.logo1; logo1El.style.display = 'block'; }

      const logo2El = document.getElementById('team2-logo');
      if (d.logo2) { logo2El.src = d.logo2; logo2El.style.display = 'block'; }
    }

    function showTeamLineup(title, matchSub, teamName, players, logoUrl = null, isGuest = false) {
      document.getElementById('vnl-title').innerText = title;
      document.getElementById('vnl-subtitle').innerText = matchSub;
      document.getElementById('vnl-single-team-name').innerText = teamName;

      const overlay = document.getElementById('vnl-overlay');
      if (isGuest) { 
        overlay.classList.add('guest-mode'); 
      } else { 
        overlay.classList.remove('guest-mode'); 
      }

      const logoEl = document.getElementById('vnl-team-logo');
      if (logoUrl) { 
        logoEl.src = logoUrl; 
        logoEl.style.display = 'block'; 
      } else { 
        logoEl.style.display = 'none'; 
      }

      const frontPlayers = [players[0], players[1], players[2]];
      const backPlayers = [players[3], players[4], players[5]];

      document.getElementById('vnl-front-row').innerHTML = frontPlayers.map(p => `
        <div class="vnl-player-card">
          <div class="vnl-p-content">${p.number} ${p.name}</div>
          <div class="vnl-zone-tag">${p.pos}</div>
        </div>
      `).join('');

      document.getElementById('vnl-back-row').innerHTML = backPlayers.map(p => `
        <div class="vnl-player-card">
          <div class="vnl-p-content">${p.number} ${p.name}</div>
          <div class="vnl-zone-tag">${p.pos}</div>
        </div>
      `).join('');

      overlay.classList.add('vnl-active');
    }

    function hideVnlLineup() {
      document.getElementById('vnl-overlay').classList.remove('vnl-active');
    }

    function showSubPopup(substitutions, isGuest = false) {
      const subs = Array.isArray(substitutions) ? substitutions : [substitutions];
      const container = document.getElementById('sub-container');

      subs.forEach(sub => {
        const popup = document.createElement('div');
        popup.className = `sub-popup ${isGuest ? 'guest-sub' : ''}`;
        popup.innerHTML = `
          <span class="sub-tag">${sub.team}</span>
          <span>
            <span class="sub-out">${sub.outNum} ${sub.outName}</span> 
            <span class="sub-icon">⇄</span> 
            <span class="sub-in">${sub.inNum} ${sub.inName}</span>
          </span>
        `;
        
        container.appendChild(popup);
        setTimeout(() => popup.classList.add('show'), 50);

        setTimeout(() => {
          popup.classList.remove('show');
          setTimeout(() => popup.remove(), 300);
        }, 5000);
      });
    }

    function runTestSimulation() {
      const hTeam = "TuS Meinerzhagen II";
      const gTeam = "TV F.A. Dresselndorf II";
      const matchSub = `${hTeam} vs. ${gTeam}`;

      const lineUp1 = [
        { number: 9, name: "Giesbrecht", pos: "Diagonal" },
        { number: "10", name: "Dunkel", pos: "Mitte" },
        { number: 1, name: "Lüttel", pos: "Annahme" },
        { number: "5", name: "Franke", pos: "Annahme" },
        { number: "4", name: "Krotter", pos: "Mitte" },
        { number: "19", name: "Klinger", pos: "Zuspiel" }
      ];

      const lineUp2 = [
        { number: 11, name: "Reutter", pos: "Annahme" },
        { number: 6, name: "Frenz", pos: "Mitte" },
        { number: 18, name: "Pieper", pos: "Diagonal" },
        { number: 3, name: "Köster", pos: "Mitte" },
        { number: 22, name: "Schulenburg", pos: "Zuspiel" },
        { number: 7, name: "Herbort", pos: "Libero" }
      ];

      updateUI({ team1: hTeam, team2: gTeam, p1: 0, p2: 0, s1: 0, s2: 0 });

      showTeamLineup("Satz 1 – Startaufstellung", matchSub, hTeam, lineUp1, null, false);

      setTimeout(() => { hideVnlLineup(); }, 4000);

      setTimeout(() => {
        showTeamLineup("Satz 1 – Startaufstellung", matchSub, gTeam, lineUp2, null, true);
      }, 5000);

      setTimeout(() => { hideVnlLineup(); }, 9000);

      setTimeout(() => {
        updateUI({ team1: hTeam, team2: gTeam, p1: 8, p2: 6, s1: 0, s2: 0 });
      }, 11000);

      setTimeout(() => {
        showSubPopup([
          { team: hTeam, outNum: 1, outName: "Lüttel", inNum: 10, inName: "Dunkel" },
          { team: gTeam, outNum: 18, outName: "Pieper", inNum: 9, inName: "Müller" }
        ], false);
      }, 14000);

      setTimeout(() => {
        updateUI({ team1: hTeam, team2: gTeam, p1: 25, p2: 20, s1: 1, s2: 0 });
      }, 18000);

      setTimeout(() => {
        showTeamLineup("Satz 2 – Startaufstellung", matchSub, hTeam, lineUp1, null, false);
      }, 21000);
    }
  </script>
</body>
</html>

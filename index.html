<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SAMS Match Finder</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0b0f19;
      color: #f8fafc;
      font-family: 'Helvetica Neue', Arial, sans-serif;
      padding: 16px;
    }
    .container {
      max-width: 800px;
      margin: 0 auto;
    }
    
    /* Fixierter Header / Suchbereich (bleibt immer oben) */
    .sticky-header {
      position: sticky;
      top: 0;
      background: #0b0f19;
      padding-top: 4px;
      padding-bottom: 12px;
      z-index: 100;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      margin-bottom: 16px;
    }

    h1 {
      font-size: 22px;
      margin-bottom: 4px;
      color: #00f2fe;
    }
    p {
      color: #94a3b8;
      margin-bottom: 12px;
      font-size: 13px;
    }
    .search-box {
      width: 100%;
      padding: 12px;
      background: #1e293b;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 6px;
      color: white;
      font-size: 16px;
      outline: none;
    }
    .search-box:focus {
      border-color: #00f2fe;
    }
    
    .match-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .match-card {
      background: linear-gradient(135deg, #030712 0%, #0f172a 100%);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-left: 4px solid #00f2fe;
      border-radius: 6px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
      transition: opacity 0.2s ease;
    }
    
    /* Vergangene Spiele leicht ausgrauen */
    .match-card.past-match {
      opacity: 0.45;
      border-left-color: #64748b;
    }
    .match-card.past-match:hover {
      opacity: 0.8;
    }

    .match-header {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: #38bdf8;
      font-weight: 700;
      text-transform: uppercase;
      gap: 8px;
    }
    .match-teams {
      font-size: 16px;
      font-weight: 900;
      letter-spacing: 0.5px;
      word-break: break-word;
    }
    .match-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 4px;
      padding-top: 8px;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      gap: 8px;
    }
    .match-id {
      font-family: monospace;
      font-size: 10px;
      color: #64748b;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .btn-group {
      display: flex;
      gap: 6px;
      flex-shrink: 0;
    }
    .action-btn {
      border: none;
      padding: 6px 12px;
      font-weight: 900;
      font-size: 11px;
      border-radius: 4px;
      cursor: pointer;
      text-transform: uppercase;
      transition: all 0.2s ease;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .copy-btn {
      background: #00f2fe;
      color: #030712;
    }
    .copy-btn:hover { background: #38bdf8; }
    .copy-btn.copied { background: #4ade80; color: #030712; }

    .open-btn {
      background: #334155;
      color: #f8fafc;
    }
    .open-btn:hover { background: #475569; }

    .loading {
      text-align: center;
      color: #94a3b8;
      margin-top: 40px;
      font-size: 15px;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Sticky Header (bleibt beim Scrollen oben fixiert) -->
    <div class="sticky-header">
      <h1>SAMS Match Finder</h1>
      <p>Finde alle Liga-Spiele und kopiere dir mit einem Klick den OBS-Link.</p>
      <input type="text" id="search-input" class="search-box" placeholder="Nach Team oder Liga filtern...">
    </div>

    <div id="status" class="loading">Lade Spieldaten vom Worker...</div>
    <div id="match-list" class="match-list"></div>
  </div>

  <script>
    const WORKER_URL = "https://rapid-bread-25a8.nick-valbert2006.workers.dev";
    let allMatches = [];

    document.addEventListener('DOMContentLoaded', () => {
      loadMatches();
      document.getElementById('search-input').addEventListener('input', renderMatches);
    });

    async function loadMatches() {
      const statusEl = document.getElementById('status');
      try {
        const response = await fetch(`${WORKER_URL}/?assoc=wvv`);
        if (!response.ok) throw new Error("Fehler beim Abrufen der Daten vom Worker");

        const data = await response.json();
        allMatches = [];

        if (Array.isArray(data.matchDays)) {
          data.matchDays.forEach(day => {
            if (Array.isArray(day.matches)) {
              day.matches.forEach(m => {
                const team1 = m.team1?.name || m.team1Name || m.teamDescription1 || '';
                const team2 = m.team2?.name || m.team2Name || m.teamDescription2 || '';
                const matchId = m.id || m.matchId || m.uuid || m.matchUuid || '';
                const rawDate = m.date || m.startDate || day.date || null;

                if (matchId && (team1 || team2)) {
                  allMatches.push({
                    id: matchId,
                    team1: team1 || 'Unbekannt',
                    team2: team2 || 'Unbekannt',
                    dateObj: rawDate ? new Date(rawDate) : new Date(0),
                    formattedDate: formatDate(rawDate),
                    league: m.leagueName || m.competitionName || 'WVV Liga'
                  });
                }
              });
            }
          });
        }

        // Nach Datum sortieren (chronologisch aufsteigend)
        allMatches.sort((a, b) => a.dateObj - b.dateObj);

        statusEl.style.display = 'none';
        renderMatches();

        // Automatischer Sprung zum heutigen Tag / nächsten Spiel nach dem Laden
        scrollToToday();

      } catch (err) {
        statusEl.innerText = "Fehler beim Laden: " + err.message;
      }
    }

    // Wandelt ISO-Daten / Timestamps sauber in deutsches Format um
    function formatDate(dateInput) {
      if (!dateInput) return 'Datum unbekannt';
      try {
        const d = new Date(dateInput);
        if (isNaN(d.getTime())) return dateInput;
        return d.toLocaleDateString('de-DE', {
          weekday: 'short',
          day: '2-digit',
          month: '2-digit',
          year: 'numeric',
          hour: '2-digit',
          minute: '2-digit'
        }) + ' Uhr';
      } catch {
        return dateInput;
      }
    }

    function renderMatches() {
      const query = document.getElementById('search-input').value.toLowerCase();
      const listEl = document.getElementById('match-list');

      const filtered = allMatches.filter(m => 
        m.team1.toLowerCase().includes(query) || 
        m.team2.toLowerCase().includes(query) ||
        m.league.toLowerCase().includes(query)
      );

      if (filtered.length === 0) {
        listEl.innerHTML = '<div class="loading">Keine Spiele gefunden.</div>';
        return;
      }

      const scoreboardBaseUrl = "https://kitgaia.github.io/VBTicker/scoreboardV1.html";
      const now = new Date();
      // Setzt die Uhrzeit von 'heute' auf 00:00 Uhr für den Vergleich
      const todayStart = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();

      listEl.innerHTML = filtered.map(m => {
        const fullLink = `${scoreboardBaseUrl}?match=${m.id}&assoc=wvv`;
        
        // Prüfen, ob das Spiel in der Vergangenheit liegt (vor heute)
        const matchDayTime = new Date(m.dateObj.getFullYear(), m.dateObj.getMonth(), m.dateObj.getDate()).getTime();
        const isPast = matchDayTime < todayStart;

        return `
          <div class="match-card ${isPast ? 'past-match' : ''}" data-time="${m.dateObj.getTime()}">
            <div class="match-header">
              <span>📅 ${m.formattedDate}</span>
              <span>${m.league}</span>
            </div>
            <div class="match-teams">${m.team1} vs. ${m.team2}</div>
            <div class="match-footer">
              <span class="match-id" title="${m.id}">ID: ${m.id}</span>
              <div class="btn-group">
                <a href="${fullLink}" target="_blank" class="action-btn open-btn">Öffnen</a>
                <button class="action-btn copy-btn" onclick="copyToClipboard('${fullLink}', this)">Kopieren</button>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    // Scrollt beim Start automatisch zum heutigen Tag / nächsten anstehenden Spiel
    function scrollToToday() {
      const nowTime = new Date().getTime();
      const cards = document.querySelectorAll('.match-card');
      let targetCard = null;

      for (let card of cards) {
        const cardTime = parseInt(card.getAttribute('data-time'));
        if (cardTime >= nowTime) {
          targetCard = card;
          break;
        }
      }

      if (targetCard) {
        targetCard.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }
    }

    function copyToClipboard(text, btnElement) {
      navigator.clipboard.writeText(text).then(() => {
        const originalText = btnElement.innerText;
        btnElement.innerText = "Kopiert!";
        btnElement.classList.add('copied');
        setTimeout(() => {
          btnElement.innerText = originalText;
          btnElement.classList.remove('copied');
        }, 2000);
      }).catch(err => {
        alert('Fehler beim Kopieren: ' + err);
      });
    }
  </script>
</body>
</html>

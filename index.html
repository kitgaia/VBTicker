<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Volleyball Scoreboard Overlay - VNL Style</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: transparent;
      font-family: 'Helvetica Neue', Arial, sans-serif;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: flex-start;
    }

    /* Standard Klein-Scoreboard (Unten/Links oder Standardposition) */
    .scoreboard {
      position: absolute;
      bottom: 40px;
      left: 40px;
      display: inline-flex;
      align-items: center;
      background: linear-gradient(135deg, #0b0f19 0%, #1e293b 100%);
      border-radius: 8px;
      padding: 12px 24px;
      color: #ffffff;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
      border-bottom: 4px solid #3b82f6;
      font-weight: 700;
      gap: 20px;
      transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 10;
    }

    .team { display: flex; align-items: center; gap: 14px; }
    .team-name {
      font-size: 22px;
      letter-spacing: 1px;
      text-transform: uppercase;
      max-width: 200px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .points {
      background: #ffffff;
      color: #0f172a;
      font-size: 32px;
      font-weight: 900;
      padding: 4px 16px;
      border-radius: 6px;
      min-width: 60px;
      text-align: center;
    }
    .guest .points { background: #f59e0b; color: #ffffff; }

    .sets-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 0 12px;
      border-left: 2px solid rgba(255,255,255,0.1);
      border-right: 2px solid rgba(255,255,255,0.1);
    }
    .sets-score { font-size: 24px; color: #f8fafc; letter-spacing: 3px; font-weight: 900; }
    .sets-label { font-size: 10px; color: #94a3b8; text-transform: uppercase; letter-spacing: 2px; }

    /* Timeout Indicator */
    .timeout-badge {
      display: none;
      background: #ef4444;
      color: #ffffff;
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 4px;
      font-weight: 900;
      animation: pulse 1s infinite;
    }
    .timeout-active { display: inline-block; }

    @keyframes pulse {
      0% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(0.95); }
      100% { opacity: 1; transform: scale(1); }
    }

    /* VNL FULLSCREEN AUFSTELLUNGS- UND EVENT-OVERLAY (1080x1920 angelehnt) */
    .vnl-fullscreen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(5, 8, 22, 0.95);
      backdrop-filter: blur(10px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: white;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.5s ease-in-out, transform 0.5s cubic-bezier(0.16, 1, 0.3, 1);
      transform: scale(0.95);
      z-index: 100;
    }

    .vnl-active {
      opacity: 1;
      pointer-events: auto;
      transform: scale(1);
    }

    .vnl-header {
      font-size: 14px;
      letter-spacing: 4px;
      color: #38bdf8;
      text-transform: uppercase;
      margin-bottom: 10px;
      font-weight: 800;
    }

    .vnl-title {
      font-size: 42px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 40px;
      text-align: center;
      background: linear-gradient(90deg, #38bdf8, #818cf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .vnl-teams-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 60px;
      width: 80%;
      max-width: 1400px;
    }

    .vnl-team-box {
      background: rgba(30, 41, 59, 0.7);
      border: 1px solid rgba(56, 189, 248, 0.3);
      border-radius: 16px;
      padding: 30px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
    }

    .vnl-team-title {
      font-size: 26px;
      font-weight: 800;
      margin-bottom: 20px;
      border-bottom: 2px solid #38bdf8;
      padding-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .vnl-player-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .vnl-player-item {
      display: flex;
      justify-content: space-between;
      background: rgba(15, 23, 42, 0.6);
      padding: 12px 18px;
      border-radius: 8px;
      font-size: 18px;
      font-weight: 600;
      border-left: 4px solid #38bdf8;
    }

    .vnl-player-pos {
      color: #94a3b8;
      font-size: 14px;
      text-transform: uppercase;
    }

    .vnl-sub-info {
      margin-top: 30px;
      font-size: 20px;
      color: #facc15;
      font-weight: 700;
      text-align: center;
      background: rgba(250, 204, 21, 0.1);
      padding: 10px;
      border-radius: 8px;
      border: 1px dashed #facc15;
    }
  </style>
</head>
<body>

  <!-- Standard Scoreboard (Unten Links) -->
  <div class="scoreboard" id="main-scoreboard">
    <div class="team home">
      <span id="team1-to" class="timeout-badge">TO</span>
      <span id="team1-name" class="team-name">HEIM</span>
      <span id="team1-points" class="points">0</span>
    </div>

    <div class="sets-container">
      <span class="sets-label">SÄTZE</span>
      <span id="sets-score" class="sets-score">0 : 0</span>
    </div>

    <div class="team guest">
      <span id="team2-points" class="points">0</span>
      <span id="team2-name" class="team-name">GAST</span>
      <span id="team2-to" class="timeout-badge">TO</span>
    </div>
  </div>

  <!-- VNL Fullscreen Layout für Aufstellungen / Events -->
  <div id="vnl-overlay" class="vnl-fullscreen">
    <div class="vnl-header">Offizielle Aufstellung / Spiel-Event</div>
    <div id="vnl-main-title" class="vnl-title">Satz 1 – Startaufstellung</div>
    
    <div class="vnl-teams-grid">
      <!-- Team 1 -->
      <div class="vnl-team-box">
        <div class="vnl-team-title" id="vnl-t1-name">Heimteam</div>
        <ul class="vnl-player-list" id="vnl-t1-players">
          <!-- Dynamisch gefüllt -->
        </ul>
      </div>

      <!-- Team 2 -->
      <div class="vnl-team-box">
        <div class="vnl-team-title" id="vnl-t2-name">Gastteam</div>
        <ul class="vnl-player-list" id="vnl-t2-players">
          <!-- Dynamisch gefüllt -->
        </ul>
      </div>
    </div>

    <div id="vnl-sub-container" class="vnl-sub-info" style="display: none;">
      Spielerwechsel: <span id="vnl-sub-text"></span>
    </div>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    let matchId = urlParams.get('match') || 'a27bea5a-1330-4f40-b567-64c138dbd7ba';

    if (matchId === 'test') {
      runTestSimulation();
    } else {
      fetchScore();
      setInterval(fetchScore, 1500);
    }

    async function fetchScore() {
      try {
        const myWorker = "https://withered-sea-3b06.nick-valbert2006.workers.dev"; 
        const response = await fetch(`${myWorker}/?match=${matchId}`);
        if (!response.ok) return;

        const data = await response.json();
        const matchInfo = data.match || {};
        const stateInfo = data.state || {};

        let currentSetScore = { team1: 0, team2: 0 };
        if (stateInfo.matchSets && stateInfo.matchSets.length > 0) {
          const latestSet = stateInfo.matchSets[stateInfo.matchSets.length - 1];
          if (latestSet && latestSet.setScore) currentSetScore = latestSet.setScore;
        }

        updateUI({
          team1: matchInfo.teamDescription1 || 'Heim',
          team2: matchInfo.teamDescription2 || 'Gast',
          p1: currentSetScore.team1 ?? 0,
          p2: currentSetScore.team2 ?? 0,
          s1: stateInfo.setPoints?.team1 ?? 0,
          s2: stateInfo.setPoints?.team2 ?? 0,
          isSetFinished: stateInfo.finished || false
        });
      } catch (err) {
        console.error('Ticker-Fehler:', err);
      }
    }

    function updateUI(d) {
      document.getElementById('team1-name').innerText = d.team1;
      document.getElementById('team2-name').innerText = d.team2;
      document.getElementById('team1-points').innerText = d.p1;
      document.getElementById('team2-points').innerText = d.p2;
      document.getElementById('sets-score').innerText = `${d.s1} : ${d.s2}`;
    }

    // VNL Fullscreen Ansicht steuern
    function showVnlOverlay(title, team1Name, team2Name, players1, players2, subText = null) {
      const overlay = document.getElementById('vnl-overlay');
      document.getElementById('vnl-main-title').innerText = title;
      document.getElementById('vnl-t1-name').innerText = team1Name;
      document.getElementById('vnl-t2-name').innerText = team2Name;

      // Spieler Team 1 rendern
      const t1List = document.getElementById('vnl-t1-players');
      t1List.innerHTML = players1.map(p => `<li class="vnl-player-item"><span>${p.number}. ${p.name}</span> <span class="vnl-player-pos">${p.pos}</span></li>`).join('');

      // Spieler Team 2 rendern
      const t2List = document.getElementById('vnl-t2-players');
      t2List.innerHTML = players2.map(p => `<li class="vnl-player-item"><span>${p.number}. ${p.name}</span> <span class="vnl-player-pos">${p.pos}</span></li>`).join('');

      // Wechsel-Hinweis falls vorhanden
      const subContainer = document.getElementById('vnl-sub-container');
      if (subText) {
        document.getElementById('vnl-sub-text').innerText = subText;
        subContainer.style.display = 'block';
      } else {
        subContainer.style.display = 'none';
      }

      overlay.classList.add('vnl-active');
    }

    function hideVnlOverlay() {
      document.getElementById('vnl-overlay').classList.remove('vnl-active');
    }

    // Testsimulation im VNL-Style (Aufruf via ?match=test)
    function runTestSimulation() {
      const hTeam = "SC Halle";
      const gTeam = "TV Hör

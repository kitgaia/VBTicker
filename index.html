<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Volleyball Scoreboard Overlay</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: transparent;
      font-family: 'Segoe UI', Roboto, -apple-system, sans-serif;
      overflow: hidden;
    }

    /* Haupt-Scoreboard */
    .scoreboard {
      position: relative;
      display: inline-flex;
      align-items: center;
      background: rgba(15, 23, 42, 0.92);
      border-radius: 12px;
      padding: 10px 18px;
      color: #ffffff;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.15);
      font-weight: 700;
      margin: 20px;
      gap: 16px;
      transition: all 0.3s ease;
    }

    .team { display: flex; align-items: center; gap: 12px; }
    .team-name {
      font-size: 18px;
      letter-spacing: 0.5px;
      max-width: 170px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .points {
      background: #2563eb;
      color: #ffffff;
      font-size: 26px;
      padding: 4px 14px;
      border-radius: 8px;
      min-width: 48px;
      text-align: center;
      box-shadow: inset 0 2px 4px rgba(0,0,0,0.2);
    }
    .guest .points { background: #d97706; }

    .sets-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 0 8px;
    }
    .sets-score { font-size: 22px; color: #f8fafc; letter-spacing: 2px; }
    .sets-label { font-size: 10px; color: #94a3b8; text-transform: uppercase; letter-spacing: 1.5px; }

    /* Timeout Indicator */
    .timeout-badge {
      display: none;
      background: #f59e0b;
      color: #0f172a;
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: 800;
      animation: pulse 1.2s infinite;
    }
    .timeout-active { display: inline-block; }

    @keyframes pulse {
      0% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.6; transform: scale(0.95); }
      100% { opacity: 1; transform: scale(1); }
    }

    /* Automatisches Satzende-Banner */
    .banner {
      display: none;
      position: absolute;
      top: 80px;
      left: 20px;
      background: #1e293b;
      border: 2px solid #3b82f6;
      border-radius: 10px;
      padding: 12px 20px;
      color: white;
      font-size: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.6);
      animation: slideDown 0.4s ease-out forwards;
    }
    .banner-show { display: block; }

    @keyframes slideDown {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <div class="scoreboard">
    <!-- Heimteam -->
    <div class="team home">
      <span id="team1-to" class="timeout-badge">TIMEOUT</span>
      <span id="team1-name" class="team-name">HEIM</span>
      <span id="team1-points" class="points">0</span>
    </div>

    <!-- Sätze -->
    <div class="sets-container">
      <span class="sets-label">SÄTZE</span>
      <span id="sets-score" class="sets-score">0 : 0</span>
    </div>

    <!-- Gastteam -->
    <div class="team guest">
      <span id="team2-points" class="points">0</span>
      <span id="team2-name" class="team-name">GAST</span>
      <span id="team2-to" class="timeout-badge">TIMEOUT</span>
    </div>
  </div>

  <!-- Satzende-Benachrichtigung -->
  <div id="set-banner" class="banner">
    <span id="banner-text">Satz beendet!</span>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    // Wenn keine ID übergeben wird, nutzt er standardmäßig Schwerte vs. Herten als Fallback
    const matchId = urlParams.get('match') || '8f4c7539-96c9-4404-805c-62d54f184275';

    // MOCK / TEST MODUS LOGIK
    if (matchId === 'test') {
      runTestSimulation();
    } else if (matchId) {
      fetchScore();
      setInterval(fetchScore, 1500);
    } else {
      document.getElementById('team1-name').innerText = 'LINK FEHLT';
      document.getElementById('team2-name').innerText = ' ?match=...';
    }

    // Abruf direkt über deinen Cloudflare Worker
    async function fetchScore() {
      try {
        const myWorker = "https://withered-sea-3b06.nick-valbert2006.workers.dev"; 
        const response = await fetch(`${myWorker}/?match=${matchId}`);
        
        if (!response.ok) return;

        const data = await response.json();
        console.log("LIVE-DATEN EMPFANGEN:", data); 
        
        if (data.error) {
          console.error("Worker-Fehler:", data.error);
          return;
        }

        const matchInfo = data.match || {};
        const stateInfo = data.state || {};

        // Aktuellen Satzstand aus dem matchSets-Array ermitteln
        let currentSetScore = { team1: 0, team2: 0 };
        if (stateInfo.matchSets && stateInfo.matchSets.length > 0) {
          const latestSet = stateInfo.matchSets[stateInfo.matchSets.length - 1];
          if (latestSet && latestSet.setScore) {
            currentSetScore = latestSet.setScore;
          }
        }

        updateUI({
          team1: matchInfo.teamDescription1 || 'Team 1',
          team2: matchInfo.teamDescription2 || 'Team 2',
          p1: currentSetScore.team1 ?? 0,
          p2: currentSetScore.team2 ?? 0,
          s1: stateInfo.setPoints?.team1 ?? 0,
          s2: stateInfo.setPoints?.team2 ?? 0,
          to1: false, 
          to2: false,
          isSetFinished: stateInfo.finished || false
        });
      } catch (err) {
        console.error('Ticker-Fehler:', err);
      }
    }

    function updateUI(d) {
      document.getElementById('team1-name').innerText = d.team1;
      document.getElementById('team2-name').innerText = d.team2;
      document.getElementById('team1-points').innerText = d.p1;
      document.getElementById('team2-points').innerText = d.p2;
      document.getElementById('sets-score').innerText = `${d.s1} : ${d.s2}`;

      // Timeouts
      document.getElementById('team1-to').className = 'timeout-badge' + (d.to1 ? ' timeout-active' : '');
      document.getElementById('team2-to').className = 'timeout-badge' + (d.to2 ? ' timeout-active' : '');

      // Satzende Banner
      const banner = document.getElementById('set-banner');

<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Volleyball Scoreboard Overlay - VNL Edition</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: transparent;
      font-family: 'Helvetica Neue', Arial, sans-serif;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
    }

    /* Container für Scoreboard + Sub-Popups oben links */
    .scoreboard-wrapper {
      position: absolute;
      top: 30px;
      left: 30px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      z-index: 10;
    }

    /* VNL Haupt-Scoreboard (Eckiges, aggressives Tech-Design) */
    .scoreboard {
      display: inline-flex;
      align-items: center;
      background: linear-gradient(135deg, #030712 0%, #0f172a 100%);
      border-radius: 4px;
      padding: 10px 22px;
      color: #ffffff;
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.8);
      border-left: 6px solid #00f2fe;
      border-right: 1px solid rgba(0, 242, 254, 0.2);
      border-top: 1px solid rgba(0, 242, 254, 0.2);
      border-bottom: 2px solid #00f2fe;
      font-weight: 800;
      gap: 18px;
    }

    .team { display: flex; align-items: center; gap: 14px; }
    
    /* Team Logos */
    .team-logo {
      width: 32px;
      height: 32px;
      object-fit: contain;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
    }

    .team-name {
      font-size: 21px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      max-width: 170px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-weight: 900;
    }

    .points {
      background: #00f2fe;
      color: #030712;
      font-size: 30px;
      font-weight: 900;
      padding: 2px 14px;
      border-radius: 2px;
      min-width: 55px;
      text-align: center;
      box-shadow: inset 0 2px 4px rgba(0,0,0,0.2);
    }
    .guest .points { background: #f59e0b; color: #030712; }

    .sets-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 0 12px;
      border-left: 2px solid rgba(255,255,255,0.1);
      border-right: 2px solid rgba(255,255,255,0.1);
    }
    .sets-score { font-size: 22px; color: #f8fafc; letter-spacing: 3px; font-weight: 900; }
    .sets-label { font-size: 8px; color: #38bdf8; text-transform: uppercase; letter-spacing: 2px; font-weight: 900; }

    /* Timeout / Auszeit Badge im VNL Style */
    .timeout-badge {
      display: none;
      background: #ef4444;
      color: #ffffff;
      font-size: 9px;
      padding: 2px 6px;
      border-radius: 2px;
      font-weight: 900;
      letter-spacing: 1px;
      animation: pulse 1s infinite;
    }
    .timeout-active { display: inline-block; }

    @keyframes pulse {
      0% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(0.95); }
      100% { opacity: 1; transform: scale(1); }
    }

    /* Auswechslungs-Popups unter dem Scoreboard */
    .sub-container {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .sub-popup {
      background: rgba(3, 7, 18, 0.95);
      border-left: 4px solid #00f2fe;
      border-top: 1px solid rgba(0, 242, 254, 0.3);
      border-right: 1px solid rgba(0, 242, 254, 0.3);
      border-bottom: 1px solid rgba(0, 242, 254, 0.3);
      padding: 8px 14px;
      border-radius: 4px;
      color: #ffffff;
      font-size: 13px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.7);
      display: flex;
      align-items: center;
      gap: 12px;
      opacity: 0;
      transform: translateY(-10px);
      transition: all 0.3s ease;
      max-width: 400px;
    }
    .sub-popup.show {
      opacity: 1;
      transform: translateY(0);
    }
    .sub-tag {
      background: #00f2fe;
      color: #030712;
      font-size: 9px;
      font-weight: 900;
      padding: 2px 6px;
      border-radius: 2px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .sub-in { color: #4ade80; font-weight: 800; }
    .sub-out { color: #f87171; font-weight: 800; }
    .sub-icon { font-weight: bold; color: #fbbf24; }

    /* VNL FULLSCREEN SPIELFELD-OVERLAY */
    .vnl-fullscreen {
      position: fixed;
      top: 3%;
      left: 3%;
      width: 94vw;
      height: 94vh;
      background: radial-gradient(circle at center, #0f172a 0%, #030712 100%);
      border: 2px solid #00f2fe;
      backdrop-filter: blur(16px);
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 30px 40px;
      color: white;
      opacity: 0;
      pointer-events: none;
      transform: scale(0.96);
      transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 100;
      box-shadow: 0 30px 80px rgba(0,0,0,0.9);
    }
    .vnl-active {
      opacity: 1;
      pointer-events: auto;
      transform: scale(1);
    }

    .vnl-top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid rgba(0, 242, 254, 0.3);
      padding-bottom: 15px;
    }
    .vnl-event-title {
      font-size: 26px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 3px;
      color: #ffffff;
      text-shadow: 0 0 15px rgba(0, 242, 254, 0.6);
    }
    .vnl-match-subtitle {
      font-size: 14px;
      color: #38bdf8;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      font-weight: 800;
    }

    /* Das Volleyball-Spielfeld Layout (VNL Match Court Style) */
    .vnl-court-single {
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      background: linear-gradient(180deg, rgba(15, 23, 42, 0.6) 0%, rgba(3, 7, 18, 0.8) 100%);
      border: 2px solid rgba(0, 242, 254, 0.2);
      border-radius: 8px;
      margin: 20px 0;
      padding: 40px;
      position: relative;
    }

    .vnl-court-header {
      font-size: 24px;
      font-weight: 900;
      text-transform: uppercase;
      color: #00f2fe;
      margin-bottom: 30px;
      text-align: center;
      letter-spacing: 2px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 15px;
    }

    .vnl-grid-6 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      max-width: 1050px;
      margin: 0 auto;
      width: 100%;
    }

    .vnl-player-card {
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid rgba(0, 242, 254, 0.4);
      border-radius: 6px;
      display: flex;
      align-items: center;
      padding: 18px 22px;
      gap: 18px;
      position: relative;
      box-shadow: 0 10px 20px rgba(0,0,0,0.5);
    }

    .vnl-p-number {
      font-size: 30px;
      font-weight: 900;
      color: #030712;
      background: #00f2fe;
      min-width: 50px;
      height: 50px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 4px;
    }

    .vnl-p-info {
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .vnl-p-name {
      font-size: 17px;
      font-weight: 800;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      letter-spacing: 0.5px;
    }

    .vnl-p-pos {
      font-size: 11px;
      color: #38bdf8;
      text-transform: uppercase;
      letter-spacing: 1px;
      font-weight: 700;
      margin-top: 3px;
    }

    .vnl-zone-label {
      position: absolute;
      top: 6px;
      right: 10px;
      font-size: 9px;
      color: rgba(255,255,255,0.4);
      font-weight: 900;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>

  <!-- Scoreboard & Sub-Popups oben links -->
  <div class="scoreboard-wrapper">
    <div id="sub-container" class="sub-container"></div>

    <div class="scoreboard" id="main-scoreboard">
      <div class="team home">
        <img id="team1-logo" class="team-logo" src="" style="display:none;" alt="">
        <span id="team1-to" class="timeout-badge">AUSZEIT</span>
        <span id="team1-name" class="team-name">HEIM</span>
        <span id="team1-points" class="points">0</span>
      </div>

      <div class="sets-container">
        <span class="sets-label">SÄTZE</span>
        <span id="sets-score" class="sets-score">0 : 0</span>
      </div>

      <div class="team guest">
        <span id="team2-points" class="points">0</span>
        <span id="team2-name" class="team-name">GAST</span>
        <img id="team2-logo" class="team-logo" src="" style="display:none;" alt="">
        <span id="team2-to" class="timeout-badge">AUSZEIT</span>
      </div>
    </div>
  </div>

  <!-- VNL Fullscreen Spielfeld-Overlay (Einzelnes Team nacheinander) -->
  <div id="vnl-overlay" class="vnl-fullscreen">
    <div class="vnl-top-bar">
      <div id="vnl-title" class="vnl-event-title">Satz 1 – Startaufstellung</div>
      <div id="vnl-subtitle" class="vnl-match-subtitle">SC Halle vs. TV Hörde</div>
    </div>

    <div class="vnl-court-single">
      <div class="vnl-court-header">
        <img id="vnl-team-logo" class="team-logo" style="width:40px; height:40px; display:none;" alt="">
        <span id="vnl-single-team-name">SC Halle</span>
      </div>
      <div class="vnl-grid-6" id="vnl-single-grid"></div>
    </div>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    let matchId = urlParams.get('match') || 'a27bea5a-1330-4f40-b567-64c138dbd7ba';

    if (matchId === 'test') {
      runTestSimulation();
    } else {
      fetchScore();
      setInterval(fetchScore, 1500);
    }

    async function fetchScore() {
      try {
        const myWorker = "https://withered-sea-3b06.nick-valbert2006.workers.dev"; 
        const response = await fetch(`${myWorker}/?match=${matchId}`);
        if (!response.ok) return;

        const data = await response.json();
        const matchInfo = data.match || {};
        const stateInfo = data.state || {};

        let currentSetScore = { team1: 0, team2: 0 };
        if (stateInfo.matchSets && stateInfo.matchSets.length > 0) {
          const latestSet = stateInfo.matchSets[stateInfo.matchSets.length - 1];
          if (latestSet && latestSet.setScore) currentSetScore = latestSet.setScore;
        }

        updateUI({
          team1: matchInfo.teamDescription1 || 'Heim',
          team2: matchInfo.teamDescription2 || 'Gast',
          logo1: matchInfo.teamLogo1 || matchInfo.logo1 || null,
          logo2: matchInfo.teamLogo2 || matchInfo.logo2 || null,
          p1: currentSetScore.team1 ?? 0,
          p2: currentSetScore.team2 ?? 0,
          s1: stateInfo.setPoints?.team1 ?? 0,
          s2: stateInfo.setPoints?.team2 ?? 0
        });
      } catch (err) {
        console.error('Ticker-Fehler:', err);
      }
    }

    function updateUI(d) {
      document.getElementById('team1-name').innerText = d.team1;
      document.getElementById('team2-name').innerText = d.team2;
      document.getElementById('team1-points').innerText = d.p1;
      document.getElementById('team2-points').innerText = d.p2;
      document.getElementById('sets-score').innerText = `${d.s1} : ${d.s2}`;

      // Logos dynamisch einbinden, falls die API URLs liefert
      const logo1El = document.getElementById('team1-logo');
      if (d.logo1) {
        logo1El.src = d.logo1;
        logo1El.style.display = 'block';
      }

      const logo2El = document.getElementById('team2-logo');
      if (d.logo2) {
        logo2El.src = d.logo2;
        logo2El.style.display = 'block';
      }
    }

    // Zeigt die Startaufstellung für ein einzelnes Team im VNL-Fullscreen
    function showTeamLineup(title, matchSub, teamName, players, logoUrl = null) {
      document.getElementById('vnl-title').innerText = title;
      document.getElementById('vnl-subtitle').innerText = matchSub;
      document.getElementById('vnl-single-team-name').innerText = teamName;

      const logoEl = document.getElementById('vnl-team-logo');
      if (logoUrl) {
        logoEl.src = logoUrl;
        logoEl.style.display = 'block';
      } else {
        logoEl.style.display = 'none';
      }

      const zones = ["Zone 4", "Zone 3", "Zone 2", "Zone 5", "Zone 6", "Zone 1"];

      document.getElementById('vnl-single-grid').innerHTML = players.map((p, idx) => `
        <div class="vnl-player-card">
          <span class="vnl-zone-label">${zones[idx]}</span>
          <div class="vnl-p-number">${p.number}</div>
          <div class="vnl-p-info">
            <div class="vnl-p-name">${p.name}</div>
            <div class="vnl-p-pos">${p.pos}</div>
          </div>
        </div>
      `).join('');

      document.getElementById('vnl-overlay').classList.add('vnl-active');
    }

    function hideVnlLineup() {
      document.getElementById('vnl-overlay').classList.remove('vnl-active');
    }

    // Mehrere Wechsel können gleichzeitig als Pop-ups untereinander erscheinen
    function showSubPopup(substitutions) {
      const subs = Array.isArray(substitutions) ? substitutions : [substitutions];
      const container = document.getElementById('sub-container');

      subs.forEach(sub => {
        const popup = document.createElement('div');
        popup.className = 'sub-popup';
        popup.innerHTML = `
          <span class="sub-tag">WECHSEL</span>
          <span>
            <span class="sub-out">RAUS #${sub.outNum} ${sub.outName}</span> 
            <span class="sub-icon"> ⇄ </span> 
            <span class="sub-in">REIN #${sub.inNum} ${sub.inName}</span>
          </span>
          <span style="font-size: 11px; color: #38bdf8; margin-left: auto; font-weight: 700;">(${sub.team})</span>
        `;
        
        container.appendChild(popup);
        setTimeout(() => popup.classList.add('show'), 50);

        setTimeout(() => {
          popup.classList.remove('show');
          setTimeout(() => popup.remove(), 300);
        }, 5000);
      });
    }

    // Testsimulation für den Test-Modus (?match=test)
    function runTestSimulation() {
      const hTeam = "SC Halle";
      const gTeam = "TV Hörde";
      const matchSub = `${hTeam} vs. ${gTeam}`;

      const lineUp1 = [
        { number: 4, name: "Filiniuk", pos: "Annahme" },
        { number: 6, name: "Fomin", pos: "Mitte" },
        { number: 2, name: "Maistrak", pos: "Diagonal" },
        { number: 8, name: "Wasiljew", pos: "Annahme" },
        { number: 7, name: "Voth", pos: "Zuspiel" },
        { number: 3, name: "Pohl", pos: "Libero" }
      ];

      const lineUp2 = [
        { number: 11, name: "Reutter", pos: "Annahme" },
        { number: 6, name: "Frenz", pos: "Mitte" },
        { number: 18, name: "Pieper", pos: "Diagonal" },
        { number: 3, name: "Köster", pos: "Mitte" },
        { number: 22, name: "Schulenburg", pos: "Zuspiel" },
        { number: 7, name: "Herbort", pos: "Libero" }
      ];

      updateUI({ team1: hTeam, team2: gTeam, p1: 0, p2: 0, s1: 0, s2: 0 });

      // 1. Startaufstellung Team 1 (Heim) anzeigen
      showTeamLineup("Satz 1 – Startaufstellung", matchSub, hTeam, lineUp1);

      // Nach 4 Sekunden zu Team 2 (Gast) wechseln
      setTimeout(() => {
        showTeamLineup("Satz 1 – Startaufstellung", matchSub, gTeam, lineUp2);
      }, 4000);

      // Nach weiteren 4 Sekunden Vollbild schließen
      setTimeout(() => {
        hideVnlLineup();
      }, 8000);

      // Punkte laufen lassen
      setTimeout(() => {
        updateUI({ team1: hTeam, team2: gTeam, p1: 8, p2: 6, s1: 0, s2: 0 });
      }, 10000);

      // Doppelwechsel aus BEIDEN Teams gleichzeitig untereinander
      setTimeout(() => {
        showSubPopup([
          { team: "SC Halle", outNum: 7, outName: "Voth", inNum: 10, inName: "Havryliuk" },
          { team: "TV Hörde", outNum: 18, outName: "Pieper", inNum: 9, inName: "Müller" }
        ]);
      }, 13000);

      setTimeout(() => {
        updateUI({ team1: hTeam, team2: gTeam, p1: 20, p2: 18, s1: 0, s2: 0 });
      }, 16000);
    }
  </script>
</body>
</html>

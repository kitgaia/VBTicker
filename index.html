<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Volleyball Scoreboard Overlay</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: transparent;
      font-family: 'Segoe UI', Roboto, -apple-system, sans-serif;
      overflow: hidden;
    }

    /* Haupt-Scoreboard */
    .scoreboard {
      position: relative;
      display: inline-flex;
      align-items: center;
      background: rgba(15, 23, 42, 0.92);
      border-radius: 12px;
      padding: 10px 18px;
      color: #ffffff;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.15);
      font-weight: 700;
      margin: 20px;
      gap: 16px;
      transition: all 0.3s ease;
    }

    .team { display: flex; align-items: center; gap: 12px; }
    .team-name {
      font-size: 18px;
      letter-spacing: 0.5px;
      max-width: 170px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .points {
      background: #2563eb;
      color: #ffffff;
      font-size: 26px;
      padding: 4px 14px;
      border-radius: 8px;
      min-width: 48px;
      text-align: center;
      box-shadow: inset 0 2px 4px rgba(0,0,0,0.2);
    }
    .guest .points { background: #d97706; }

    .sets-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 0 8px;
    }
    .sets-score { font-size: 22px; color: #f8fafc; letter-spacing: 2px; }
    .sets-label { font-size: 10px; color: #94a3b8; text-transform: uppercase; letter-spacing: 1.5px; }

    /* Timeout Indicator */
    .timeout-badge {
      display: none;
      background: #f59e0b;
      color: #0f172a;
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: 800;
      animation: pulse 1.2s infinite;
    }
    .timeout-active { display: inline-block; }

    @keyframes pulse {
      0% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.6; transform: scale(0.95); }
      100% { opacity: 1; transform: scale(1); }
    }

    /* Automatisches Event-/Satzende-Banner */
    .banner {
      display: none;
      position: absolute;
      top: 80px;
      left: 20px;
      background: #1e293b;
      border: 2px solid #3b82f6;
      border-radius: 10px;
      padding: 12px 20px;
      color: white;
      font-size: 15px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.6);
      animation: slideDown 0.4s ease-out forwards;
      max-width: 350px;
    }
    .banner-show { display: block; }

    @keyframes slideDown {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <div class="scoreboard">
    <!-- Heimteam -->
    <div class="team home">
      <span id="team1-to" class="timeout-badge">TIMEOUT</span>
      <span id="team1-name" class="team-name">HEIM</span>
      <span id="team1-points" class="points">0</span>
    </div>

    <!-- Sätze -->
    <div class="sets-container">
      <span class="sets-label">SÄTZE</span>
      <span id="sets-score" class="sets-score">0 : 0</span>
    </div>

    <!-- Gastteam -->
    <div class="team guest">
      <span id="team2-points" class="points">0</span>
      <span id="team2-name" class="team-name">GAST</span>
      <span id="team2-to" class="timeout-badge">TIMEOUT</span>
    </div>
  </div>

  <!-- Event- & Satzende-Benachrichtigung -->
  <div id="set-banner" class="banner">
    <span id="banner-text">Event</span>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    let matchId = urlParams.get('match') || 'a27bea5a-1330-4f40-b567-64c138dbd7ba';

    // KLARE TRENNUNG: Wenn match=test übergeben wird, starte sofort die Simulation und brich ab
    if (matchId === 'test') {
      runTestSimulation();
    } else {
      fetchScore();
      setInterval(fetchScore, 1500);
    }

    async function fetchScore() {
      try {
        const myWorker = "https://withered-sea-3b06.nick-valbert2006.workers.dev"; 
        const response = await fetch(`${myWorker}/?match=${matchId}`);
        
        if (!response.ok) return;

        const data = await response.json();
        const matchInfo = data.match || {};
        const stateInfo = data.state || {};

        let currentSetScore = { team1: 0, team2: 0 };
        if (stateInfo.matchSets && stateInfo.matchSets.length > 0) {
          const latestSet = stateInfo.matchSets[stateInfo.matchSets.length - 1];
          if (latestSet && latestSet.setScore) {
            currentSetScore = latestSet.setScore;
          }
        }

        let latestEventText = "";
        if (stateInfo.eventHistory && stateInfo.eventHistory.length > 0) {
          const ev = stateInfo.eventHistory[stateInfo.eventHistory.length - 1];
          if (ev.type === "START_SET") {
            latestEventText = `Satz ${ev.setNumber} gestartet (Startaufstellung aktiv)`;
          } else if (ev.type === "SUBSTITUTION") {
            latestEventText = `Auswechslung (${ev.teamCode === 'team1' ? 'Heim' : 'Gast'})`;
          }
        }

        updateUI({
          team1: matchInfo.teamDescription1 || 'Team 1',
          team2: matchInfo.teamDescription2 || 'Team 2',
          p1: currentSetScore.team1 ?? 0,
          p2: currentSetScore.team2 ?? 0,
          s1: stateInfo.setPoints?.team1 ?? 0,
          s2: stateInfo.setPoints?.team2 ?? 0,
          to1: false, 
          to2: false,
          isSetFinished: stateInfo.finished || false,
          eventMessage: latestEventText
        });
      } catch (err) {
        console.error('Ticker-Fehler:', err);
      }
    }

    function updateUI(d) {
      document.getElementById('team1-name').innerText = d.team1;
      document.getElementById('team2-name').innerText = d.team2;
      document.getElementById('team1-points').innerText = d.p1;
      document.getElementById('team2-points').innerText = d.p2;
      document.getElementById('sets-score').innerText = `${d.s1} : ${d.s2}`;

      const banner = document.getElementById('set-banner');
      const bannerText = document.getElementById('banner-text');

      if (d.isSetFinished) {
        bannerText.innerText = `Spiel beendet! Endstand Sätze: ${d.s1}:${d.s2}`;
        banner.classList.add('banner-show');
      } else if (d.eventMessage) {
        bannerText.innerText = d.eventMessage;
        banner.classList.add('banner-show');
      } else {
        banner.classList.remove('banner-show');
      }
    }

    // Testsimulation im Zeitraffer (Aufruf via ?match=test)
    function runTestSimulation() {
      const steps = [
        { team1: 'SC Halle', team2: 'TV Hörde', p1: 0, p2: 0, s1: 0, s2: 0, msg: 'Satz 1 gestartet – Startaufstellungen aktiv' },
        { team1: 'SC Halle', team2: 'TV Hörde', p1: 1, p2: 0, s1: 0, s2: 0, msg: 'Punkt für SC Halle (1:0)' },
        { team1: 'SC Halle', team2: 'TV Hörde', p1: 5, p2: 5, s1: 0, s2: 0, msg: 'Spielstand ausgeglichen 5:5' },
        { team1: 'SC Halle', team2: 'TV Hörde', p1: 8, p2: 6, s1: 0, s2: 0, msg: 'Spielerwechsel bei SC Halle (Ein-/Auswechslung)' },
        { team1: 'SC Halle', team2: 'TV Hörde', p1: 25, p2: 20, s1: 1, s2: 0, msg: 'Satz 1 beendet! Satzgewinn für SC Halle' },
        { team1: 'SC Halle', team2: 'TV Hörde', p1: 0, p2: 0, s1: 1, s2: 0, msg: 'Satz 2 gestartet – Neue Startaufstellungen' },
        { team1: 'SC Halle', team2: 'TV Hörde', p1: 20, p2: 25, s1: 1, s2: 1, msg: 'Satz 2 beendet! Satzgewinn für TV Hörde' },
        { team1: 'SC Halle', team2: 'TV Hörde', p1: 0, p2: 0, s1: 1, s2: 1, msg: 'Satz 3 gestartet' },
        { team1: 'SC Halle', team2: 'TV Hörde', p1: 21, p2: 25, s1: 1, s2: 3, isSetFinished: true, msg: 'Spiel beendet!' }
      ];

      let currentStep = 0;
      updateUI({ ...steps[0], to1: false, to2: false, isSetFinished: false, eventMessage: steps[0].msg });

      const interval = setInterval(() => {
        currentStep++;
        if (currentStep < steps.length) {
          updateUI({ 
            ...steps[currentStep], 
            to1: false, 
            to2: false, 
            isSetFinished: steps[currentStep].isSetFinished || false, 
            eventMessage: steps[currentStep].msg 
          });
        } else {
          clearInterval(interval);
        }
      }, 3000);
    }
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Volleyball Scoreboard Overlay - VNL Style</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: transparent;
      font-family: 'Helvetica Neue', Arial, sans-serif;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
    }

    /* Container für Scoreboard + Sub-Popups oben links */
    .scoreboard-wrapper {
      position: absolute;
      top: 30px;
      left: 30px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      z-index: 10;
    }

    /* Haupt-Scoreboard (Oben Links) */
    .scoreboard {
      display: inline-flex;
      align-items: center;
      background: linear-gradient(135deg, #070b19 0%, #111827 100%);
      border-radius: 8px;
      padding: 10px 20px;
      color: #ffffff;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
      border-top: 4px solid #00f2fe;
      font-weight: 700;
      gap: 16px;
    }

    .team { display: flex; align-items: center; gap: 12px; }
    .team-name {
      font-size: 20px;
      letter-spacing: 1px;
      text-transform: uppercase;
      max-width: 180px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .points {
      background: #ffffff;
      color: #070b19;
      font-size: 28px;
      font-weight: 900;
      padding: 2px 12px;
      border-radius: 6px;
      min-width: 50px;
      text-align: center;
    }
    .guest .points { background: #f59e0b; color: #ffffff; }

    .sets-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 0 10px;
      border-left: 2px solid rgba(255,255,255,0.1);
      border-right: 2px solid rgba(255,255,255,0.1);
    }
    .sets-score { font-size: 20px; color: #f8fafc; letter-spacing: 2px; font-weight: 900; }
    .sets-label { font-size: 9px; color: #94a3b8; text-transform: uppercase; letter-spacing: 1.5px; }

    /* Timeout Indicator */
    .timeout-badge {
      display: none;
      background: #ef4444;
      color: #ffffff;
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: 900;
    }
    .timeout-active { display: inline-block; }

    /* Container für Auswechslungs-Popups (untereinander stapelbar) */
    .sub-container {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .sub-popup {
      background: rgba(15, 23, 42, 0.95);
      border-left: 4px solid #38bdf8;
      padding: 10px 14px;
      border-radius: 6px;
      color: #ffffff;
      font-size: 13px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.5);
      display: flex;
      align-items: center;
      gap: 10px;
      opacity: 0;
      transform: translateY(-10px);
      transition: all 0.3s ease;
      max-width: 380px;
    }
    .sub-popup.show {
      opacity: 1;
      transform: translateY(0);
    }
    .sub-tag {
      background: #38bdf8;
      color: #000;
      font-size: 9px;
      font-weight: 900;
      padding: 2px 5px;
      border-radius: 3px;
      text-transform: uppercase;
    }
    .sub-in { color: #4ade80; font-weight: 700; }
    .sub-out { color: #f87171; font-weight: 700; }
    .sub-icon { font-weight: bold; color: #fbbf24; }

    /* VNL SPIELFELD-OVERLAY (Fast ganzer Bildschirm, Netzoen-orientiert) */
    .vnl-fullscreen {
      position: fixed;
      top: 3%;
      left: 3%;
      width: 94vw;
      height: 94vh;
      background: rgba(5, 9, 23, 0.96);
      border: 2px solid rgba(0, 242, 254, 0.4);
      backdrop-filter: blur(12px);
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 30px 40px;
      color: white;
      opacity: 0;
      pointer-events: none;
      transform: scale(0.96);
      transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 100;
      box-shadow: 0 25px 60px rgba(0,0,0,0.8);
    }
    .vnl-active {
      opacity: 1;
      pointer-events: auto;
      transform: scale(1);
    }

    .vnl-top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid rgba(255,255,255,0.1);
      padding-bottom: 15px;
    }
    .vnl-event-title {
      font-size: 24px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 2px;
      background: linear-gradient(90deg, #00f2fe, #4facfe);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .vnl-match-subtitle {
      font-size: 14px;
      color: #94a3b8;
      letter-spacing: 1px;
      text-transform: uppercase;
      font-weight: 700;
    }

    /* Das Volleyball-Spielfeld Layout (Netz oben, Grundlinie unten) */
    .vnl-court {
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      background: linear-gradient(180deg, rgba(30, 41, 59, 0.4) 0%, rgba(15, 23, 42, 0.7) 100%);
      border: 2px dashed rgba(255, 255, 255, 0.15);
      border-radius: 12px;
      margin: 20px 0;
      padding: 20px;
      position: relative;
    }

    /* Netz-Linie in der Mitte des Spielfelds */
    .vnl-net-line {
      position: absolute;
      top: 50%;
      left: 0;
      width: 100%;
      height: 4px;
      background: #f59e0b;
      box-shadow: 0 0 10px #f59e0b;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .vnl-net-label {
      background: #f59e0b;
      color: #000;
      font-size: 10px;
      font-weight: 900;
      padding: 2px 10px;
      border-radius: 4px;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    .vnl-team-court-half {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .vnl-court-header {
      font-size: 16px;
      font-weight: 800;
      text-transform: uppercase;
      color: #38bdf8;
      display: flex;
      justify-content: space-between;
    }

    /* 6er Aufstellungs-Raster (Zonen 4,3,2 vorne / 5,6,1 hinten) */
    .vnl-grid-6 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }

    .vnl-player-card {
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(0, 242, 254, 0.25);
      border-radius: 8px;
      display: flex;
      align-items: center;
      padding: 10px 14px;
      gap: 12px;
      position: relative;
    }

    .vnl-p-number {
      font-size: 22px;
      font-weight: 900;
      color: #00f2fe;
      min-width: 35px;
      text-align: center;
      background: rgba(0, 242, 254, 0.1);
      border-radius: 4px;
      padding: 2px;
    }

    .vnl-p-info {
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .vnl-p-name {
      font-size: 14px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .vnl-p-pos {
      font-size: 10px;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .vnl-zone-label {
      position: absolute;
      top: 4px;
      right: 8px;
      font-size: 8px;
      color: rgba(255,255,255,0.3);
      font-weight: bold;
    }
  </style>
</head>
<body>

  <!-- Scoreboard & Sub-Popups oben links -->
  <div class="scoreboard-wrapper">
    <!-- Container für dynamische Wechsel-Popups -->
    <div id="sub-container" class="sub-container"></div>

    <!-- Haupt-Scoreboard -->
    <div class="scoreboard" id="main-scoreboard">
      <div class="team home">
        <span id="team1-to" class="timeout-badge">TO</span>
        <span id="team1-name" class="team-name">HEIM</span>
        <span id="team1-points" class="points">0</span>
      </div>

      <div class="sets-container">
        <span class="sets-label">SÄTZE</span>
        <span id="sets-score" class="sets-score">0 : 0</span>
      </div>

      <div class="team guest">
        <span id="team2-points" class="points">0</span>
        <span id="team2-name" class="team-name">GAST</span>
        <span id="team2-to" class="timeout-badge">TO</span>
      </div>
    </div>
  </div>

  <!-- VNL Fullscreen Spielfeld-Overlay (Netz oben, Aufschlag unten) -->
  <div id="vnl-overlay" class="vnl-fullscreen">
    <div class="vnl-top-bar">
      <div id="vnl-title" class="vnl-event-title">Satz 1 – Startaufstellung</div>
      <div id="vnl-subtitle" class="vnl-match-subtitle">SC Halle vs. TV Hörde</div>
    </div>

    <div class="vnl-court">
      <!-- Team 1 Hälfte (Nähe Netz oder obere Hälfte) -->
      <div class="vnl-team-court-half">
        <div class="vnl-court-header">
          <span id="vnl-t1-name">SC Halle</span>
          <span style="font-size: 11px; color: #94a3b8;">Vorderreihe (Zonen 4, 3, 2) / Hinterreihe (5, 6, 1)</span>
        </div>
        <div class="vnl-grid-6" id="vnl-t1-grid"></div>
      </div>

      <!-- Netz-Linie in der Mitte -->
      <div class="vnl-net-line">
        <span class="vnl-net-label">NETZ</span>
      </div>

      <!-- Team 2 Hälfte -->
      <div class="vnl-team-court-half" style="margin-top: 10px;">
        <div class="vnl-court-header">
          <span id="vnl-t2-name">TV Hörde</span>
        </div>
        <div class="vnl-grid-6" id="vnl-t2-grid"></div>
      </div>
    </div>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    let matchId = urlParams.get('match') || 'a27bea5a-1330-4f40-b567-64c138dbd7ba';

    if (matchId === 'test') {
      runTestSimulation();
    } else {
      fetchScore();
      setInterval(fetchScore, 1500);
    }

    async function fetchScore() {
      try {
        const myWorker = "https://withered-sea-3b06.nick-valbert2006.workers.dev"; 
        const response = await fetch(`${myWorker}/?match=${matchId}`);
        if (!response.ok) return;

        const data = await response.json();
        const matchInfo = data.match || {};
        const stateInfo = data.state || {};

        let currentSetScore = { team1: 0, team2: 0 };
        if (stateInfo.matchSets && stateInfo.matchSets.length > 0) {
          const latestSet = stateInfo.matchSets[stateInfo.matchSets.length - 1];
          if (latestSet && latestSet.setScore) currentSetScore = latestSet.setScore;
        }

        updateUI({
          team1: matchInfo.teamDescription1 || 'Heim',
          team2: matchInfo.teamDescription2 || 'Gast',
          p1: currentSetScore.team1 ?? 0,
          p2: currentSetScore.team2 ?? 0,
          s1: stateInfo.setPoints?.team1 ?? 0,
          s2: stateInfo.setPoints?.team2 ?? 0
        });
      } catch (err) {
        console.error('Ticker-Fehler:', err);
      }
    }

    function updateUI(d) {
      document.getElementById('team1-name').innerText = d.team1;
      document.getElementById('team2-name').innerText = d.team2;
      document.getElementById('team1-points').innerText = d.p1;
      document.getElementById('team2-points').innerText = d.p2;
      document.getElementById('sets-score').innerText = `${d.s1} : ${d.s2}`;
    }

    // VNL Aufstellung auf dem Spielfeld anzeigen
    function showVnlLineup(title, team1Name, team2Name, players1, players2) {
      document.getElementById('vnl-title').innerText = title;
      document.getElementById('vnl-subtitle').innerText = `${team1Name} vs. ${team2Name}`;
      document.getElementById('vnl-t1-name').innerText = team1Name;
      document.getElementById('vnl-t2-name').innerText = team2Name;

      const zones = ["Zone 4", "Zone 3", "Zone 2", "Zone 5", "Zone 6", "Zone 1"];

      document.getElementById('vnl-t1-grid').innerHTML = players1.map((p, idx) => `
        <div class="vnl-player-card">
          <span class="vnl-zone-label">${zones[idx]}</span>
          <div class="vnl-p-number">${p.number}</div>
          <div class="vnl-p-info">
            <div class="vnl-p-name">${p.name}</div>
            <div class="vnl-p-pos">${p.pos}</div>
          </div>
        </div>
      `).join('');

      document.getElementById('vnl-t2-grid').innerHTML = players2.map((p, idx) => `
        <div class="vnl-player-card">
          <span class="vnl-zone-label">${zones[idx]}</span>
          <div class="vnl-p-number">${p.number}</div>
          <div class="vnl-p-info">
            <div class="vnl-p-name">${p.name}</div>
            <div class="vnl-p-pos">${p.pos}</div>
          </div>
        </div>
      `).join('');

      document.getElementById('vnl-overlay').classList.add('vnl-active');
    }

    function hideVnlLineup() {
      document.getElementById('vnl-overlay').classList.remove('vnl-active');
    }

    // Unterstützt auch mehrere Wechsel (Array von Objekten oder einzelnes Objekt)
    function showSubPopup(substitutions) {
      const container = document.getElementById('sub-container');
      
      // Falls nur ein einzelner Wechsel übergeben wird, in ein Array packen
      const subs = Array.isArray(substitutions) ? substitutions : [substitutions];

      subs.forEach(sub => {
        const popup = document.createElement('div');
        popup.className = 'sub-popup';
        popup.innerHTML = `
          <span class="sub-tag">${sub.team}</span>
          <span>
            <span class="sub-out">OUT #${sub.outNum} ${sub.outName}</span> 
            <span class="sub-icon"> ⇄ </span> 
            <span class="sub-in">IN #${sub.inNum} ${sub.inName}</span>
          </span>
        `;
        
        container.appendChild(popup);

        // Einblenden
        setTimeout(() => popup.classList.add('show'), 50);

        // Nach 5 Sekunden wieder entfernen
        setTimeout(() => {
          popup.classList.remove('show');
          setTimeout(() => popup.remove(), 300);
        }, 5000);
      });
    }

    // Testsimulation für den Test-Modus (?match=test)
    function runTestSimulation() {
      const hTeam = "SC Halle";
      const gTeam = "TV Hörde";

      const lineUp1 = [
        { number: 4, name: "Filiniuk", pos: "Annahme" },
        { number: 6, name: "Fomin", pos: "Mitte" },
        { number: 2, name: "Maistrak", pos: "Diagonal" },
        { number: 8, name: "Wasiljew", pos: "Annahme" },
        { number: 7, name: "Voth", pos: "Zuspiel" },
        { number: 3, name: "Pohl", pos: "Libero" }
      ];

      const lineUp2 = [
        { number: 11, name: "Reutter", pos: "Annahme" },
        { number: 6, name: "Frenz", pos: "Mitte" },
        { number: 18, name: "Pieper", pos: "Diagonal" },
        { number: 3, name: "Köster", pos: "Mitte" },
        { number: 22, name: "Schulenburg", pos: "Zuspiel" },
        { number: 7, name: "Herbort", pos: "Libero" }
      ];

      // 1. Startaufstellung Satz 1 (Spielfeld-Ansicht)
      updateUI({ team1: hTeam, team2: gTeam, p1: 0, p2: 0, s1: 0, s2: 0 });
      showVnlLineup("Satz 1 – Startaufstellung", hTeam, gTeam, lineUp1, lineUp2);

      setTimeout(() => hideVnlLineup(), 6000);

      // 2. Punkte laufen lassen
      setTimeout(() => {
        updateUI({ team1: hTeam, team2: gTeam, p1: 8, p2: 6, s1: 0, s2: 0 });
      }, 8000);

      // 3. Einzelner Wechsel bei SC Halle (Test unter Scoreboard)
      setTimeout(() => {
        showSubPopup({ team: "SC Halle", outNum: 7, outName: "Voth", inNum: 10, inName: "Havryliuk" });
      }, 11000);

      setTimeout(() => {
        updateUI({ team1: hTeam, team2: gTeam, p1: 18, p2: 15, s1: 0, s2: 0 });
      }, 14000);

      // 4. Doppelwechsel / Wechsel aus beiden Teams gleichzeitig!
      setTimeout(() => {
        showSubPopup([
          { team: "SC Halle", outNum: 2, outName: "Maistrak", inNum: 12, inName: "Schmidt" },
          { team: "TV Hörde", outNum: 18, outName: "Pieper", inNum: 9, inName: "Müller" }
        ]);
      }, 17000);

      // 5. Satzende / Startaufstellung Satz 2
      setTimeout(() => {
        showVnlLineup("Satz 2 – Startaufstellung", hTeam, gTeam, lineUp1, lineUp2);
      }, 21000);

      setTimeout(() => {
        hideVnlLineup();
        updateUI({ team1: hTeam, team2: gTeam, p1: 0, p2: 0, s1: 1, s2: 0 });
      }, 27000);
    }
  </script>
</body>
</html>

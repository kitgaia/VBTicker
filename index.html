<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Volleyball Scoreboard Overlay - VNL Edition v1.3</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: transparent;
      font-family: 'Helvetica Neue', Arial, sans-serif;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
    }

    /* Team-Farben Variablen */
    :root {
      --color-home: #00f2fe;
      --color-guest: #f59e0b;
    }

    /* Container für Scoreboard + Sub-Popups oben links */
    .scoreboard-wrapper {
      position: absolute;
      top: 30px;
      left: 30px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      z-index: 10;
    }

    /* VNL Haupt-Scoreboard */
    .scoreboard {
      display: inline-flex;
      align-items: center;
      background: linear-gradient(135deg, #030712 0%, #0f172a 100%);
      border-radius: 4px;
      padding: 10px 22px;
      color: #ffffff;
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.8);
      border-left: 6px solid var(--color-home);
      border-right: 6px solid var(--color-guest);
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      border-bottom: 2px solid rgba(255, 255, 255, 0.1);
      font-weight: 800;
      gap: 18px;
    }

    .team { display: flex; align-items: center; gap: 14px; }
    
    .team-logo {
      width: 32px;
      height: 32px;
      object-fit: contain;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
    }

    .team-name {
      font-size: 21px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      max-width: 170px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-weight: 900;
    }

    .points {
      background: var(--color-home);
      color: #030712;
      font-size: 30px;
      font-weight: 900;
      padding: 2px 14px;
      border-radius: 2px;
      min-width: 55px;
      text-align: center;
      box-shadow: inset 0 2px 4px rgba(0,0,0,0.2);
    }
    .guest .points { background: var(--color-guest); color: #030712; }

    .sets-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 0 12px;
      border-left: 2px solid rgba(255,255,255,0.1);
      border-right: 2px solid rgba(255,255,255,0.1);
    }
    .sets-score { font-size: 22px; color: #f8fafc; letter-spacing: 3px; font-weight: 900; }
    .sets-label { font-size: 8px; color: #38bdf8; text-transform: uppercase; letter-spacing: 2px; font-weight: 900; }

    /* Auswechslungs-Popups (Nur Nummern, Namen & Pfeil) */
    .sub-container {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .sub-popup {
      background: rgba(3, 7, 18, 0.95);
      border-left: 4px solid var(--color-home);
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      border-right: 1px solid rgba(255, 255, 255, 0.1);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding: 8px 14px;
      border-radius: 4px;
      color: #ffffff;
      font-size: 13px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.7);
      display: flex;
      align-items: center;
      gap: 12px;
      opacity: 0;
      transform: translateY(-10px);
      transition: all 0.3s ease;
      max-width: 400px;
    }
    .sub-popup.guest-sub { border-left-color: var(--color-guest); }
    .sub-popup.show { opacity: 1; transform: translateY(0); }
    .sub-tag {
      background: var(--color-home);
      color: #030712;
      font-size: 9px;
      font-weight: 900;
      padding: 2px 6px;
      border-radius: 2px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .guest-sub .sub-tag { background: var(--color-guest); }
    .sub-out { color: #f87171; font-weight: 800; text-decoration: line-through; }
    .sub-in { color: #4ade80; font-weight: 800; }
    .sub-icon { font-weight: bold; color: #fbbf24; margin: 0 4px; }

    /* Versions-Badge unten rechts */
    .version-badge {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: rgba(3, 7, 18, 0.85);
      border: 1px solid rgba(0, 242, 254, 0.4);
      color: var(--color-home);
      font-size: 11px;
      font-weight: 900;
      padding: 4px 10px;
      border-radius: 4px;
      letter-spacing: 1.5px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.6);
      z-index: 1000;
      text-transform: uppercase;
      backdrop-filter: blur(4px);
    }

    /* VNL FULLSCREEN SPIELFELD-OVERLAY (Im Stil deines Bildes) */
    .vnl-fullscreen {
      position: fixed;
      top: 6%;
      left: 6%;
      width: 88vw;
      height: 88vh;
      background: radial-gradient(circle at center, #0f172a 0%, #030712 100%);
      border: 2px solid var(--color-home);
      backdrop-filter: blur(16px);
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 25px 35px;
      color: white;
      opacity: 0;
      pointer-events: none;
      transform: scale(0.96);
      transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 100;
      box-shadow: 0 30px 80px rgba(0,0,0,0.9);
    }
    .vnl-fullscreen.guest-mode { border-color: var(--color-guest); }
    .vnl-active { opacity: 1; pointer-events: auto; transform: scale(1); }

    .vnl-top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid rgba(255, 255, 255, 0.15);
      padding-bottom: 12px;
    }
    .vnl-event-title {
      font-size: 22px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 2.5px;
      color: #ffffff;
      text-shadow: 0 0 15px rgba(0, 242, 254, 0.6);
    }
    .guest-mode .vnl-event-title { text-shadow: 0 0 15px rgba(245, 158, 11, 0.6); }
    .vnl-match-subtitle {
      font-size: 13px;
      color: #38bdf8;
      letter-spacing: 1px;
      text-transform: uppercase;
      font-weight: 800;
    }

    /* Spielfeld-Container im perspektivischen Look */
    .vnl-court-perspective {
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      background: linear-gradient(180deg, rgba(15, 23, 42, 0.7) 0%, rgba(3, 7, 18, 0.9) 100%);
      border: 3px solid var(--color-home);
      border-radius: 8px;
      margin: 15px 0;
      padding: 25px 40px;
      position: relative;
    }
    .guest-mode .vnl-court-perspective { border-color: var(--color-guest); }

    /* Angriffslinie / Netz-Visualisierung in der Mitte */
    .court-net-line {
      position: absolute;
      top: 50%;
      left: 10%;
      width: 80%;
      height: 2px;
      border-top: 2px dashed rgba(255, 255, 255, 0.4);
    }

    .vnl-court-header {
      font-size: 20px;
      font-weight: 900;
      text-transform: uppercase;
      color: var(--color-home);
      text-align: center;
      letter-spacing: 2px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-bottom: 10px;
    }
    .guest-mode .vnl-court-header { color: var(--color-guest); }

    /* Reihen: Vorderreihe (Zone 4,3,2) oben, Hinterreihe (Zone 5,6,1) unten */
    .court-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      max-width: 950px;
      margin: 0 auto;
      width: 100%;
      z-index: 2;
    }

    .vnl-player-card {
      background: rgba(15, 23, 42, 0.95);
      border: 1px solid rgba(0, 242, 254, 0.4);
      border-radius: 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 14px 10px;
      text-align: center;
      position: relative;
      box-shadow: 0 10px 20px rgba(0,0,0,0.6);
    }
    .guest-mode .vnl-player-card { border-color: rgba(245, 158, 11, 0.4); }

    .vnl-p-number {
      font-size: 24px;
      font-weight: 900;
      color: #030712;
      background: var(--color-home);
      min-width: 44px;
      height: 38px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 4px;
      margin-bottom: 6px;
    }
    .guest-mode .vnl-p-number { background: var(--color-guest); }

    .vnl-p-name {
      font-size: 14px;
      font-weight: 800;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 100%;
      letter-spacing: 0.5px;
    }

    .vnl-p-pos {
      font-size: 9px;
      color: #38bdf8;
      text-transform: uppercase;
      letter-spacing: 1px;
      font-weight: 700;
      margin-top: 2px;
    }

    .vnl-zone-label {
      position: absolute;
      top: 4px;
      right: 8px;
      font-size: 8px;
      color: rgba(255,255,255,0.4);
      font-weight: 900;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>

  <!-- Versions-Badge -->
  <div class="version-badge">v1.3</div>

  <!-- Scoreboard & Sub-Popups -->
  <div class="scoreboard-wrapper">
    <div class="scoreboard" id="main-scoreboard">
      <div class="team home">
        <img id="team1-logo" class="team-logo" src="" style="display:none;" alt="">
        <span id="team1-name" class="team-name">HEIM</span>
        <span id="team1-points" class="points">0</span>
      </div>

      <div class="sets-container">
        <span class="sets-label">SÄTZE</span>
        <span id="sets-score" class="sets-score">0 : 0</span>
      </div>

      <div class="team guest">
        <span id="team2-points" class="points">0</span>
        <span id="team2-name" class="team-name">GAST</span>
        <img id="team2-logo" class="team-logo" src="" style="display:none;" alt="">
      </div>
    </div>

    <div id="sub-container" class="sub-container"></div>
  </div>

  <!-- VNL Fullscreen Spielfeld-Overlay (im Look der Vorlage) -->
  <div id="vnl-overlay" class="vnl-fullscreen">
    <div class="vnl-top-bar">
      <div id="vnl-title" class="vnl-event-title">Satz 1 – Startaufstellung</div>
      <div id="vnl-subtitle" class="vnl-match-subtitle">SC Halle vs. TV Hörde</div>
    </div>

    <div class="vnl-court-perspective">
      <div class="court-net-line"></div>
      
      <div class="vnl-court-header">
        <img id="vnl-team-logo" class="team-logo" style="width:30px; height:30px; display:none;" alt="">
        <span id="vnl-single-team-name">SC Halle</span>
      </div>

      <!-- Oben: Vorderreihe (Zonen 4, 3, 2) -->
      <div class="court-row" id="vnl-front-row"></div>

      <!-- Unten: Hinterreihe (Zonen 5, 6, 1) -->
      <div class="court-row" id="vnl-back-row"></div>
    </div>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    let matchId = urlParams.get('match') || 'a27bea5a-1330-4f40-b567-64c138dbd7ba';

    if (matchId === 'test') {
      runTestSimulation();
    } else {
      fetchScore();
      setInterval(fetchScore, 1500);
    }

    async function fetchScore() {
      try {
        const myWorker = "https://withered-sea-3b06.nick-valbert2006.workers.dev"; 
        const response = await fetch(`${myWorker}/?match=${matchId}`);
        if (!response.ok) return;

        const data = await response.json();
        const matchInfo = data.match || {};
        const stateInfo = data.state || {};

        let currentSetScore = { team1: 0, team2: 0 };
        if (stateInfo.matchSets && stateInfo.matchSets.length > 0) {
          const latestSet = stateInfo.matchSets[stateInfo.matchSets.length - 1];
          if (latestSet && latestSet.setScore) currentSetScore = latestSet.setScore;
        }

        updateUI({
          team1: matchInfo.teamDescription1 || 'Heim',
          team2: matchInfo.teamDescription2 || 'Gast',
          logo1: matchInfo.teamLogo1 || matchInfo.logo1 || null,
          logo2: matchInfo.teamLogo2 || matchInfo.logo2 || null,
          p1: currentSetScore.team1 ?? 0,
          p2: currentSetScore.team2 ?? 0,
          s1: stateInfo.setPoints?.team1 ?? 0,
          s2: stateInfo.setPoints?.team2 ?? 0
        });
      } catch (err) {
        console.error('Ticker-Fehler:', err);
      }
    }

    function updateUI(d) {
      document.getElementById('team1-name').innerText = d.team1;
      document.getElementById('team2-name').innerText = d.team2;
      document.getElementById('team1-points').innerText = d.p1;
      document.getElementById('team2-points').innerText = d.p2;
      document.getElementById('sets-score').innerText = `${d.s1} : ${d.s2}`;

      const logo1El = document.getElementById('team1-logo');
      if (d.logo1) { logo1El.src = d.logo1; logo1El.style.display = 'block'; }

      const logo2El = document.getElementById('team2-logo');
      if (d.logo2) { logo2El.src = d.logo2; logo2El.style.display = 'block'; }
    }

    // Zeigt die Startaufstellung im getrennten Vorder- und Hinterreihen-Layout
    function showTeamLineup(title, matchSub, teamName, players, logoUrl = null, isGuest = false) {
      document.getElementById('vnl-title').innerText = title;
      document.getElementById('vnl-subtitle').innerText = matchSub;
      document.getElementById('vnl-single-team-name').innerText = teamName;

      const overlay = document.getElementById('vnl-overlay');
      if (isGuest) { overlay.classList.add('guest-mode'); } 
      else { overlay.classList.remove('guest-mode'); }

      const logoEl = document.getElementById('vnl-team-logo');
      if (logoUrl) { logoEl.src = logoUrl; logoEl.style.display = 'block'; } 
      else { logoEl.style.display = 'none'; }

      // Spieler aufteilen: Index 0,1,2 = Vorderreihe (Zone 4, 3, 2) | Index 3,4,5 = Hinterreihe (Zone 5, 6, 1)
      const frontPlayers = players.slice(0, 3);
      const backPlayers = players.slice(3, 6);
      const frontZones = ["Zone 4", "Zone 3", "Zone 2"];
      const backZones = ["Zone 5", "Zone 6", "Zone 1"];

      document.getElementById('vnl-front-row').innerHTML = frontPlayers.map((p, idx) => `
        <div class="vnl-player-card">
          <span class="vnl-zone-label">${frontZones[idx]}</span>
          <div class="vnl-p-number">${p.number}</div>
          <div class="vnl-p-name">${p.name}</div>
          <div class="vnl-p-pos">${p.pos}</div>
        </div>
      `).join('');

      document.getElementById('vnl-back-row').innerHTML = backPlayers.map((p, idx) => `
        <div class="vnl-player-card">
          <span class="vnl-zone-label">${backZones[idx]}</span>
          <div class="vnl-p-number">${p.number}</div>
          <div class="vnl-p-name">${p.name}</div>
          <div class="vnl-p-pos">${p.pos}</div>
        </div>
      `).join('');

      overlay.classList.add('vnl-active');
    }

    function hideVnlLineup() {
      document.getElementById('vnl-overlay').classList.remove('vnl-active');
    }

    function showSubPopup(substitutions, isGuest = false) {
      const subs = Array.isArray(substitutions) ? substitutions : [substitutions];
      const container = document.getElementById('sub-container');

      subs.forEach(sub => {
        const popup = document.createElement('div');
        popup.className = `sub-popup ${isGuest ? 'guest-sub' : ''}`;
        popup.innerHTML = `
          <span class="sub-tag">${sub.team}</span>
          <span>
            <span class="sub-out">${sub.outNum} ${sub.outName}</span> 
            <span class="sub-icon">⇄</span> 
            <span class="sub-in">${sub.inNum} ${sub.inName}</span>
          </span>
        `;
        
        container.appendChild(popup);
        setTimeout(() => popup.classList.add('show'), 50);

        setTimeout(() => {
          popup.classList.remove('show');
          setTimeout(() => popup.remove(), 300);
        }, 5000);
      });
    }

    function runTestSimulation() {
      const hTeam = "SC Halle";
      const gTeam = "TV Hörde";
      const matchSub = `${hTeam} vs. ${gTeam}`;

      const lineUp1 = [
        { number: 4, name: "Nikolas Jensen", pos: "Annahme" },
        { number: 5, name: "Grady Ford", pos: "Mitte" },
        { number: 6, name: "Alexi Ulrich", pos: "Diagonal" },
        { number: 1, name: "Omenga Jona", pos: "Annahme" },
        { number: 2, name: "Robert Schulz", pos: "Zuspiel" },
        { number: 3, name: "Milan Jaksic", pos: "Libero" }
      ];

      const lineUp2 = [
        { number: 11, name: "Reutter", pos: "Annahme" },
        { number: 6, name: "Frenz", pos: "Mitte" },
        { number: 18, name: "Pieper", pos: "Diagonal" },
        { number: 3, name: "Köster", pos: "Mitte" },
        { number: 22, name: "Schulenburg", pos: "Zuspiel" },
        { number: 7, name: "Herbort", pos: "Libero" }
      ];

      updateUI({ team1: hTeam, team2: gTeam, p1: 0, p2: 0, s1: 0, s2: 0 });

      // 1. Heimteam Aufstellung (Vorderreihe oben, Hinterreihe unten)
      showTeamLineup("Satz 1 – Startaufstellung", matchSub, hTeam, lineUp1, null, false);

      // Nach 4 Sekunden Gastteam Aufstellung
      setTimeout(() => {
        showTeamLineup("Satz 1 – Startaufstellung", matchSub, gTeam, lineUp2, null, true);
      }, 4000);

      setTimeout(() => { hideVnlLineup(); }, 8000);

      setTimeout(() => {
        updateUI({ team1: hTeam, team2: gTeam, p1: 8, p2: 6, s1: 0, s2: 0 });
      }, 10000);

      setTimeout(() => {
        showSubPopup({ team: "SC Halle", outNum: 2, outName: "Robert Schulz", inNum: 10, inName: "Havryliuk" }, false);
      }, 13000);
    }
  </script>
</body>
</html>
